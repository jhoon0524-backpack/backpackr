name: ai-loop

# 깃헙에서 도는 자율 루프.
# 항상 켜진 컴퓨터가 없는 대신, 예약된 시간마다 깃헙이 컴퓨터를 잠깐 빌려줘서
# "딱 한 바퀴"를 돌고 결과를 커밋·푸시한다. (loop/loop.sh 의 깃헙판)
#
# 켜는 조건 (셋 다 필요):
#   1. 이 파일이 저장소의 "기본 브랜치"에 있어야 예약 실행이 작동한다
#   2. Settings > Secrets and variables > Actions 에 ANTHROPIC_API_KEY
#      (또는 CLAUDE_CODE_OAUTH_TOKEN) 등록
#   3. 멈추고 싶으면: loop/STOP 파일을 커밋하거나, Actions 탭에서 이 워크플로우 Disable
#
# 주의: 비공개 저장소는 Actions 실행 시간이 요금제 분량을 소모한다.
#       기본을 6시간마다(하루 4바퀴)로 잡았다. 더 자주 돌리려면 cron 을 수정.

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 한 바퀴 (UTC 기준 0·6·12·18시)
  workflow_dispatch: {}      # Actions 탭 "Run workflow" 버튼으로 수동 한 바퀴

# 바퀴가 겹쳐 돌지 않게 한 번에 하나만
concurrency:
  group: ai-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  one-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 멈춤 스위치와 열쇠 확인
        id: gate
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ -f loop/STOP ]; then
            echo "loop/STOP 파일이 있어 이번 바퀴를 건너뜁니다."
            echo "run=no" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != "true" ]; then
            echo "API 키 시크릿이 없어 건너뜁니다. Settings > Secrets 에 ANTHROPIC_API_KEY 를 등록하세요."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 클로드 설치
        if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 클로드 CLI 설치
        if: steps.gate.outputs.run == 'yes'
        run: npm install -g @anthropic-ai/claude-code

      - name: 한 바퀴 작업
        if: steps.gate.outputs.run == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "loop/PROMPT.md 를 읽고, 거기 적힌 지시대로 한 바퀴만 작업해라.
          단, 이 환경에서는 두 가지가 다르다:
          1) 커밋·푸시는 하지 마라. 워크플로우가 뒤에서 대신한다.
          2) Godot 실행·스크린샷이 필요한 QA 는 이 환경에서 불가능하다.
             그런 검증은 건너뛰되, '미검증' 상태임을 MyAIGame/PROGRESS.md 에 정직하게 남겨라.
             화면 검증이 필수인 작업이라면 손대지 말고, 검증 없이 가능한 다음 작업을 골라라." \
            --model claude-sonnet-5 \
            --max-turns 40 \
            --permission-mode acceptEdits \
            --allowedTools "Bash(python3:*),Bash(pip:*),Bash(pip3:*)"

      - name: 결과 커밋·푸시
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "ai-loop"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            git commit -m "loop: 자동 바퀴 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
