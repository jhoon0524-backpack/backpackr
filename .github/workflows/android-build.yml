name: Android Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 저장소에 gradle wrapper가 없으므로 Gradle을 직접 설치한다 (AGP 8.5는 Gradle 8.7+)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 릴리스 페이지에 최신 APK를 올려 폰 브라우저에서 바로 내려받을 수 있게 한다
      # (Actions Artifacts는 모바일 웹에서 다운로드 버튼이 없음)
      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "최신 테스트 빌드 (자동 갱신)"
          body: "가장 최근 push에서 자동 빌드된 디버그 APK입니다. 아래 app-debug.apk를 탭해서 설치하세요."
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
