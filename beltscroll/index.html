<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Belt Brawl</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111318; color: #e8e8ef; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; overscroll-behavior: none; }
  #stage { position: relative; width: min(100%, 960px, calc((100vh - 32px) * 16 / 9)); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; background: #000; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .help { font-size: 13px; color: #9aa0ad; text-align: center; line-height: 1.6; }
  .help b { color: #e8e8ef; }
  /* 터치 조작: 터치 기기에서만 보인다 */
  .touch { display: none; }
  body.has-touch .touch { display: block; }
  body.has-touch .btn { display: flex; }
  body.has-touch .help { display: none; }
  #stick { position: absolute; left: 0; top: 0; width: 55%; height: 100%; }
  #stick .base, #stick .knob { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .15s; }
  #stick .base { width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.08); }
  #stick .knob { width: 50px; height: 50px; margin: -25px 0 0 -25px; background: rgba(255,255,255,.6); }
  #stick.active .base, #stick.active .knob { opacity: 1; }
  .btn { position: absolute; width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); color: #fff; font: bold 15px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  .btn:active, .btn.down { background: rgba(255,255,255,.4); }
  #btnAttack { right: 6%; bottom: 10%; }
  #btnJump { right: 18%; bottom: 32%; }
  @media (max-height: 420px) { body { padding: 6px; } .btn { width: 60px; height: 60px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="stick" class="touch"><div class="base"></div><div class="knob"></div></div>
  <div id="btnJump" class="btn touch">점프</div>
  <div id="btnAttack" class="btn touch">공격</div>
</div>
<div class="help">
  <b>이동</b> 방향키 / WASD &nbsp;·&nbsp; <b>공격</b> Z 또는 J &nbsp;·&nbsp; <b>점프</b> X 또는 K &nbsp;·&nbsp; <b>시작/재시작</b> Enter
</div>
<script>
'use strict';

// ===== 기본 설정 =====
const W = 960, H = 540;
const GROUND_TOP = 310, GROUND_BOTTOM = 520;   // 걸을 수 있는 깊이 범위 (y)
const STAGE_LENGTH = 3600;                     // 스테이지 전체 길이 (x)

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const keys = {};
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (!e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
let pressed = {};   // 이번 프레임에 새로 눌린 키

const down = (...codes) => codes.some(c => keys[c]);

// ===== 터치 조작 (키보드와 같은 keys/pressed 에 넣는다) =====
const stage = document.getElementById('stage');
const stick = document.getElementById('stick');
const knob = stick.querySelector('.knob'), base = stick.querySelector('.base');
let stickId = null, stickOrigin = null;
const STICK_RADIUS = 45, DEAD = 12;

function setStickKeys(dx, dy) {
  keys.ArrowLeft = dx < -DEAD; keys.ArrowRight = dx > DEAD;
  keys.ArrowUp = dy < -DEAD;   keys.ArrowDown = dy > DEAD;
}
stick.addEventListener('pointerdown', e => {
  if (stickId !== null) return;
  document.body.classList.add('has-touch');
  stickId = e.pointerId; stickOrigin = { x: e.clientX, y: e.clientY };
  const r = stage.getBoundingClientRect();
  base.style.left = knob.style.left = (e.clientX - r.left) + 'px';
  base.style.top = knob.style.top = (e.clientY - r.top) + 'px';
  stick.classList.add('active');
  stick.setPointerCapture(e.pointerId);
  tapToStart();
});
stick.addEventListener('pointermove', e => {
  if (e.pointerId !== stickId) return;
  let dx = e.clientX - stickOrigin.x, dy = e.clientY - stickOrigin.y;
  const len = Math.hypot(dx, dy);
  if (len > STICK_RADIUS) { dx *= STICK_RADIUS / len; dy *= STICK_RADIUS / len; }
  const r = stage.getBoundingClientRect();
  knob.style.left = (stickOrigin.x + dx - r.left) + 'px';
  knob.style.top = (stickOrigin.y + dy - r.top) + 'px';
  setStickKeys(dx, dy);
});
const stickEnd = e => {
  if (e.pointerId !== stickId) return;
  stickId = null; stick.classList.remove('active'); setStickKeys(0, 0);
};
stick.addEventListener('pointerup', stickEnd);
stick.addEventListener('pointercancel', stickEnd);

function bindButton(id, code) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.classList.add('down');
    pressed[code] = true; keys[code] = true;
    tapToStart();
  });
  const up = () => { el.classList.remove('down'); keys[code] = false; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
bindButton('btnAttack', 'KeyZ');
bindButton('btnJump', 'KeyX');

// 시작/게임오버/클리어 화면에서는 아무 데나 탭하면 Enter 와 같다
function tapToStart() { if (state !== 'play') pressed.Enter = true; }
canvas.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') document.body.classList.add('has-touch'); tapToStart(); });
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.body.classList.add('has-touch');
const hit = (...codes) => codes.some(c => pressed[c]);

// ===== 웨이브 구성 =====
// lockX: 이 지점에 도달하면 카메라가 잠기고 적이 나온다.
const WAVES = [
  { lockX: 300,  enemies: [{ type: 'thug' }, { type: 'thug' }] },
  { lockX: 1500, enemies: [{ type: 'thug' }, { type: 'thug' }, { type: 'brute' }] },
  { lockX: 2800, enemies: [{ type: 'thug' }, { type: 'brute' }, { type: 'brute' }, { type: 'thug' }] },
];

const ENEMY_TYPES = {
  thug:  { hp: 30, speed: 1.4, w: 34, h: 70, dmg: 8,  color: '#d9534f', score: 100, windup: 28 },
  brute: { hp: 70, speed: 1.0, w: 46, h: 84, dmg: 15, color: '#8e5bd6', score: 300, windup: 40 },
};

// ===== 상태 =====
let state, player, enemies, particles, cam, waveIndex, waveState, score, shake, time;

function reset() {
  state = 'title';
  player = {
    x: 120, y: 420, z: 0, vz: 0, dir: 1, w: 36, h: 76,
    hp: 100, maxHp: 100, speed: 3.2,
    attack: 0, combo: 0, comboTimer: 0, hitstun: 0, invuln: 0, down: 0,
  };
  enemies = [];
  particles = [];
  cam = 0;
  waveIndex = 0;
  waveState = 'walk';   // walk → fight → clear
  score = 0;
  shake = 0;
  time = 0;
}
reset();

function spawnWave(i) {
  const wave = WAVES[i];
  wave.enemies.forEach((e, k) => {
    const t = ENEMY_TYPES[e.type];
    const fromRight = k % 3 !== 2;    // 대부분 오른쪽, 가끔 왼쪽에서
    enemies.push({
      type: e.type, ...t, maxHp: t.hp,
      x: cam + (fromRight ? W + 40 + k * 60 : -60 - k * 40),
      y: GROUND_TOP + 30 + Math.random() * (GROUND_BOTTOM - GROUND_TOP - 60),
      z: 0, vz: 0, dir: fromRight ? -1 : 1,
      hitstun: 0, down: 0, attack: 0, cooldown: 60 + k * 30, dead: 0, flash: 0, entered: false,
    });
  });
}

// ===== 유틸 =====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlapDepth = (a, b) => Math.abs(a.y - b.y) < 22;

function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 5 - 1, life: 30 + Math.random() * 15, color });
  }
}

function damageEnemy(e, dmg, knockdown, dir) {
  e.hp -= dmg;
  e.flash = 6;
  e.attack = 0;
  burst(e.x, e.y - e.h / 2 - e.z, '#ffd36b');
  shake = Math.max(shake, knockdown ? 8 : 3);
  if (e.hp <= 0 || knockdown) {
    e.down = 50;
    e.vz = 6;
    e.z = Math.max(e.z, 1);
    e.x += dir * 24;
    e.hitstun = 0;
  } else {
    e.hitstun = 16;
    e.x += dir * 8;
  }
  if (e.hp <= 0) { score += e.score; }
}

function damagePlayer(dmg, dir, knockdown) {
  if (player.invuln > 0 || player.down > 0) return;
  player.hp = Math.max(0, player.hp - dmg);
  player.attack = 0; player.combo = 0;
  burst(player.x, player.y - player.h / 2 - player.z, '#ff6b6b');
  shake = Math.max(shake, 6);
  if (knockdown || player.hp <= 0) {
    player.down = 50; player.vz = 6; player.z = Math.max(player.z, 1); player.x += dir * 30;
  } else {
    player.hitstun = 14; player.x += dir * 10;
  }
  player.invuln = 40;
  if (player.hp <= 0) state = 'gameover';
}

// ===== 업데이트 =====
function update() {
  time++;
  if (state === 'title' || state === 'gameover' || state === 'clear') {
    if (hit('Enter')) { reset(); state = 'play'; }
    return;
  }

  // --- 플레이어 ---
  const p = player;
  if (p.invuln > 0) p.invuln--;
  if (p.comboTimer > 0 && --p.comboTimer === 0) p.combo = 0;

  // 공중 물리
  if (p.z > 0 || p.vz !== 0) { p.z += p.vz; p.vz -= 0.45; if (p.z <= 0) { p.z = 0; p.vz = 0; } }

  if (p.down > 0) {
    p.down--;
    if (p.down === 0 && p.hp <= 0) state = 'gameover';
  } else if (p.hitstun > 0) {
    p.hitstun--;
  } else if (p.attack > 0) {
    p.attack--;
    // 타격 판정은 공격 모션 중간 한 프레임에만
    if (p.attack === 10) {
      const heavy = p.combo === 3;
      const reach = heavy ? 58 : 48;
      for (const e of enemies) {
        if (e.dead || e.down > 0) continue;
        const dx = (e.x - p.x) * p.dir;
        if (dx > -10 && dx < reach && overlapDepth(p, e) && Math.abs(e.z - p.z) < 40) {
          damageEnemy(e, heavy ? 18 : 10, heavy, p.dir);
        }
      }
    }
  } else {
    let mx = 0, my = 0;
    if (down('ArrowLeft', 'KeyA')) mx -= 1;
    if (down('ArrowRight', 'KeyD')) mx += 1;
    if (down('ArrowUp', 'KeyW')) my -= 1;
    if (down('ArrowDown', 'KeyS')) my += 1;
    if (mx !== 0 && p.z === 0) p.dir = mx;
    const len = Math.hypot(mx, my) || 1;
    p.x += (mx / len) * p.speed;
    p.y += (my / len) * p.speed * 0.6;

    if (hit('KeyZ', 'KeyJ') && p.z === 0) {
      p.combo = p.comboTimer > 0 ? p.combo + 1 : 1;
      if (p.combo > 3) p.combo = 1;
      p.attack = p.combo === 3 ? 26 : 18;
      p.comboTimer = 40;
    }
    if (hit('KeyX', 'KeyK') && p.z === 0) { p.vz = 9; p.z = 1; }
  }

  // 이동 범위 제한
  p.y = clamp(p.y, GROUND_TOP, GROUND_BOTTOM);
  const leftWall = cam + 20;
  const rightWall = waveState === 'fight' ? cam + W - 20 : Math.min(STAGE_LENGTH - 20, cam + W + 200);
  p.x = clamp(p.x, leftWall, rightWall);

  // --- 카메라 / 웨이브 ---
  if (waveState !== 'fight') {
    const target = clamp(p.x - W * 0.4, 0, STAGE_LENGTH - W);
    if (target > cam) cam += Math.min(target - cam, 6);
  }
  if (waveState === 'walk' && waveIndex < WAVES.length && p.x >= WAVES[waveIndex].lockX) {
    waveState = 'fight';
    spawnWave(waveIndex);
  }
  if (waveState === 'fight' && enemies.every(e => e.dead)) {
    enemies = [];
    waveIndex++;
    waveState = waveIndex >= WAVES.length ? 'done' : 'walk';
    if (waveState === 'done') { state = 'clear'; score += 1000; }
  }

  // --- 적 ---
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash--;
    if (e.z > 0 || e.vz !== 0) { e.z += e.vz; e.vz -= 0.45; if (e.z <= 0) { e.z = 0; e.vz = 0; } }

    if (e.down > 0) {
      e.down--;
      if (e.down === 0 && e.hp <= 0) { e.dead = 1; burst(e.x, e.y - 30, '#ffffff', 14); }
      continue;
    }
    if (e.hitstun > 0) { e.hitstun--; continue; }
    if (e.cooldown > 0) e.cooldown--;

    const dx = p.x - e.x, dy = p.y - e.y;
    e.dir = dx > 0 ? 1 : -1;

    if (e.attack > 0) {
      e.attack--;
      if (e.attack === 8) {   // 준비 동작 끝에 타격
        if (Math.abs(dx) < 52 && overlapDepth(e, p) && p.z < 30) damagePlayer(e.dmg, e.dir, e.type === 'brute');
      }
      continue;
    }

    // 플레이어 옆 자리(좌 또는 우)로 접근
    const wantX = p.x - e.dir * 44;
    const ddx = wantX - e.x;
    if (Math.abs(ddx) > 4) e.x += Math.sign(ddx) * e.speed;
    if (Math.abs(dy) > 4) e.y += Math.sign(dy) * e.speed * 0.7;
    e.y = clamp(e.y, GROUND_TOP, GROUND_BOTTOM);
    // 한 번 화면에 들어온 적은 화면 밖으로 숨지 못한다
    if (e.x > cam + 20 && e.x < cam + W - 20) e.entered = true;
    if (e.entered) e.x = clamp(e.x, cam + 20, cam + W - 20);

    if (Math.abs(dx) < 54 && Math.abs(dy) < 16 && e.cooldown <= 0 && p.down === 0) {
      e.attack = e.windup;
      e.cooldown = 90 + Math.floor(Math.random() * 60);
    }
  }

  // 적끼리 겹침 완화
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    if (a.dead || b.dead) continue;
    if (Math.abs(a.x - b.x) < 30 && Math.abs(a.y - b.y) < 14) {
      const s = a.x < b.x ? -1 : 1; a.x += s * 0.8; b.x -= s * 0.8;
    }
  }

  // --- 파티클 ---
  for (const q of particles) { q.x += q.vx; q.y += q.vy; q.vy += 0.3; q.life--; }
  particles = particles.filter(q => q.life > 0);
  if (shake > 0) shake--;
}

// ===== 그리기 =====
function drawBackground() {
  // 하늘
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_TOP);
  sky.addColorStop(0, '#1b1f3a'); sky.addColorStop(1, '#4a2f5a');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND_TOP);

  // 먼 건물 (느린 패럴랙스)
  ctx.fillStyle = '#242846';
  for (let i = -1; i < 14; i++) {
    const bx = ((i * 180 - cam * 0.3) % (W + 360) + W + 360) % (W + 360) - 180;
    const bh = 90 + ((i * 53) % 90);
    ctx.fillRect(bx, GROUND_TOP - bh, 120, bh);
  }
  // 가까운 건물 + 창문
  for (let i = -1; i < 10; i++) {
    const bx = ((i * 260 - cam * 0.6) % (W + 520) + W + 520) % (W + 520) - 260;
    const bh = 140 + ((i * 97) % 110);
    ctx.fillStyle = '#15172b'; ctx.fillRect(bx, GROUND_TOP - bh, 200, bh);
    ctx.fillStyle = '#f0c75e';
    for (let r = 0; r < bh / 28 - 1; r++) for (let c = 0; c < 5; c++) {
      if (((i * 7 + r * 3 + c) % 4) === 0) ctx.fillRect(bx + 16 + c * 36, GROUND_TOP - bh + 14 + r * 28, 14, 16);
    }
  }
  // 바닥
  ctx.fillStyle = '#3a3a44'; ctx.fillRect(0, GROUND_TOP, W, H - GROUND_TOP);
  ctx.fillStyle = '#2d2d36';
  for (let x = -((cam) % 80); x < W; x += 80) ctx.fillRect(x, GROUND_TOP, 40, H - GROUND_TOP);
  ctx.fillStyle = '#50505c'; ctx.fillRect(0, GROUND_TOP, W, 6);
}

function drawFighter(f, isPlayer) {
  const sx = f.x - cam;
  const baseY = f.y;
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(sx, baseY, f.w * 0.7, 8, 0, 0, Math.PI * 2); ctx.fill();

  const top = baseY - f.h - f.z;
  let body = isPlayer ? '#4fa3ff' : f.color;
  if (f.flash > 0) body = '#ffffff';
  if (isPlayer && f.invuln > 0 && Math.floor(time / 3) % 2) body = '#a9d3ff';

  ctx.save();
  if (f.down > 0) {   // 쓰러진 모습: 눕힌다
    ctx.translate(sx, baseY - f.z);
    ctx.rotate(-f.dir * Math.PI / 2);
    ctx.translate(-sx, -(baseY - f.z));
  }
  // 몸통
  ctx.fillStyle = body;
  ctx.fillRect(sx - f.w / 2, top + 18, f.w, f.h - 18);
  // 머리
  ctx.fillStyle = isPlayer ? '#ffd9b3' : '#e8c39e';
  ctx.fillRect(sx - 12, top, 24, 20);
  // 눈 (방향 표시)
  ctx.fillStyle = '#222';
  ctx.fillRect(sx + f.dir * 5 - 2, top + 7, 4, 4);
  // 팔: 공격 중이면 앞으로 뻗음
  ctx.fillStyle = isPlayer ? '#ffd9b3' : '#e8c39e';
  if (f.attack > 0 && f.attack < (isPlayer ? 14 : 10)) {
    const reach = isPlayer && f.combo === 3 ? 44 : 34;
    ctx.fillRect(f.dir > 0 ? sx + f.w / 2 : sx - f.w / 2 - reach, top + 30, reach, 10);
  } else if (!isPlayer && f.attack > 0) {
    // 적 준비 동작: 팔을 뒤로 당김 (경고)
    ctx.fillRect(f.dir > 0 ? sx - f.w / 2 - 16 : sx + f.w / 2, top + 26, 16, 10);
  }
  ctx.restore();

  // 적 체력바
  if (!isPlayer && f.hp < f.maxHp && f.hp > 0) {
    ctx.fillStyle = '#000'; ctx.fillRect(sx - 20, top - 12, 40, 5);
    ctx.fillStyle = '#ff5c5c'; ctx.fillRect(sx - 20, top - 12, 40 * f.hp / f.maxHp, 5);
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, 48);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('PLAYER', 16, 20);
  ctx.fillStyle = '#333'; ctx.fillRect(16, 26, 220, 12);
  ctx.fillStyle = player.hp > 30 ? '#4cd964' : '#ff5c5c'; ctx.fillRect(16, 26, 220 * player.hp / player.maxHp, 12);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText(`WAVE ${Math.min(waveIndex + 1, WAVES.length)} / ${WAVES.length}`, W / 2, 30);
  ctx.textAlign = 'right';
  ctx.fillText(`SCORE ${String(score).padStart(6, '0')}`, W - 16, 30);

  if (state === 'play' && waveState === 'walk' && Math.floor(time / 20) % 2) {
    ctx.fillStyle = '#ffd36b'; ctx.font = 'bold 36px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('GO →', W - 30, H / 2);
  }
}

function drawOverlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 56px system-ui, sans-serif'; ctx.fillText(title, W / 2, H / 2 - 20);
  ctx.font = '20px system-ui, sans-serif'; ctx.fillStyle = '#cfd3dc'; ctx.fillText(sub, W / 2, H / 2 + 30);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawBackground();

  // 깊이(y) 순으로 정렬해서 뒤에 있는 캐릭터부터 그린다
  const all = [player, ...enemies.filter(e => !e.dead)].sort((a, b) => a.y - b.y);
  for (const f of all) drawFighter(f, f === player);

  for (const q of particles) {
    ctx.globalAlpha = Math.min(1, q.life / 15);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - cam - 2, q.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHUD();
  if (state === 'title') drawOverlay('BELT BRAWL', '화면을 탭하거나 Enter 키를 눌러 시작');
  if (state === 'gameover') drawOverlay('GAME OVER', `점수 ${score}  ·  탭 또는 Enter 키로 재시작`);
  if (state === 'clear') drawOverlay('STAGE CLEAR!', `점수 ${score}  ·  탭 또는 Enter 키로 다시 하기`);
}

// ===== 메인 루프 (60fps 고정 스텝) =====
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(now - last, 100); last = now;
  while (acc >= STEP) { update(); pressed = {}; acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
