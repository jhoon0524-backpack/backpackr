<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: oklch(0.985 0.006 85);
      --card: #ffffff;
      --ink: oklch(0.25 0.012 55);
      --muted: oklch(0.58 0.012 60);
      --faint: oklch(0.72 0.010 65);
      --line: oklch(0.92 0.008 70);
      --urgent: oklch(0.55 0.13 38);
      --urgent-wash: oklch(0.965 0.022 50);
      --good: oklch(0.55 0.13 152);
      --good-wash: oklch(0.965 0.022 160);
      --serif: 'Gowun Batang', 'Nanum Myeongjo', 'Apple Myungjo', serif;
      --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: var(--urgent); text-decoration: none; }
    a:hover { color: oklch(0.45 0.13 38); }
    .num { font-family: var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</helmet>
<div style="min-height: 844px; display: flex; flex-direction: column; background: var(--paper)">

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <div style="font-size: 14px; color: var(--muted)">드롭 목록</div>
  </div>

  <div style="display: flex; gap: 8px; padding: 16px 16px 0">
    <div style="flex-shrink: 0; width: 132px; height: 132px; border-radius: 12px; background: linear-gradient(150deg, oklch(0.93 0.03 60), oklch(0.87 0.045 45)); filter: saturate(0.55)"></div>
    <div style="flex-shrink: 0; width: 92px; height: 132px; border-radius: 12px; background: linear-gradient(150deg, oklch(0.94 0.025 320), oklch(0.89 0.03 310)); filter: saturate(0.55)"></div>
    <div style="flex-shrink: 0; width: 92px; height: 132px; border-radius: 12px; background: linear-gradient(150deg, oklch(0.94 0.02 240), oklch(0.90 0.025 250)); filter: saturate(0.55)"></div>
  </div>

  <div style="padding: 16px 20px 0">
    <h1 style="margin: 0; font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.35; color: var(--muted)">미공개 일러스트집 &lt;새벽 산책&gt; 한정판</h1>
    <div style="margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: oklch(0.95 0.008 70); font-size: 12px; color: var(--muted)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      9월 1일 오전 9:45 마감됨
    </div>
  </div>

  <!-- 결과 -->
  <div style="margin: 18px 16px 0; padding: 26px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow); text-align: center">
    <div style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--good-wash); color: var(--good); font-size: 12px; font-weight: 600">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      낙찰
    </div>
    <div class="num" style="margin-top: 12px; font-size: 34px; font-weight: 600; line-height: 1.1">70,000원</div>
    <div style="margin-top: 8px; font-size: 14px; color: var(--muted)">회원님이 낙찰받았습니다.</div>
  </div>

  <!-- 결제 기한: 이 화면에서 가장 급한 것 -->
  <div style="margin: 12px 16px 0; padding: 20px; background: var(--urgent-wash); border: 1px solid oklch(0.88 0.045 45); border-radius: 12px">
    <div style="display: flex; align-items: center; gap: 7px; color: var(--urgent)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      <span style="font-size: 13px; font-weight: 600">결제 기한</span>
    </div>
    <div class="num" style="margin-top: 10px; font-size: 27px; font-weight: 600; color: var(--urgent); line-height: 1.15">23시간 59분 남음</div>
    <div style="margin-top: 6px; font-size: 13px; color: oklch(0.45 0.08 45)">2026년 9월 2일 오전 8:12까지</div>

    <div style="display: flex; align-items: center; justify-content: center; height: 52px; margin-top: 16px; border-radius: 10px; background: var(--urgent); color: #fff; font-size: 16px; font-weight: 600">결제하러 가기</div>
    <div style="margin-top: 9px; font-size: 12px; color: oklch(0.50 0.06 45); line-height: 1.6; text-align: center">기한이 지나면 거래가 자동으로 종료되고 판매자가 다시 올릴 수 있게 됩니다.</div>
  </div>

  <!-- 다른 사람에게 보이는 모습 -->
  <div style="margin: 22px 16px 0; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 12px">
    <div style="font-size: 11px; letter-spacing: 0.06em; color: var(--faint)">낙찰자가 아닌 사람에게는</div>
    <div style="margin-top: 8px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; text-align: center">
      <div style="font-size: 12px; font-weight: 600; color: var(--good)">낙찰</div>
      <div class="num" style="margin-top: 5px; font-size: 20px; font-weight: 600">70,000원</div>
      <div style="margin-top: 5px; font-size: 12px; color: var(--muted)">박*후 님에게 낙찰되었습니다.</div>
    </div>
  </div>

  <div style="height: 24px"></div>
</div>
</x-dc>
</body>
</html>
