<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: oklch(0.985 0.006 85);
      --card: #ffffff;
      --ink: oklch(0.25 0.012 55);
      --muted: oklch(0.58 0.012 60);
      --faint: oklch(0.72 0.010 65);
      --line: oklch(0.92 0.008 70);
      --urgent: oklch(0.55 0.13 38);
      --urgent-wash: oklch(0.965 0.022 50);
      --good: oklch(0.55 0.13 152);
      --good-wash: oklch(0.965 0.022 160);
      --serif: 'Gowun Batang', 'Nanum Myeongjo', 'Apple Myungjo', serif;
      --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: var(--urgent); text-decoration: none; }
    a:hover { color: oklch(0.45 0.13 38); }
    .num { font-family: var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</helmet>
<div style="min-height: 980px; display: flex; flex-direction: column; background: var(--paper)">

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <div style="font-size: 14px; color: var(--muted)">드롭 목록</div>
  </div>

  <!-- 사진 -->
  <div style="display: flex; gap: 8px; padding: 16px 16px 0; overflow-x: auto">
    <div style="flex-shrink: 0; width: 232px; height: 232px; border-radius: 12px; background: linear-gradient(150deg, oklch(0.93 0.03 60), oklch(0.87 0.045 45)); display: flex; align-items: flex-end; padding: 14px">
      <span style="font-family: var(--display); font-size: 15px; color: oklch(0.42 0.07 45)">아트북 표지</span>
    </div>
    <div style="flex-shrink: 0; width: 148px; height: 232px; border-radius: 12px; background: linear-gradient(150deg, oklch(0.94 0.025 320), oklch(0.89 0.03 310))"></div>
    <div style="flex-shrink: 0; width: 60px; height: 232px; border-radius: 12px; background: linear-gradient(150deg, oklch(0.94 0.02 240), oklch(0.90 0.025 250))"></div>
  </div>
  <div style="padding: 8px 20px 0; font-size: 11px; color: var(--faint)">사진 3장 · 옆으로 넘겨 보세요</div>

  <!-- 제목 -->
  <div style="padding: 16px 20px 0">
    <h1 style="margin: 0; font-family: var(--display); font-size: 23px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em">미공개 일러스트집 &lt;새벽 산책&gt; 한정판</h1>
    <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px">
      <span style="padding: 4px 9px; border-radius: 6px; background: oklch(0.955 0.008 70); font-size: 12px; color: var(--muted)">상태 A · 미개봉/새것</span>
      <span style="padding: 4px 9px; border-radius: 6px; background: oklch(0.955 0.008 70); font-size: 12px; color: var(--muted)">판매자 김창작</span>
    </div>
    <a href="#" style="display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 13px; border-bottom: 1px solid currentColor; padding-bottom: 1px">
      원 펀딩 프로젝트 보기
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
    </a>
  </div>

  <!-- 현재가 / 남은 시간 -->
  <div style="margin: 18px 16px 0; padding: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow)">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div>
        <div style="font-size: 12px; color: var(--muted)">현재가</div>
        <div class="num" style="margin-top: 2px; font-size: 30px; font-weight: 600; line-height: 1.1">50,000원</div>
      </div>
      <div style="text-align: right">
        <div style="font-size: 12px; color: var(--muted)">남은 시간</div>
        <div class="num" style="margin-top: 2px; font-size: 21px; font-weight: 600; color: var(--urgent)">01:59:47</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line)">
      <div>
        <div style="font-size: 11px; color: var(--faint)">입찰</div>
        <div class="num" style="margin-top: 3px; font-size: 14px">2회 · 2명</div>
      </div>
      <div>
        <div style="font-size: 11px; color: var(--faint)">최고입찰자</div>
        <div style="margin-top: 3px; font-size: 14px">박*후</div>
      </div>
      <div>
        <div style="font-size: 11px; color: var(--faint)">마감 연장</div>
        <div class="num" style="margin-top: 3px; font-size: 14px">0회 / 20회</div>
      </div>
    </div>
  </div>

  <!-- 입찰 -->
  <div style="margin: 12px 16px 0; padding: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow)">
    <div style="font-size: 12px; color: var(--muted)"><span style="color: var(--ink); font-weight: 600">이수집</span> 님으로 입찰합니다</div>

    <div style="margin-top: 12px; display: flex; align-items: baseline; justify-content: space-between">
      <label style="font-size: 13px; font-weight: 600">입찰가</label>
      <span style="font-size: 12px; color: var(--muted)">최소 <span class="num">55,000</span>원</span>
    </div>
    <div style="margin-top: 7px; display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 52px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--card)">
      <span class="num" style="flex-grow: 1; font-size: 21px; font-weight: 600">55,000</span>
      <span style="font-size: 15px; color: var(--muted)">원</span>
    </div>

    <div style="display: flex; gap: 7px; margin-top: 9px">
      <span style="padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted)">+1,000</span>
      <span style="padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted)">+5,000</span>
      <span style="padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted)">+10,000</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; height: 52px; margin-top: 14px; border-radius: 10px; background: var(--ink); color: oklch(0.985 0.006 85); font-size: 16px; font-weight: 600">입찰하기</div>
    <div style="margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; text-align: center">마감 30초 안에 입찰하면 마감이 30초 연장됩니다.</div>
  </div>

  <div style="height: 24px"></div>
</div>
</x-dc>
</body>
</html>
