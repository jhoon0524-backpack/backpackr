<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: oklch(0.985 0.006 85);
      --card: #ffffff;
      --ink: oklch(0.25 0.012 55);
      --muted: oklch(0.58 0.012 60);
      --faint: oklch(0.72 0.010 65);
      --line: oklch(0.92 0.008 70);
      --urgent: oklch(0.55 0.13 38);
      --urgent-wash: oklch(0.965 0.022 50);
      --good: oklch(0.55 0.13 152);
      --good-wash: oklch(0.965 0.022 160);
      --serif: 'Gowun Batang', 'Nanum Myeongjo', 'Apple Myungjo', serif;
      --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: var(--urgent); text-decoration: none; }
    a:hover { color: oklch(0.45 0.13 38); }
    .num { font-family: var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: var(--paper)">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line)">
    <div style="font-family: var(--display); font-size: 21px; font-weight: 700">Dropbid</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted)">이수집
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <!-- 진행 중인 경매가 없을 때: 백지가 아니라 다음 회차 안내 -->
  <div style="padding: 26px 20px; background: var(--card); border-bottom: 1px solid var(--line); text-align: center">
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: oklch(0.955 0.008 70); color: var(--muted)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    </div>
    <div style="margin-top: 12px; font-size: 15px; font-weight: 600">1회차가 마감됐습니다</div>
    <div style="margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.6">다음 드롭은 <strong style="color: var(--ink); font-weight: 600">9월 8일 오후 8시</strong>에 열립니다.</div>
    <div style="display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; padding: 11px 18px; border: 1px solid var(--ink); border-radius: 999px; font-size: 13px; font-weight: 600">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      다음 드롭 알림 받기
    </div>
  </div>

  <!-- 지난 회차 결과 -->
  <div style="flex-grow: 1; padding: 20px 16px 28px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 10px">
      <div style="font-size: 14px; font-weight: 600">지난 드롭 결과 · 1회차</div>
      <div style="font-size: 12px; color: var(--faint)">9월 1일 오전 9:45 마감</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow)">
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; background: linear-gradient(150deg, oklch(0.93 0.03 60), oklch(0.88 0.04 45)); filter: saturate(0.6)"></div>
        <div style="flex-grow: 1; min-width: 0">
          <div class="clamp2" style="font-size: 14px; line-height: 1.4">미공개 일러스트집 &lt;새벽 산책&gt;</div>
          <div style="margin-top: 4px; font-size: 12px; color: var(--muted)">박*후 님 낙찰</div>
        </div>
        <div style="text-align: right; white-space: nowrap">
          <div class="num" style="font-size: 15px; font-weight: 600">70,000원</div>
          <div style="margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--good)">낙찰</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow)">
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; background: linear-gradient(150deg, oklch(0.93 0.025 155), oklch(0.88 0.035 140)); filter: saturate(0.6)"></div>
        <div style="flex-grow: 1; min-width: 0">
          <div class="clamp2" style="font-size: 14px; line-height: 1.4">보드게임 &lt;달빛 상단&gt; 확장팩 세트</div>
          <div style="margin-top: 4px; font-size: 12px; color: var(--muted)">이*집 님 낙찰</div>
        </div>
        <div style="text-align: right; white-space: nowrap">
          <div class="num" style="font-size: 15px; font-weight: 600">28,000원</div>
          <div style="margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--good)">낙찰</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow); opacity: 0.72">
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; background: linear-gradient(150deg, oklch(0.94 0.02 340), oklch(0.89 0.03 330)); filter: saturate(0.4)"></div>
        <div style="flex-grow: 1; min-width: 0">
          <div class="clamp2" style="font-size: 14px; line-height: 1.4">아크릴 스탠드 풀세트 (7종)</div>
          <div style="margin-top: 4px; font-size: 12px; color: var(--faint)">입찰 없음</div>
        </div>
        <div style="text-align: right; white-space: nowrap">
          <div class="num" style="font-size: 15px; font-weight: 600; color: var(--muted)">12,000원</div>
          <div style="margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--muted)">유찰</div>
        </div>
      </div>
    </div>

    <div style="margin-top: 14px; padding: 13px 14px; border: 1px dashed var(--line); border-radius: 12px; font-size: 12px; color: var(--muted); line-height: 1.6">
      유찰된 상품은 판매자가 같은 내용으로 다시 올릴 수 있습니다.
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
