<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: oklch(0.985 0.006 85);
      --card: #ffffff;
      --ink: oklch(0.25 0.012 55);
      --muted: oklch(0.58 0.012 60);
      --faint: oklch(0.72 0.010 65);
      --line: oklch(0.92 0.008 70);
      --urgent: oklch(0.55 0.13 38);
      --urgent-wash: oklch(0.965 0.022 50);
      --good: oklch(0.55 0.13 152);
      --good-wash: oklch(0.965 0.022 160);
      --serif: 'Gowun Batang', 'Nanum Myeongjo', 'Apple Myungjo', serif;
      --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: var(--urgent); text-decoration: none; }
    a:hover { color: oklch(0.45 0.13 38); }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</helmet>
<div style="min-height: 620px; padding: 20px; background: oklch(0.975 0.012 95)">
  <div style="font-size: 10px; letter-spacing: 0.14em; color: var(--faint)">대안 C</div>
  <div style="margin-top: 5px; font-family: var(--serif); font-size: 18px; font-weight: 700">잡지 좌판</div>
  <div style="margin-top: 7px; font-size: 12px; color: var(--muted); line-height: 1.6">사진을 크게 두 칸으로. 굿즈를 보는 즐거움을 앞세운다.</div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px">
    <div>
      <div style="height: 128px; border-radius: 10px; background: linear-gradient(150deg, oklch(0.93 0.03 60), oklch(0.87 0.045 45))"></div>
      <div style="margin-top: 7px; font-size: 12px; line-height: 1.4">미공개 일러스트집</div>
      <div class="num" style="margin-top: 3px; font-size: 15px; font-weight: 600">50,000원</div>
    </div>
    <div>
      <div style="height: 128px; border-radius: 10px; background: linear-gradient(150deg, oklch(0.93 0.025 155), oklch(0.87 0.035 140))"></div>
      <div style="margin-top: 7px; font-size: 12px; line-height: 1.4">보드게임 확장팩</div>
      <div class="num" style="margin-top: 3px; font-size: 15px; font-weight: 600">28,000원</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 13px 15px; border-radius: 10px; background: var(--ink); color: oklch(0.985 0.006 85)">
    <span style="font-size: 12px">1회차 마감까지</span>
    <span class="num" style="font-size: 17px; font-weight: 600">01:59:47</span>
  </div>

  <div style="margin-top: 16px; padding: 12px; border: 1px dashed var(--line); border-radius: 9px; font-size: 11px; color: var(--muted); line-height: 1.65">
    <strong style="color: var(--ink); font-weight: 600">얻는 것</strong> — 굿즈가 주인공이 된다. 둘러보는 재미가 크다.<br>
    <strong style="color: var(--ink); font-weight: 600">잃는 것</strong> — 제목·상태·입찰 수가 밀린다. 한 화면에 2개씩만 보여 마감 직전 훑기가 느리다.
  </div>
</div>
</x-dc>
</body>
</html>
