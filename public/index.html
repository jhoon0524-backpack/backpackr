<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backpackr 영업 CRM</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">📇 영업 CRM</div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard">📊 대시보드</button>
        <button class="nav-item" data-view="pipeline">🧭 파이프라인</button>
        <button class="nav-item" data-view="deals">💼 딜 목록</button>
        <button class="nav-item" data-view="companies">🏢 고객사</button>
        <button class="nav-item" data-view="contacts">👤 연락처</button>
        <button class="nav-item" data-view="activities">📝 활동</button>
      </nav>
      <div class="sidebar-footer">backpackr · sales</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="view-title">대시보드</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/app.js"></script>
</body>
</html>
