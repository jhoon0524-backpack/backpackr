  };
  var ALLY_ORDER = ['yoon', 'hangyeol', 'yeoul', 'soun', 'dallae'];
  var ENEMY_TYPES = {
    dokkaebi: { name: '도깨비', emoji: '👹', hp: 22, atk: 10, def: 5, mov: 3, rng: 1, elem: '목', entityType: 'YOGOE' },
    jangsan: { name: '장산범', emoji: '🐅', hp: 22, atk: 10, def: 5, mov: 3, rng: 1, elem: '토', entityType: 'YOGOE' },
    bulgasari: { name: '불가사리', emoji: '🐗', hp: 22, atk: 10, def: 5, mov: 3, rng: 1, elem: '금', entityType: 'YOGOE' },
    // ai: 없으면 1장 일반 요괴 / hold 자리 지킴 / archer 거리 두고 쏨 / flee 도망·회복
    heuklin: { name: '흑린', emoji: '🐍', hp: 50, atk: 13, def: 8, mov: 2, rng: 1, elem: '수', boss: true,
      title: '요괴의 수장', ai: 'hold', entityType: 'YOGOE' },
    // 2장 (specs/chapter2.md 2-2, 보충 S6)
    munyeo: { name: '신당회 무녀', emoji: '🪭', hp: 20, atk: 9, def: 4, mov: 3, rng: 2, elem: '없음',
      faction: '신당회', ai: 'archer', human: true, entityType: 'HUMAN',
      attackName: '무령' }, // 기본 원거리 공격 표시명: 방울 (specs/lore.md 8장)
    dokkaebi_p: { name: '정화된 도깨비', emoji: '👹', hp: 18, atk: 8, def: 4, mov: 3, rng: 1, elem: '목',
      faction: '신당회 (정화된 요괴)', entityType: 'YOGOE' },
    jangsan_p: { name: '정화된 장산범', emoji: '🐅', hp: 18, atk: 8, def: 4, mov: 3, rng: 1, elem: '토',
      faction: '신당회 (정화된 요괴)', entityType: 'YOGOE' },
    dallae_boss: { name: '달래', emoji: '🔔', hp: 40, atk: 9, def: 6, mov: 4, rng: 1, elem: '없음', boss: true,
      faction: '신당회', title: '신당회 만신', skill: '정화수', ai: 'flee', human: true, entityType: 'HUMAN' },
    // 3장 (specs/chapter3.md 5·6장). 서낭신은 적도 아군도 아닌 중립 — 사람을 치지 않고 원귀를 밀어낸다
    seonang: { name: '서낭신', emoji: '👴', hp: 35, atk: 0, def: 6, mov: 0, rng: 2, elem: '없음', neutral: true,
      faction: '서낭고개', title: '고개의 신령', ai: 'guardian', skillName: '금역', entityType: 'SINRYEONG' },
    // 떠도는 원귀: 쓰러져도 respawn 턴 뒤 원한 지점에서 다시 나타난다 (미련). 공적 없음
    wongwi: { name: '떠도는 원귀', emoji: '👻', hp: 16, atk: 8, def: 3, mov: 3, rng: 1, elem: '없음',
      faction: '귀물', ai: 'wraith', respawn: 2, entityType: 'WONGWI', defeatLine: '원귀를 물리쳤다.' }
  };
  // ── 존재 분류·고증 등급 (specs/lore.md 1·6장). 게임용 분류이며 역사적 공식 분류가 아니다 ──
  var ENTITY_TYPES = {
    JAPGWI: '잡귀', YEOKGWI: '역귀', WONGWI: '원귀', YOGOE: '요괴', SINRYEONG: '신령', HUMAN: '사람'
  };
  var HISTORICITY = {
    A: { icon: '📜', label: '사료 기반' },
    B: { icon: '🪶', label: '민속·무속 기반' },
    C: { icon: '✏️', label: '창작 재구성' }
  };
  var ENEMY_ORDER = ['dokkaebi', 'jangsan', 'bulgasari', 'heuklin', 'munyeo', 'dokkaebi_p', 'jangsan_p', 'dallae_boss'];
  var KI_MAX = 10;
  var KI_START = 6;
  var SKILL_COST = 4;
  var HEAL_SKILL = '정화수';

  function makeUnit(d, id, side, r, c, type) {
    var ally = side === 'ally';
    return {
      id: id, type: type || id, name: d.name, side: side, emoji: d.emoji, // type: 정의표 키 (요괴 종류·아군 id)
      faction: d.faction || '요괴 세력',
      respawn: d.respawn || 0, // 쓰러진 뒤 다시 나타나기까지 턴 (3장 원귀). 0 이면 다시 나타나지 않는다
      respawnTurn: null,
      guest: !!d.guest,
      title: d.title || '—',
      boss: !!d.boss,
      ai: d.ai || null,
      human: !!d.human, // 사람(신당회). 요괴가 아니다 (specs/chapter2.md 7-3)
      entityType: d.entityType || 'HUMAN', // 아군은 모두 사람
      attackName: d.attackName || null, // 기본공격 표시명 (무녀 '무령'). 없으면 그냥 '공격'
      maxHp: d.hp, hp: d.hp, atk: d.atk, def: d.def, mov: d.mov, rng: d.rng, elem: d.elem,
      skill: d.skill || null,
      // 기력: 아군은 모두, 적은 스킬이 있는 유닛(달래)만
      maxKi: ally || d.skill ? KI_MAX : null, ki: ally || d.skill ? KI_START : null,
      r: r, c: c, alive: true, acted: false,
      from: null // 이동했지만 아직 행동 전일 때 이동 전 위치 (취소용)
    };
  }

  // 요괴 id: 같은 종류가 여럿이면 종류+번호(dokkaebi1, dokkaebi2), 하나면 종류 그대로(heuklin)
  function enemyIds(enemies) {
    var total = {}, seen = {};
    enemies.forEach(function (e) { total[e.type] = (total[e.type] || 0) + 1; });
    return enemies.map(function (e) {
      seen[e.type] = (seen[e.type] || 0) + 1;
      return total[e.type] > 1 ? e.type + seen[e.type] : e.type;
    });
  }

  // ── 품계 (specs/chapter2.md 1-1) ──────────────────────
  var RANKS = [
    { name: '종9품', need: 0, gwangun: 0 },
    { name: '정9품', need: 3, gwangun: 1 },
    { name: '종8품', need: 6, gwangun: 2 }
  ];

  // 공적 누계로 품계를 정한다
  function rankFor(total) {
    var rank = RANKS[0];
    RANKS.forEach(function (r) { if (total >= r.need) rank = r; });
    return rank;
  }

  // 관군을 놓을 칸: 윤무겸(없으면 첫 아군) 칸에서 가까운 빈 칸 순서. 거리 같으면 위 → 아래 → 왼쪽 → 오른쪽 (보충 S1)
  function reserveCells(state, n) {
    var allies = livingUnits(state, 'ally');
    var origin = getUnit(state, 'yoon') || allies[0];
    var out = [];
    if (!origin || n <= 0) return out;
    var seen = {};
    seen[origin.r + ',' + origin.c] = true;
    var queue = [[origin.r, origin.c]];
    while (queue.length && out.length < n) {
      var cur = queue.shift();
      for (var i = 0; i < DIRS.length && out.length < n; i++) {
        var r = cur[0] + DIRS[i][0], c = cur[1] + DIRS[i][1], key = r + ',' + c;
        if (seen[key] || !isPassable(state, r, c)) continue;
        seen[key] = true;
        queue.push([r, c]);
        if (!unitAt(state, r, c)) out.push({ r: r, c: c });
      }
    }
    return out;
  }

  // 스테이지에 관군 자리(reserves)가 있으면 그 순서대로 n 자리. 자리가 차 있으면 그 자리에서 가장 가까운 빈 칸
  // (specs/chapter2.md 7-2)
  function reserveSpots(state, reserves, n) {
    var out = [];
    var taken = function (r, c) {
      return !!unitAt(state, r, c) || out.some(function (p) { return p.r === r && p.c === c; });
    };
    reserves.slice(0, n).forEach(function (spot) {
      var seen = {}, queue = [[spot.r, spot.c]];
      seen[spot.r + ',' + spot.c] = true;
      while (queue.length) {
        var cur = queue.shift();
        if (isPassable(state, cur[0], cur[1]) && !taken(cur[0], cur[1])) { out.push({ r: cur[0], c: cur[1] }); return; }
        for (var i = 0; i < DIRS.length; i++) {
          var r = cur[0] + DIRS[i][0], c = cur[1] + DIRS[i][1];
          if (seen[r + ',' + c] || !inBounds(state, r, c)) continue;
          seen[r + ',' + c] = true;
          queue.push([r, c]);
        }
      }
    });
    return out;
  }

  // 스테이지로 새 전투 상태를 만든다. 스테이지를 안 주면 1장.
  // opts.merit(공적 누계)를 주면 품계를 윤무겸 칭호 앞에 붙이고, 품계만큼 관군을 합류시킨다.
  function newBattle(stage, opts) {
    stage = stage || STAGES.ch1;
    var ids = enemyIds(stage.enemies);
    var state = {
      turn: 1, maxTurn: stage.maxTurn || 10, weather: '흐림', merit: 0, phase: 'ally', result: null,
      rows: stage.rows, cols: stage.cols, map: stage.map.slice(),
      units: stage.allies.map(function (a) { return makeUnit(ALLY_DEFS[a.id], a.id, 'ally', a.r, a.c); })
        .concat(stage.enemies.map(function (e, i) {
          var d = ENEMY_TYPES[e.type];
          return makeUnit(d, ids[i], d.neutral ? 'neutral' : 'enemy', e.r, e.c, e.type);
        }))
    };
    // 목표형 장 (3장): 조사 → 봉인 복구. 보스 대신 목표로 이긴다 (specs/chapter3.md 3장)
    if (stage.objective) {
      state.points = stage.points.map(function (p) { return JSON.parse(JSON.stringify(p)); });
      state.objective = {
        phase: 'investigate', investigated: [], repaired: [], changedTurn: null, weakened: false,
        need: stage.objective.investigateNeed, sealMerit: stage.objective.sealMerit, clearMerit: stage.objective.clearMerit
      };
    }
    state.loseReason = null;
    if (opts && opts.merit !== undefined) {
      var rank = rankFor(opts.merit);
      state.rank = rank.name;
      var yoon = getUnit(state, 'yoon');
      if (yoon) yoon.title = rank.name + ' ' + yoon.title;
      var spots = stage.reserves && stage.reserves.length ? reserveSpots(state, stage.reserves, rank.gwangun) : reserveCells(state, rank.gwangun);
      spots.forEach(function (p, i) {
        // 적 뒤가 아니라 아군 끝에 넣어 아군 동률 순서의 마지막이 되게 한다
        var at = livingUnits(state, 'ally').length;
        state.units.splice(at, 0, makeUnit(ALLY_DEFS.gwangun, 'gwangun' + (i + 1), 'ally', p.r, p.c, 'gwangun'));
      });
    }
    return state;
  }

  function getUnit(state, id) {
    for (var i = 0; i < state.units.length; i++) if (state.units[i].id === id) return state.units[i];
    return null;
  }
  function unitAt(state, r, c) {
    for (var i = 0; i < state.units.length; i++) {
      var u = state.units[i];
      if (u.alive && u.r === r && u.c === c) return u;
    }
    return null;
  }
  function livingUnits(state, side) {
    return state.units.filter(function (u) { return u.alive && u.side === side; });
  }

  // ── 이동 (specs/battle.md 8장) ────────────────────────
  var DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  // unit 위치에서 상하좌우로 퍼져 나가며 칸별 이동 칸 수를 잰다.
  // 초가집·바위와 다른 유닛이 있는 칸은 통과도 정지도 못 한다. limit 을 넘는 칸은 버린다.
  // 결과: { 'r,c': 칸 수 }
  function stepCosts(state, unit, limit) {
    var costs = {};
    costs[unit.r + ',' + unit.c] = 0;
    var queue = [[unit.r, unit.c]];
    while (queue.length) {
      var cur = queue.shift();
      var d = costs[cur[0] + ',' + cur[1]];
      if (d >= limit) continue;
      for (var i = 0; i < DIRS.length; i++) {
        var r = cur[0] + DIRS[i][0], c = cur[1] + DIRS[i][1], key = r + ',' + c;
        if (costs[key] !== undefined || !isPassable(state, r, c)) continue;
        var other = unitAt(state, r, c);
        if (other && other !== unit) continue;
        costs[key] = d + 1;
        queue.push([r, c]);
      }
    }
    return costs;
  }

  // unit 위치에서 (r, c) 까지 실제로 걷는 길. 출발 칸과 도착 칸을 포함한다. 못 가면 null.
  // 같은 거리의 길이 여럿이면 위 → 아래 → 왼쪽 → 오른쪽 순서로 먼저 찾은 길.
  function pathTo(state, unit, r, c) {
    var start = unit.r + ',' + unit.c, goal = r + ',' + c;
    var prev = {};
    prev[start] = null;
    var queue = [[unit.r, unit.c]];
    while (queue.length && prev[goal] === undefined) {
      var cur = queue.shift();
      for (var i = 0; i < DIRS.length; i++) {
        var nr = cur[0] + DIRS[i][0], nc = cur[1] + DIRS[i][1], key = nr + ',' + nc;
        if (prev[key] !== undefined || !isPassable(state, nr, nc)) continue;
        var other = unitAt(state, nr, nc);
        if (other && other !== unit) continue;
        prev[key] = cur[0] + ',' + cur[1];
        queue.push([nr, nc]);
      }
    }
    if (prev[goal] === undefined) return null;
    var path = [];
    for (var k = goal; k !== null; k = prev[k]) {
      var p = k.split(',');
      path.unshift({ r: +p[0], c: +p[1] });
    }
    return path;
  }

  // 이동할 수 있는 칸 (제자리 포함). 행 → 열 순서로 정렬한다.
  function moveTargets(state, unit) {
    var costs = stepCosts(state, unit, unit.mov);
    return Object.keys(costs).map(function (key) {
      var p = key.split(',');
      return { r: +p[0], c: +p[1], cost: costs[key] };
    }).sort(function (a, b) { return a.r - b.r || a.c - b.c; });
  }

  // ── 거리와 대상 (specs/battle.md 4·8장) ───────────────
  var HEAL_RANGE = 2;

  function distance(a, b) {
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
  }

  // pos 를 주면 그 칸에 서 있다고 보고 잰다 (이동 전 미리 보기용). 없으면 지금 위치.
  function attackTargets(state, unit, pos) {
    var from = pos || unit;
    return state.units.filter(function (t) {
      if (!t.alive || t.side === unit.side) return false;
      var d = distance(from, t);
      return d >= 1 && d <= unit.rng;
    });
  }

  // 정화수: 거리 2 안의 아군(자기 포함). 그 외 스킬: 기본공격과 같은 대상.
  function skillTargets(state, unit, pos) {
    if (unit.skill !== HEAL_SKILL) return attackTargets(state, unit, pos);
    var from = pos || unit;
    return state.units.filter(function (t) {
      return t.alive && t.side === unit.side && distance(from, t) <= HEAL_RANGE;
    });
  }

  // ── 오행 상성 (specs/battle.md 5장) ───────────────────
  // 금 > 목 > 토 > 수 > 화 > 금 : 각 속성이 이기는 상대
  var BEATS = { '금': '목', '목': '토', '토': '수', '수': '화', '화': '금' };
  var ADVANTAGE = 1.5;
  var DISADVANTAGE = 0.7;

  function elementMultiplier(skillElem, targetElem) {
    if (BEATS[skillElem] === targetElem) return ADVANTAGE;
    if (BEATS[targetElem] === skillElem) return DISADVANTAGE;
    return 1;
  }

  // ── 날씨와 피해 (specs/battle.md 6·7장) ───────────────
  var WEATHERS = ['맑음', '강풍', '비', '흐림'];
  var SHRINE_FACTOR = 0.8;

  function weatherMultiplier(weather, elem) {
    if (weather === '맑음' && elem === '화') return 1.3;
    if (weather === '강풍' && elem === '목') return 1.3;
    if (weather === '비' && elem === '화') return 0.7;
    return 1;
  }

  // 기본공격 = max(1, 공격 − 방어). 상성·날씨 없음.
  // 스킬     = max(1, 공격×1.5 − 방어) × 상성 × 날씨.
  // 대상이 서낭당이면 마지막에 ×0.8. 반올림은 맨 끝에 한 번 (0.5 이상 올림).
  function damage(state, attacker, target, useSkill) {
    var v;
    if (useSkill) {
      v = Math.max(1, attacker.atk * 1.5 - target.def)
        * elementMultiplier(attacker.elem, target.elem)
        * weatherMultiplier(state.weather, attacker.elem);
    } else {
      v = Math.max(1, attacker.atk - target.def);
    }
    if (isShrine(state, target.r, target.c)) v *= SHRINE_FACTOR;
    // 1e-9: 0.5 경계가 부동소수점 오차로 내림되는 것을 막는다
    return Math.max(1, Math.round(v + 1e-9));
  }

  // ── 아군 행동 (specs/battle.md 3·4·9장) ───────────────
  var HEAL_AMOUNT = 12;

  function canCommand(state, unit) {
    return !!unit && unit.alive && unit.side === 'ally' && !unit.acted
      && state.phase === 'ally' && state.result === null;
  }

  // 이동. 이동 전 위치를 unit.from 에 남겨 취소할 수 있게 한다. 성공하면 true.
  function moveUnit(state, id, r, c) {
    var u = getUnit(state, id);
    if (!canCommand(state, u) || u.from) return false;
    var ok = moveTargets(state, u).some(function (p) { return p.r === r && p.c === c; });
    if (!ok) return false;
    u.from = { r: u.r, c: u.c };
    u.r = r; u.c = c;
    return true;
  }

  // 취소: 이동 전 위치로 되돌린다. 행동 완료가 아니다.
  function cancelMove(state, id) {
    var u = getUnit(state, id);
    if (!canCommand(state, u) || !u.from) return false;
    u.r = u.from.r; u.c = u.from.c;
    u.from = null;
    return true;
  }

  function finishAction(u) {
    u.acted = true;
    u.from = null;
  }

  function canAttack(state, unit) {
    return attackTargets(state, unit).length > 0;
  }
  function canSkill(state, unit) {
    return !!unit.skill && unit.ki >= SKILL_COST && skillTargets(state, unit).length > 0;
  }

  // 피해를 입히고 이벤트 목록에 남긴다. HP 는 0 밑으로 내려가지 않는다.
  function hit(state, attacker, target, useSkill, events) {
    var amount = damage(state, attacker, target, useSkill);
    target.hp = Math.max(0, target.hp - amount);
    events.push({
      type: 'damage', attackerId: attacker.id, targetId: target.id, amount: amount,
      name: useSkill ? attacker.skill : attacker.attackName, // 화면에 띄울 기술 이름 (없으면 null)
      skill: !!useSkill, // 스킬인지 기본공격인지 (플레이 로그용)
      mult: useSkill ? elementMultiplier(attacker.elem, target.elem) : 1 // 상성 배율 (화면 연출용)
    });
    if (target.hp === 0) knockOut(state, attacker, target, events);
    return events;
  }

  // ── HP 0 처리와 공적 (specs/battle.md 11·12장) ────────
  var MERIT_NORMAL = 1;
  var MERIT_BOSS = 3;

  // 쓰러진 적을 무엇으로 처리했는지 (specs/immersion.md 4장). 사람은 죽이지 않고 제압한다
  var DEFEAT_TYPES = { SUBDUE: '제압', EXORCISE: '퇴치', CHUKGWI: '축귀', CHUGYEOK: '축역', TOESONG: '퇴송' };
  var DEFEAT_BY_ENTITY = {
    HUMAN: 'SUBDUE', YOGOE: 'EXORCISE', JAPGWI: 'CHUKGWI', YEOKGWI: 'CHUGYEOK', WONGWI: 'TOESONG', SINRYEONG: 'EXORCISE'
  };
  function defeatTypeFor(entityType) {
    return DEFEAT_BY_ENTITY[entityType] || 'EXORCISE';
  }

  // 벽사청 유닛의 마지막 일격만 공적이 된다. 사람 제압은 공적이 아니다 (장 보스는 예외, specs/immersion.md 5장)
  function meritFor(attacker, target) {
    if (target.side !== 'enemy' || attacker.faction !== '벽사청') return 0;
    if (target.respawn) return 0; // 돌아오는 원귀는 공적이 아니다 (막타 파밍 방지, specs/chapter3.md 7장)
    if (target.boss) return MERIT_BOSS;
    return target.human ? 0 : MERIT_NORMAL;
  }

  // 쓰러짐 알림 문장 (specs/immersion.md 4·11장). 공적 줄은 이벤트의 실제 지급값으로만 만든다
  function defeatMessage(state, ev) {
    var t = getUnit(state, ev.targetId);
    if (t.side === 'neutral') return { line: '서낭신이 모습을 감췄다.', merit: '공적 없음' };
    if (ENEMY_TYPES[t.type] && ENEMY_TYPES[t.type].defeatLine) return { line: ENEMY_TYPES[t.type].defeatLine, merit: ev.merit > 0 ? '공적 +' + ev.merit : '공적 없음' };
    var line = t.boss && t.human
      ? josa(t.name, '이', '가') + ' 여의주를 떨어뜨리고 물러났다.'
      : josa(t.name, '을', '를') + ' ' + DEFEAT_TYPES[ev.defeatType] + '했다.';
    return { line: line, merit: ev.merit > 0 ? '공적 +' + ev.merit : '공적 없음' };
  }

  // 적은 사라지고, 아군은 퇴각해 사라진다
  function knockOut(state, attacker, target, events) {
    target.alive = false;
    if (target.side === 'neutral') return guardianDown(state, attacker, target, events);
    if (target.respawn) target.respawnTurn = state.turn + (state.objective && state.objective.weakened ? 1 : target.respawn);
    var merit = meritFor(attacker, target);
    state.merit += merit;
    var ev = { type: target.side === 'enemy' ? 'defeat' : 'retreat', attackerId: attacker.id, targetId: target.id, merit: merit, human: target.human };
    if (target.side === 'enemy') ev.defeatType = defeatTypeFor(target.entityType);
    events.push(ev);
    updateResult(state, events);
  }

  // 서낭신이 쓰러짐: 원귀에게면 패배, 아군에게면 봉인이 약해질 뿐 (원귀가 더 빨리 돌아온다)
  function guardianDown(state, attacker, target, events) {
    events.push({ type: 'defeat', attackerId: attacker.id, targetId: target.id, merit: 0, human: false, neutral: true });
    if (attacker.side === 'enemy') return lose(state, 'guardian', events);
    if (state.objective) state.objective.weakened = true;
    events.push({ type: 'weakened' });
  }

  function lose(state, reason, events) {
    if (state.result !== null) return;
    state.result = 'lose';
    state.loseReason = reason;
    state.phase = 'over';
    events.push({ type: 'result', result: 'lose', reason: reason });
  }

  // ── 승패 (specs/battle.md 13장) ───────────────────────
  // 보스(1장 흑린, 2장 달래) 격파 → 즉시 승리. 아군 전원 퇴각 → 즉시 패배. 끝나면 phase 는 'over'.
  function updateResult(state, events) {
    if (state.result !== null) return;
    if (livingUnits(state, 'ally').length === 0) return lose(state, 'wipe', events);
    if (state.objective) return; // 목표형 장은 봉인 복구로 이긴다 (repairSeal)
    var boss = state.units.filter(function (u) { return u.boss; })[0];
    if (!boss.alive) state.result = 'win';
    else if (livingUnits(state, 'ally').length === 0) state.result = 'lose';
    else return;
    state.phase = 'over';
    events.push({ type: 'result', result: state.result });
  }

  // 요괴 페이즈가 끝났을 때: 마지막 턴이었으면 패배, 아니면 다음 턴으로.
  function endEnemyPhase(state) {
    var events = [];
    if (state.result !== null) return events;
    if (state.turn >= state.maxTurn) {
      lose(state, 'time', events);
      return events;
    }
    state.turn += 1;
    state.phase = 'ally';
    return events;
  }

  function inList(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  // 결과: 이벤트 배열. 못 하는 행동이면 null.
  function attack(state, id, targetId) {
    var u = getUnit(state, id);
    if (!canCommand(state, u)) return null;
    var t = inList(attackTargets(state, u), targetId);
    if (!t) return null;
    var events = hit(state, u, t, false, []);
    finishAction(u);
    return events;
  }

  function useSkill(state, id, targetId) {
    var u = getUnit(state, id);
    if (!canCommand(state, u) || !u.skill || u.ki < SKILL_COST) return null;
    var t = inList(skillTargets(state, u), targetId);
    if (!t) return null;
    u.ki -= SKILL_COST;
    var events;
    if (u.skill === HEAL_SKILL) {
      var amount = Math.min(HEAL_AMOUNT, t.maxHp - t.hp);
      t.hp += amount;
      events = [{ type: 'heal', attackerId: u.id, targetId: t.id, amount: amount, name: HEAL_SKILL }];
    } else {
      events = hit(state, u, t, true, []);
    }
    finishAction(u);
    return events;
  }

  function wait(state, id) {
    var u = getUnit(state, id);
    if (!canCommand(state, u)) return null;
    finishAction(u);
    return [];
  }

  // ── 턴 진행 (specs/battle.md 3·6·9장) ─────────────────
  var WEATHER_TURNS = [4, 7, 10];
  var SPRING_HEAL = 10;

  // 약수터 위에 있는 side 유닛을 HP +10 (최대 HP 까지)
  function springHeal(state, side, events) {
    livingUnits(state, side).forEach(function (u) {
      if (!isSpring(state, u.r, u.c)) return;
      var amount = Math.min(SPRING_HEAL, u.maxHp - u.hp);
      u.hp += amount;
      events.push({ type: 'spring', targetId: u.id, amount: amount });
    });
  }

  // 아군 페이즈 시작. 1턴 포함 매 턴 부른다.
  // rng: 0 이상 1 미만을 돌려주는 함수. 날씨가 바뀌는 턴에만 한 번 부른다.
  function startAllyPhase(state, rng) {
    var events = [];
    if (WEATHER_TURNS.indexOf(state.turn) !== -1) {
      state.weather = WEATHERS[Math.floor(rng() * WEATHERS.length)];
      events.push({ type: 'weather', weather: state.weather });
    }
    springHeal(state, 'ally', events);
    livingUnits(state, 'ally').forEach(function (u) {
      if (state.turn >= 2) u.ki = Math.min(u.maxKi, u.ki + 1);
      u.acted = false;
      u.from = null;
    });
    state.phase = 'ally';
    return events;
  }

  function allActed(state) {
    return livingUnits(state, 'ally').every(function (u) { return u.acted; });
  }

  // [턴 종료] 또는 전원 행동 끝 → 요괴 페이즈 시작 (요괴 약수터 회복).
  // 이동만 하고 행동하지 않은 유닛은 그 자리에 머문다.
  function endAllyPhase(state) {
    var events = [];
    if (state.phase !== 'ally' || state.result !== null) return events;
    livingUnits(state, 'ally').forEach(function (u) { u.from = null; });
    state.phase = 'enemy';
    respawnWraiths(state, events);
    springHeal(state, 'enemy', events);
    // 기력 있는 적(2장 달래)은 아군과 같은 규칙: 2턴부터 페이즈 시작마다 +1 (보충 S2)
    livingUnits(state, 'enemy').forEach(function (u) {
      if (u.ki !== null && state.turn >= 2) u.ki = Math.min(u.maxKi, u.ki + 1);
    });
    return events;
  }

  // ── 요괴 AI (specs/battle.md 10장) ────────────────────
  // target 을 칠 수 있는 칸(거리 1~사거리)들에서 거꾸로 퍼져 나가며, 각 칸에서 그곳까지 몇 칸인지 잰다.
  // mover 자신의 칸은 비어 있다고 본다. 다른 유닛 칸은 지나갈 수 없다.
  function approachMap(state, mover, target) {
    var dist = {}, queue = [];
    function free(r, c) {
      if (!isPassable(state, r, c)) return false;
      var o = unitAt(state, r, c);
      return !o || o === mover;
    }
    for (var r = 0; r < state.rows; r++) {
      for (var c = 0; c < state.cols; c++) {
        var d = distance({ r: r, c: c }, target);
        if (d >= 1 && d <= mover.rng && free(r, c)) {
          dist[r + ',' + c] = 0;
          queue.push([r, c]);
        }
      }
    }
    while (queue.length) {
      var cur = queue.shift();
      var base = dist[cur[0] + ',' + cur[1]];
      for (var i = 0; i < DIRS.length; i++) {
        var nr = cur[0] + DIRS[i][0], nc = cur[1] + DIRS[i][1], key = nr + ',' + nc;
        if (dist[key] !== undefined || !free(nr, nc)) continue;
        dist[key] = base + 1;
        queue.push([nr, nc]);
      }
    }
    return dist;
  }

  function stepsFrom(map, p) {
    var v = map[p.r + ',' + p.c];
    return v === undefined ? Infinity : v;
  }

  // 칸 고르기 동률 규칙: 이동 칸 수가 적은 칸 → 행이 작은 칸 → 열이 작은 칸
  function byCell(a, b) {
    return a.cost - b.cost || a.r - b.r || a.c - b.c;
  }

  // 이동해서 칠 수 있는 아군마다 가장 좋은 공격 칸을 찾는다.
  // 결과: [{ target, cell }] (아군 표 순서)
  // 칸에서 가장 가까운 아군까지의 거리 (가로+세로 칸 수). 2장 무녀·달래가 쓴다 (보충 S4)
  function nearestAllyDistance(state, p) {
    var best = Infinity;
    livingUnits(state, 'ally').forEach(function (a) { best = Math.min(best, distance(p, a)); });
    return best;
  }

  // 아군에게서 먼 칸 먼저, 동률이면 byCell
  function byFarness(state) {
    return function (a, b) {
      return nearestAllyDistance(state, b) - nearestAllyDistance(state, a) || byCell(a, b);
    };
  }

  function attackPlans(state, e) {
    var cells = moveTargets(state, e);
    var plans = [];
    livingUnits(state, 'ally').forEach(function (t) {
      var ok = cells.filter(function (p) {
        var d = distance(p, t);
        return d >= 1 && d <= e.rng;
      }).sort(e.ai === 'archer' ? byFarness(state) : byCell); // 무녀는 거리 두고 쏜다 (보충 S5)
      if (ok.length) plans.push({ target: t, cell: ok[0] });
    });
    return plans;
  }

  function relocate(state, e, cell, events) {
    if (cell.r === e.r && cell.c === e.c) return;
    events.push({ type: 'move', unitId: e.id, from: { r: e.r, c: e.c }, to: { r: cell.r, c: cell.c },
      path: pathTo(state, e, cell.r, cell.c) });
    e.r = cell.r; e.c = cell.c;
  }

  // 일반 요괴 한 마리의 행동.
  // 칠 수 있으면: HP 최저 → 이동 칸 수가 적은 쪽 → 아군 표 순서로 대상을 골라 이동 후 공격.
  // 없으면: 실제 이동 칸 수로 가장 가까운 아군(동률은 표 순서)에게 최대한 다가간다. 길이 없으면 제자리.
  function normalEnemyAct(state, e) {
    var events = [];
    var plans = attackPlans(state, e);
    if (plans.length) {
      plans.sort(function (a, b) {
        return a.target.hp - b.target.hp || a.cell.cost - b.cell.cost;
      }); // sort 는 안정 정렬이라 나머지 동률은 아군 표 순서가 유지된다
      relocate(state, e, plans[0].cell, events);
      return hit(state, e, plans[0].target, false, events);
    }
    var best = null;
    livingUnits(state, 'ally').forEach(function (t) {
      var map = approachMap(state, e, t);
      var d = stepsFrom(map, e);
      if (d !== Infinity && (!best || d < best.d)) best = { map: map, d: d };
    });
    if (!best) return events;
    var cells = moveTargets(state, e).sort(function (a, b) {
      return stepsFrom(best.map, a) - stepsFrom(best.map, b) || byCell(a, b);
    });
    relocate(state, e, cells[0], events);
    return events;
  }

  // 흑린: 움직이지 않는다. 인접한 아군 중 HP 최저(동률은 아군 표 순서)를 친다.
  function bossAct(state, e) {
    var targets = attackTargets(state, e).slice().sort(function (a, b) {
      return a.hp - b.hp || distance(e, a) - distance(e, b);
    });
    if (!targets.length) return [];
    return hit(state, e, targets[0], false, []);
  }

  // 탈출로(E)까지 남은 실제 이동 칸 수 지도. mover 자신의 칸은 비어 있다고 본다.
  // 아군이 서 있는 탈출로·길은 막힌다 (길막). 결과: { 'r,c': 칸 수 }
  function escapeMap(state, mover) {
    var dist = {}, queue = [];
    function free(r, c) {
      if (!isPassable(state, r, c)) return false;
      var o = unitAt(state, r, c);
      return !o || o === mover;
    }
    for (var r = 0; r < state.rows; r++) {
      for (var c = 0; c < state.cols; c++) {
        if (isEscape(state, r, c) && free(r, c)) {
          dist[r + ',' + c] = 0;
          queue.push([r, c]);
        }
      }
    }
    while (queue.length) {
      var cur = queue.shift();
      var base = dist[cur[0] + ',' + cur[1]];
      for (var i = 0; i < DIRS.length; i++) {
        var nr = cur[0] + DIRS[i][0], nc = cur[1] + DIRS[i][1], key = nr + ',' + nc;
        if (dist[key] !== undefined || !free(nr, nc)) continue;
        dist[key] = base + 1;
        queue.push([nr, nc]);
      }
    }
    return dist;
  }

  // 탈출로에 가까운 칸 먼저 → 아군에게서 먼 칸 → 이동 칸 적은 → 행 → 열.
  // 탈출로까지 길이 없으면 아군에게서 먼 칸 순서 (specs/chapter2.md 7-1)
  function byEscape(state, map) {
    var far = byFarness(state);
    return function (a, b) {
      return stepsFrom(map, a) - stepsFrom(map, b) || far(a, b);
    };
  }

  // 2장 달래: 공격하지 않는다. 회복할 동료가 있으면 회복, 아니면 탈출로로 (specs/chapter2.md 7-1)
  // 탈출로에 닿으면 즉시 패배.
  function fleeAct(state, e) {
    var events = [];
    var cells = moveTargets(state, e);
    var map = escapeMap(state, e);
    var order = Object.keys(map).length && stepsFrom(map, e) !== Infinity ? byEscape(state, map) : byFarness(state);
    var healed = false;
    if (e.skill === HEAL_SKILL && e.ki >= SKILL_COST) {
      var hurt = livingUnits(state, 'enemy').filter(function (u) { return u.hp <= u.maxHp / 2; })
        .sort(function (a, b) { return a.hp / a.maxHp - b.hp / b.maxHp; });
      for (var i = 0; i < hurt.length && !healed; i++) {
        var t = hurt[i];
        var near = cells.filter(function (p) {
          return t === e || distance(p, t) <= HEAL_RANGE; // 자기 자신은 어디서든
        }).sort(order);
        if (!near.length) continue;
        relocate(state, e, near[0], events);
        var amount = Math.min(HEAL_AMOUNT, t.maxHp - t.hp);
        t.hp += amount;
        e.ki -= SKILL_COST;
        events.push({ type: 'heal', attackerId: e.id, targetId: t.id, amount: amount, name: HEAL_SKILL });
        healed = true;
      }
    }
    if (!healed) relocate(state, e, cells.sort(order)[0], events);
    if (isEscape(state, e.r, e.c) && state.result === null) {
      events.push({ type: 'escape', unitId: e.id });
      lose(state, 'escape', events);
    }
    return events;
  }

  // ── 3장 서낭고개: 조사 → 봉인 복구 (specs/chapter3.md) ──
  function pointAt(state, r, c) {
    return (state.points || []).filter(function (p) { return p.r === r && p.c === c; })[0] || null;
  }
  function pointById(state, id) {
    return (state.points || []).filter(function (p) { return p.id === id; })[0] || null;
  }
  function sealPoints(state) {
    return (state.points || []).filter(function (p) { return p.seal; });
  }
  function openSeals(state) {
    var o = state.objective;
    return sealPoints(state).filter(function (p) { return o.repaired.indexOf(p.id) === -1; });
  }

  // 아군이 이동을 마치고 조사 지점에 서면 자동 조사 (행동을 쓰지 않는다). 2곳째에 진실 → 봉인 단계
  function arrive(state, id) {
    var u = getUnit(state, id), o = state.objective, events = [];
    if (!o || !u || !u.alive || u.side !== 'ally' || o.phase !== 'investigate' || state.result !== null) return events;
    var p = pointAt(state, u.r, u.c);
    if (!p || !p.investigate || o.investigated.indexOf(p.id) !== -1) return events;
    o.investigated.push(p.id);
    events.push({ type: 'investigate', pointId: p.id, unitId: u.id });
    if (o.investigated.length >= o.need) {
      o.phase = 'seal';
      o.changedTurn = state.turn;
      events.push({ type: 'truth' });
    }
    return events;
  }

  // 지금 이 유닛이 복구할 수 있는 봉인 지점 (봉인 단계 + 복구 안 된 봉인 칸에 서 있음)
  function repairablePoint(state, unit) {
    var o = state.objective;
    if (!o || o.phase !== 'seal' || !canCommand(state, unit)) return null;
    var p = pointAt(state, unit.r, unit.c);
    return p && p.seal && o.repaired.indexOf(p.id) === -1 ? p : null;
  }

  // [봉인 복구]: 누가 복구하든 +1, 세 곳 모두면 임무 완료 +3 과 즉시 승리
  function repairSeal(state, id) {
    var u = getUnit(state, id), p = u && repairablePoint(state, u);
    if (!p) return null;
    var o = state.objective, events = [];
    o.repaired.push(p.id);
    state.merit += o.sealMerit;
    events.push({ type: 'seal', pointId: p.id, unitId: u.id, merit: o.sealMerit });
    finishAction(u);
    if (!openSeals(state).length) {
      state.merit += o.clearMerit;
      events.push({ type: 'objective', merit: o.clearMerit });
      state.result = 'win';
      state.phase = 'over';
      events.push({ type: 'result', result: 'win' });
    }
    return events;
  }

  // 원귀가 다시 나타나는 칸: 원한 지점, 차 있으면 가장 가까운 빈 칸 (위 → 아래 → 왼쪽 → 오른쪽)
  function respawnCell(state) {
    var home = (state.points || []).filter(function (p) { return p.respawn; })[0];
    if (!home) return null;
    var seen = {}, queue = [[home.r, home.c]];
    seen[home.r + ',' + home.c] = true;
    while (queue.length) {
      var cur = queue.shift();
      if (isPassable(state, cur[0], cur[1]) && !unitAt(state, cur[0], cur[1])) return { r: cur[0], c: cur[1] };
      for (var i = 0; i < DIRS.length; i++) {
        var nr = cur[0] + DIRS[i][0], nc = cur[1] + DIRS[i][1], key = nr + ',' + nc;
        if (seen[key] || !inBounds(state, nr, nc)) continue;
        seen[key] = true;
        queue.push([nr, nc]);
      }
    }
    return null;
  }

  // 적 차례 시작: 돌아올 때가 된 원귀가 원한 지점에서 HP 가득 다시 나타난다
  function respawnWraiths(state, events) {
    state.units.forEach(function (u) {
      if (u.alive || !u.respawn || u.respawnTurn === null || state.turn < u.respawnTurn) return;
      var cell = respawnCell(state);
      if (!cell) return;
      u.alive = true; u.hp = u.maxHp; u.r = cell.r; u.c = cell.c; u.respawnTurn = null;
      events.push({ type: 'respawn', unitId: u.id, r: cell.r, c: cell.c });
    });
  }

  // 서낭신 금역: 자기와 거리 rng 안의 원귀 중 가장 가까운 하나를 자기에게서 먼 쪽으로 한 칸 민다 (피해 없음)
  function guardianAct(state, g) {
    var near = livingUnits(state, 'enemy').filter(function (w) { return w.ai === 'wraith' && distance(g, w) <= g.rng; })
      .sort(function (a, b) { return distance(g, a) - distance(g, b); });
    for (var i = 0; i < near.length; i++) {
      var w = near[i], dr = Math.sign(w.r - g.r), dc = Math.sign(w.c - g.c);
      var tries = Math.abs(w.r - g.r) >= Math.abs(w.c - g.c) ? [[dr, 0], [0, dc]] : [[0, dc], [dr, 0]];
      for (var k = 0; k < tries.length; k++) {
        if (!tries[k][0] && !tries[k][1]) continue;
        var to = { r: w.r + tries[k][0], c: w.c + tries[k][1] };
        if (!isPassable(state, to.r, to.c) || unitAt(state, to.r, to.c)) continue;
        var from = { r: w.r, c: w.c };
        w.r = to.r; w.c = to.c;
        return [{ type: 'push', attackerId: g.id, targetId: w.id, from: from, to: to, name: ENEMY_TYPES[g.type].skillName || null }];
      }
    }
    return [];
  }

  // 칸들(goals)까지 mover 가 걸어가는 칸 수 지도. mover 자신의 칸은 비어 있다고 본다
  function goalMap(state, mover, goals) {
    var dist = {}, queue = [];
    function free(r, c) {
      if (!isPassable(state, r, c)) return false;
      var o = unitAt(state, r, c);
      return !o || o === mover;
    }
    goals.forEach(function (g) {
      if (free(g.r, g.c) && dist[g.r + ',' + g.c] === undefined) { dist[g.r + ',' + g.c] = 0; queue.push([g.r, g.c]); }
    });
    while (queue.length) {
      var cur = queue.shift();
      var base = dist[cur[0] + ',' + cur[1]];
      for (var i = 0; i < DIRS.length; i++) {
        var nr = cur[0] + DIRS[i][0], nc = cur[1] + DIRS[i][1], key = nr + ',' + nc;
        if (dist[key] !== undefined || !free(nr, nc)) continue;
        dist[key] = base + 1;
        queue.push([nr, nc]);
      }
    }
    return dist;
  }

  // 원귀가 칠 대상 (이 칸에서): 서낭신 먼저, 그다음 HP 낮은 아군
  function wraithTarget(state, e, pos) {
    var t = attackTargets(state, e, pos).sort(function (a, b) {
      return (a.side === 'neutral' ? 0 : 1) - (b.side === 'neutral' ? 0 : 1) || a.hp - b.hp;
    });
    return t[0] || null;
  }

  // 떠도는 원귀: ① 복구 안 된 봉인 지점(이미 서 있으면 머문다) ② 서낭신 ③ 가까운 아군 (specs/chapter3.md 6장)
  // 봉인을 부수지는 않는다 — 봉인 칸을 차지해 복구를 막는다
  function wraithAct(state, e) {
    var events = [];
    // 봉인 지점은 진실이 밝혀진 뒤(봉인 단계)에만 노린다. 조사 단계에는 서낭신 → 아군 (보충: 조사 칸을 처음부터 막지 않게)
    var seals = state.objective && state.objective.phase === 'seal' ? openSeals(state) : [];
    var onSeal = seals.some(function (p) { return p.r === e.r && p.c === e.c; });
    var cells = moveTargets(state, e);
    var dest = null;
    if (!onSeal) {
      var reach = cells.filter(function (c) { return seals.some(function (p) { return p.r === c.r && p.c === c.c; }); }).sort(byCell);
      if (reach.length) dest = reach[0];
    }
    if (!onSeal && !dest) {
      // 이동해서 칠 수 있으면 친다 (서낭신 > HP 낮은 아군), 아니면 목표 쪽으로
      var best = null;
      cells.forEach(function (c) {
        var t = wraithTarget(state, e, c);
        if (!t) return;
        var score = (t.side === 'neutral' ? 0 : 1000) + t.hp * 10 + c.cost;
        if (!best || score < best.score || (score === best.score && byCell(c, best.cell) < 0)) best = { score: score, cell: c, target: t };
      });
      if (best) {
        relocate(state, e, best.cell, events);
        return hit(state, e, best.target, false, events);
      }
      var goals = seals.length ? seals
        : livingUnits(state, 'neutral').length ? livingUnits(state, 'neutral').map(function (g) { return { r: g.r, c: g.c }; })
          : livingUnits(state, 'ally').map(function (a) { return { r: a.r, c: a.c }; });
      // 유닛이 선 칸은 목표로 삼을 수 없으니 그 둘레를 목표로
      var ring = [];
      goals.forEach(function (g) {
        if (!unitAt(state, g.r, g.c) || (g.r === e.r && g.c === e.c)) ring.push(g);
        else DIRS.forEach(function (d) { ring.push({ r: g.r + d[0], c: g.c + d[1] }); });
      });
      var map = goalMap(state, e, ring);
      dest = cells.slice().sort(function (a, b) { return stepsFrom(map, a) - stepsFrom(map, b) || byCell(a, b); })[0];
    }
    if (dest) relocate(state, e, dest, events);
    var t = wraithTarget(state, e);
    if (t) return hit(state, e, t, false, events);
    return events;
  }

  // 요괴 한 마리 행동. 화면은 이것을 0.5초 간격으로 부른다.
  function enemyAct(state, id) {
    var e = getUnit(state, id);
    if (!e || !e.alive || e.side === 'ally' || state.phase !== 'enemy' || state.result !== null) return [];
    if (e.ai === 'guardian') return guardianAct(state, e);
    if (e.ai === 'wraith') return wraithAct(state, e);
    if (e.ai === 'hold') return bossAct(state, e);
    if (e.ai === 'flee') return fleeAct(state, e);
    return normalEnemyAct(state, e); // 1장 요괴, 2장 정화된 요괴·무녀(archer)
  }

  // 이번 요괴 페이즈에 행동할 요괴 id (표 순서)
  // 중립(3장 서낭신)이 먼저 움직인다
  function enemyOrder(state) {
    return livingUnits(state, 'neutral').concat(livingUnits(state, 'enemy')).map(function (u) { return u.id; });
  }

  // 요괴 페이즈 전체를 한 번에 돈다 (테스트·시뮬레이션용. 화면은 enemyOrder + enemyAct + endEnemyPhase 로 나눠 부른다).
  // 도중에 아군이 전원 퇴각하면 남은 요괴는 행동하지 않는다.
  function runEnemyPhase(state) {
    var events = [];
    enemyOrder(state).forEach(function (id) {
      if (state.result !== null) return;
      events = events.concat(enemyAct(state, id));
    });
    return events.concat(endEnemyPhase(state));
  }

  // ── 플레이 로그 (v0.5, specs/playtest.md 1장) ─────────
  // 처음 하는 사람의 플레이를 숫자로 남긴다. 화면·저장소는 모른다: 화면이 이벤트를 넘기고, 끝난 로그를 저장한다.
  // 자동 플레이(tests/sim-report.mjs)도 같은 함수를 써서 계산을 검증한다.
  function bump(map, key, n) { map[key] = (map[key] || 0) + (n === undefined ? 1 : n); }

  function dalraeOf(state) {
    return state.units.filter(function (u) { return u.side === 'enemy' && u.ai === 'flee'; })[0] || null;
  }
  // 달래 → 탈출로 실제 칸 수. 달래가 없거나 쓰러졌거나 길이 막혔으면 null
  function dalraeDistance(state) {
    var d = dalraeOf(state);
    if (!d || !d.alive) return null;
    var v = escapeMap(state, d)[d.r + ',' + d.c];
    return v === undefined ? null : v;
  }
  function trackDalrae(log, state) {
    var d = dalraeOf(state);
    if (!d || !d.alive) return;
    var last = log.dalraeTrail[log.dalraeTrail.length - 1];
    var dist = dalraeDistance(state);
    if (last && last.r === d.r && last.c === d.c && last.dist === dist) return;
    log.dalraeTrail.push({ turn: state.turn, r: d.r, c: d.c, dist: dist });
  }

  function newPlayLog(state, chapter, restartCount) {
    var names = {};
    state.units.forEach(function (u) { names[u.id] = u.name; });
    var log = {
      v: 1, chapter: chapter, result: null, totalTurns: 0,
      rank: state.rank || rankFor(0).name,
      soldierCount: state.units.filter(function (u) { return u.type === 'gwangun'; }).length,
      unitMoves: {}, attacks: {}, skillsByUnit: {}, skills: {}, damageDealt: {}, damageTaken: {},
      healing: {}, springHealing: {}, defeatedUnits: [], meritEarned: 0,
      dalraeHealCount: 0, dalraeEscapeDistance: null, dalraeTrail: [], restartCount: restartCount || 0,
      moves: [], hits: [], heals: [], healFollowUps: [], names: names,
      // 3장 (specs/chapter3.md 10장)
      investigations: [], sealRepairs: [], wongwiDefeated: 0, wongwiRespawns: 0, seonangDamageTaken: 0, objectiveChangedTurn: null
    };
    trackDalrae(log, state);
    return log;
  }

  // 아군 이동은 행동을 마칠 때 화면이 알려 준다 (취소한 이동은 세지 않는다)
  function logMove(log, state, id, from, to) {
    if (from.r === to.r && from.c === to.c) return;
    bump(log.unitMoves, id);
    log.moves.push({ turn: state.turn, id: id, from: { r: from.r, c: from.c }, to: { r: to.r, c: to.c } });
  }

  function logEvents(log, state, events) {
    (events || []).forEach(function (e) {
      if (e.type === 'move') {
        logMove(log, state, e.unitId, e.from, e.to);
      } else if (e.type === 'damage') {
        bump(e.skill ? log.skillsByUnit : log.attacks, e.attackerId);
        if (e.skill) bump(log.skills, e.name);
        bump(log.damageDealt, e.attackerId, e.amount);
        bump(log.damageTaken, e.targetId, e.amount);
        if (getUnit(state, e.targetId).side === 'neutral') log.seonangDamageTaken += e.amount;
        log.hits.push({ turn: state.turn, by: e.attackerId, target: e.targetId, amount: e.amount, name: e.name, skill: e.skill });
      } else if (e.type === 'heal') {
        bump(log.skillsByUnit, e.attackerId);
        bump(log.skills, e.name);
        bump(log.healing, e.attackerId, e.amount);
        if (getUnit(state, e.attackerId).ai === 'flee') log.dalraeHealCount++;
        log.heals.push({ turn: state.turn, by: e.attackerId, target: e.targetId, amount: e.amount, at: log.hits.length });
      } else if (e.type === 'investigate') {
        log.investigations.push({ turn: state.turn, point: e.pointId, by: e.unitId });
      } else if (e.type === 'truth') {
        log.objectiveChangedTurn = state.turn;
      } else if (e.type === 'seal') {
        log.sealRepairs.push({ turn: state.turn, point: e.pointId, by: e.unitId });
      } else if (e.type === 'respawn') {
        log.wongwiRespawns++;
      } else if (e.type === 'spring') {
        bump(log.springHealing, e.targetId, e.amount);
      } else if (e.type === 'defeat' || e.type === 'retreat') {
        var t = getUnit(state, e.targetId);
        if (t.respawn) log.wongwiDefeated++;
        log.defeatedUnits.push({
          turn: state.turn, id: t.id, name: t.name, side: t.side,
          // 2장 달래(사람 보스)는 화면 문구처럼 '물러남' (defeatMessage)
          how: e.type === 'retreat' ? '퇴각' : t.side === 'neutral' ? '모습을 감춤' : t.respawn ? '물리침'
            : (t.boss && t.human ? '물러남' : DEFEAT_TYPES[e.defeatType]),
          by: e.attackerId, merit: e.merit
        });
      }
    });
    trackDalrae(log, state);
  }

  // 전투가 끝나면 결과를 채우고, 회복마다 그 뒤를 정리한다 (H3: 회복된 적을 다시 쳤나, 얼마나 버텼나)
  function finishPlayLog(log, state) {
    log.result = state.result;
    log.totalTurns = state.turn;
    log.meritEarned = state.merit;
    log.dalraeEscapeDistance = dalraeDistance(state);
    log.healFollowUps = log.heals.map(function (h) {
      var target = getUnit(state, h.target);
      var down = log.defeatedUnits.filter(function (d) { return d.id === h.target; })[0];
      var later = log.hits.slice(h.at).filter(function (x) {
        return x.target === h.target && getUnit(state, x.by).side !== target.side;
      });
      return {
        target: h.target, turn: h.turn, attackedAgain: later.length > 0,
        survivedTurns: (down ? down.turn : state.turn) - h.turn, defeated: !!down
      };
    });
    return log;
  }

  // ── 맵 에디터용: 스테이지 검사·코드·편집 (specs/editor.md) ──
  var ROWS_MIN = 6, ROWS_MAX = 12, COLS_MIN = 6, COLS_MAX = 10;

  // 받침 유무로 조사 고르기: josa('윤무겸', '이', '가') → '윤무겸이', josa('도깨비', '이', '가') → '도깨비가'
  function josa(word, withFinal, withoutFinal) {
    var code = word.charCodeAt(word.length - 1) - 0xAC00;
    var hasFinal = code >= 0 && code <= 11171 && code % 28 !== 0;
    return word + (hasFinal ? withFinal : withoutFinal);
  }

  // 문제 목록. level 'error' 는 불러오기 거부, 'warn' 은 경고만.
  function validateStage(st) {
    var out = [];
    function err(msg) { out.push({ level: 'error', msg: msg }); }
    function warn(msg, r, c) { out.push({ level: 'warn', msg: msg, r: r, c: c }); }
    if (!st || typeof st !== 'object') { err('맵 데이터가 아닙니다'); return out; }
    if (!(st.rows >= ROWS_MIN && st.rows <= ROWS_MAX)) err('행 수는 ' + ROWS_MIN + '~' + ROWS_MAX + ' 사이여야 합니다');
    if (!(st.cols >= COLS_MIN && st.cols <= COLS_MAX)) err('열 수는 ' + COLS_MIN + '~' + COLS_MAX + ' 사이여야 합니다');
    if (!Array.isArray(st.map) || st.map.length !== st.rows) err('지형 줄 수가 행 수와 다릅니다');
    if (!Array.isArray(st.allies) || !Array.isArray(st.enemies)) err('유닛 목록이 없습니다');
    if (st.maxTurn !== undefined && !(st.maxTurn >= 1 && st.maxTurn <= 30)) err('턴 제한은 1~30 이어야 합니다');
    if (st.reserves !== undefined && (!Array.isArray(st.reserves) || st.reserves.length > 2)) err('관군 자리는 2개까지입니다');
    if (out.length) return out;
    for (var r = 0; r < st.rows; r++) {
      var row = st.map[r];
      if (typeof row !== 'string' || row.length !== st.cols) { err((r + 1) + '번째 줄 길이가 열 수와 다릅니다'); continue; }
      for (var c = 0; c < row.length; c++) {
        if (TERRAINS.indexOf(row.charAt(c)) === -1) err('알 수 없는 지형 글자 "' + row.charAt(c) + '"');
      }
    }
    st.allies.forEach(function (a) { if (!ALLY_DEFS[a.id]) err('알 수 없는 아군 "' + a.id + '"'); });
    st.enemies.forEach(function (e) { if (!ENEMY_TYPES[e.type]) err('알 수 없는 요괴 "' + e.type + '"'); });
    if (out.length) return out;

    var seen = {}, allyCount = {}, bosses = 0;
    st.allies.map(function (a) { return { u: a, name: ALLY_DEFS[a.id].name }; })
      .concat(st.enemies.map(function (e) { return { u: e, name: ENEMY_TYPES[e.type].name }; }))
      .forEach(function (x) {
        var u = x.u, key = u.r + ',' + u.c;
        if (!(u.r >= 0 && u.r < st.rows && u.c >= 0 && u.c < st.cols)) { warn(josa(x.name, '이', '가') + ' 맵 밖에 있습니다', u.r, u.c); return; }
        if (st.map[u.r].charAt(u.c) === 'D') warn(josa(x.name, '이', '가') + ' 초가집·바위 위에 있습니다', u.r, u.c);
        if (seen[key]) warn(josa(x.name, '과', '와') + ' ' + josa(seen[key], '이', '가') + ' 같은 칸에 있습니다', u.r, u.c);
        seen[key] = x.name;
      });
    (st.reserves || []).forEach(function (p, i) {
      var label = '관군 자리 ' + (i + 1) + '번';
      if (!(p.r >= 0 && p.r < st.rows && p.c >= 0 && p.c < st.cols)) warn(josa(label, '이', '가') + ' 맵 밖에 있습니다', p.r, p.c);
      else if (st.map[p.r].charAt(p.c) === 'D') warn(josa(label, '이', '가') + ' 초가집·바위 위에 있습니다', p.r, p.c);
    });
    st.allies.forEach(function (a) {
      allyCount[a.id] = (allyCount[a.id] || 0) + 1;
      if (allyCount[a.id] === 2) warn(josa(ALLY_DEFS[a.id].name, '이', '가') + ' 두 번 배치되었습니다');
    });
    st.enemies.forEach(function (e) { if (ENEMY_TYPES[e.type].boss) bosses++; });
    if (bosses === 0) warn('보스(흑린·달래)가 없으면 이길 수 없습니다');
    if (bosses > 1) warn('보스는 한 마리만 둘 수 있습니다');
    if (st.allies.length === 0) warn('아군이 한 명도 없습니다');
    var fleeing = st.enemies.some(function (e) { return ENEMY_TYPES[e.type].ai === 'flee'; });
    var hasEscape = st.map.some(function (row) { return row.indexOf('E') !== -1; });
    if (fleeing && !hasEscape) warn('탈출로가 없으면 달래가 도망칠 곳이 없습니다');
    return out;
  }

  // 공적 최대 = 보스 아닌 적 수 × 1 + 보스 3 (specs/chapter2.md S11)
  function maxMerit(st) {
    if (st.objective) return st.points.filter(function (p) { return p.seal; }).length * st.objective.sealMerit + st.objective.clearMerit;
    // 사람(제압)은 공적이 아니므로 세지 않는다 (specs/immersion.md 5장)
    return st.enemies.filter(function (e) { return !ENEMY_TYPES[e.type].boss && !ENEMY_TYPES[e.type].human; }).length * MERIT_NORMAL + MERIT_BOSS;
  }

  // 맵 코드 = 한 줄 JSON. 게임 안 스테이지 데이터와 같은 모양이다.
  function encodeStage(st) {
    var out = {
      v: 1, name: st.name || '', rows: st.rows, cols: st.cols, map: st.map,
      allies: st.allies.map(function (a) { return { id: a.id, r: a.r, c: a.c }; }),
      enemies: st.enemies.map(function (e) { return { type: e.type, r: e.r, c: e.c }; })
    };
    if (st.maxTurn) out.maxTurn = st.maxTurn; // 장마다 다른 턴 제한 (없으면 10)
    if (st.reserves && st.reserves.length) {
      out.reserves = st.reserves.map(function (p) { return { r: p.r, c: p.c }; }); // 관군 자리 1·2번
    }
    return JSON.stringify(out);
  }

  // 결과: { stage, problems } 또는 { error }. 'error' 수준 문제가 있으면 불러오지 않는다.
  function decodeStage(text) {
    var st;
    try {
      st = JSON.parse(String(text).trim());
    } catch (e) {
      return { error: '맵 코드를 읽을 수 없습니다: 형식이 잘못되었습니다' };
    }
    var problems = validateStage(st);
    var fatal = problems.filter(function (p) { return p.level === 'error'; });
    if (fatal.length) return { error: '맵 코드를 읽을 수 없습니다: ' + fatal[0].msg };
    return { stage: JSON.parse(encodeStage(st)), problems: problems };
  }

  function copyStage(st) {
    return JSON.parse(encodeStage(st));
  }

  // 아군은 정의표 순서, 요괴는 종류 순서 → 행 → 열 순서로 둔다 (1장 순서와 같아진다)
  function sortUnits(st) {
    st.allies.sort(function (a, b) { return ALLY_ORDER.indexOf(a.id) - ALLY_ORDER.indexOf(b.id); });
    st.enemies.sort(function (a, b) {
      return ENEMY_ORDER.indexOf(a.type) - ENEMY_ORDER.indexOf(b.type) || a.r - b.r || a.c - b.c;
    });
    return st;
  }

  function removeUnitAt(st, r, c) {
    var at = function (u) { return u.r === r && u.c === c; };
    var had = st.allies.some(at) || st.enemies.some(at);
    st.allies = st.allies.filter(function (u) { return !at(u); });
    st.enemies = st.enemies.filter(function (u) { return !at(u); });

  // 칸 하나를 칠한 새 스테이지를 돌려준다 (원본은 그대로).

  function paintStage(stage, tool, r, c) {

    if (!(r >= 0 && r < st.rows && c >= 0 && c < st.cols)) return st;
    var rock = st.map[r].charAt(c) === 'D';
    st.reserves = st.reserves || [];
    var reserveAt = function (p) { return p.r === r && p.c === c; };
    if (tool.kind === 'terrain') {

        st.reserves = st.reserves.filter(function (p) { return !reserveAt(p); });

    } else if (rock) {
      return tidy(st); // 초가집·바위 위에는 유닛·관군 자리를 놓지 않는다

      // 관군 자리 1·2번. 2번은 1번이 있어야 놓인다
      // 같은 칸에 있던 다른 자리는 빼고, 요청한 번호 자리를 바꾸거나 뒤에 붙인다

      st.allies.push({ id: tool.id, r: r, c: c });
    } else if (tool.kind === 'enemy') {
      removeUnitAt(st, r, c);
      if (ENEMY_TYPES[tool.type].boss) {
        st.enemies = st.enemies.filter(function (e) { return !ENEMY_TYPES[e.type].boss; }); // 보스는 한 마리

      st.enemies.push({ type: tool.type, r: r, c: c });
    }
    return tidy(sortUnits(st));

    st.cols = cols;
    st.map = map;
    st.allies = st.allies.filter(inside);

    if (st.reserves) st.reserves = st.reserves.filter(inside);

  // 본 것(seen: 'enemy:종류', 'clear:장', 'skill:이름' 목록)으로 항목이 밝아졌는지
  function loreUnlocked(entry, seen) {
    if (!entry.unlock.length) return true;
    return entry.unlock.some(function (token) { return seen.indexOf(token) !== -1; });
  }

  // 전투 시작 때 본 것을 벽사록 토큰으로: 어느 장인지(stageId 가 있으면), 등장한 적 종류. 쓰인 기술은 화면이 'skill:이름' 으로 더한다
  function loreTokensForBattle(state, stageId) {
    return (stageId ? ['stage:' + stageId] : []).concat(state.units.filter(function (u) { return u.side !== 'ally'; })
      .map(function (u) { return 'enemy:' + u.type; })
      .filter(function (t, i, all) { return all.indexOf(t) === i; }));
  }

  // 벽사록 저장 이관 (specs/immersion.md 11장). 이전 판은 토큰 배열만 저장했고, 이제는 { v: 2, tokens }.
  // 이전 판에서 이미 보이던 것은 다시 잠그지 않는다: 세 세력은 처음부터 보였고('legacy:v1'),
  // 무령은 무녀를 만나면 보였다('enemy:munyeo' → 'skill:무령'). raw 가 null 이면 새 저장.
  var LORE_STORE_V = 2;
  function migrateLore(raw) {
    var strings = function (list) { return list.filter(function (t) { return typeof t === 'string'; }); };
    if (raw && raw.v === LORE_STORE_V && Array.isArray(raw.tokens)) return { v: LORE_STORE_V, tokens: strings(raw.tokens) };
    if (!Array.isArray(raw)) return { v: LORE_STORE_V, tokens: [] };
    var tokens = strings(raw);
    var extra = ['legacy:v1'].concat(tokens.indexOf('enemy:munyeo') !== -1 ? ['skill:무령'] : []);
    extra.forEach(function (t) { if (tokens.indexOf(t) === -1) tokens.push(t); });
    return { v: LORE_STORE_V, tokens: tokens };
  }

  // 본 것이 before → after 로 늘었을 때 새로 밝혀진 항목 (벽사록 발견 토스트용)
  function newlyUnlockedLore(before, after) {
    return LORE.filter(function (e) { return !loreUnlocked(e, before) && loreUnlocked(e, after); });
  }
