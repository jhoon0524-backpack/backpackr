    renderPoints();
    state.units.forEach(function (u) {
      if (!u.alive) return;
      var tile = unitTile(u);
      if (u.id === ui.id) tile.className += ' selected';
      if (u.side === 'ally' && u.acted) tile.className += ' acted';
      if (u.id === 'dallae' && ui.dallaeGone) tile.className += ' fading';
      cellAt(u.r, u.c).appendChild(tile);
      var tag = u.side !== 'ally' || ui.kind === 'skill' ? affinityTag(u) : null;
      if (tag && marksHas(marks, u)) cellAt(u.r, u.c).appendChild(tag);
    });
    renderInfo();
    renderMenu();
    renderPhase();
  }

  // ── 3장 지점 표시·임무 줄 (specs/chapter3.md 3장) ──
  // 조사 단계: 조사할 곳 '조사' (한 곳은 '조사함'), 봉인 단계: 봉인할 곳 '봉인'(붉게 깜빡) → 복구 '완료', 조사한 돌무덤은 '원한'
  // (한자 표시는 뜻이 안 읽혀 한글로 바꿨다 — 기획자 피드백 2026-09-26)
  function pointMark(p) {
    var o = state.objective;
    if (o.phase === 'investigate') {
      if (!p.investigate) return null;
      return o.investigated.indexOf(p.id) === -1 ? ['clue', '조사'] : ['done', p.respawn ? '원한' : '조사함'];
    }
    if (p.seal) return o.repaired.indexOf(p.id) === -1 ? ['seal', '봉인'] : ['sealed', '완료'];
    if (p.respawn) return ['grudge', '원한'];
    return null;
  }
  function renderPoints() {
    cells.forEach(function (cell) {
      var old = cell.querySelector('.pt');
      if (old) cell.removeChild(old);
      cell.classList.remove('goal');
    });
    var box = document.getElementById('objective');
    box.hidden = !state.objective;
    if (!state.objective) return;
    var o = state.objective;
    state.points.forEach(function (p) {
      var m = pointMark(p);
      if (!m) return;
      var cell = cellAt(p.r, p.c);
      cell.appendChild(el('span', 'pt ' + m[0], m[1]));
      if (m[0] === 'seal') cell.classList.add('goal');
    });
    var goal = CHAPTERS[chapterId] && Core.STAGES[chapterId].objective;
    box.innerHTML = '';
    box.appendChild(el('b', '', '임무 '));
    box.appendChild(document.createTextNode(o.phase === 'investigate'
      ? goal.before + ' (조사 ' + o.investigated.length + '/' + o.need + ')'
      : goal.after + ' (복구 ' + o.repaired.length + '/' + Core.STAGES[chapterId].points.filter(function (p) { return p.seal; }).length + ')'));
  }
  // 지점 칸을 눌렀을 때의 설명
  function pointInfo(p) {
    var o = state.objective;
    if (o.phase === 'investigate') {
      if (!p.investigate) return null;
      if (o.investigated.indexOf(p.id) === -1) return { mark: '🔍', name: '수상한 흔적', text: '아군이 이 칸에 서면 조사한다.' };
      return { mark: '🔍', name: p.investigate.title, text: p.investigate.text };
    }
    if (p.seal) {
      return o.repaired.indexOf(p.id) === -1
        ? { mark: '🪢', name: '봉인 지점 · ' + p.name, text: '이 칸에 선 아군이 [봉인 복구]를 할 수 있다.' }
        : { mark: '✅', name: p.name + ' · 복구됨', text: p.seal.done };
    }
    if (p.respawn) return { mark: '👻', name: '원한 지점 · ' + p.name, text: '쓰러진 원귀가 이곳에서 다시 나타난다.' };
    return null;
  }

  // 정보창: 이름 / 소속 / 칭호 / HP / 기력 / 속성. 빈 특수 지형 칸을 눌렀으면 지형 설명 카드
  function renderInfo() {
    var box = document.getElementById('info');
    var pt = ui.infoCell && state.objective && Core.pointAt(state, ui.infoCell.r, ui.infoCell.c);
    var pInfo = pt && pointInfo(pt);
    if (pInfo) {
      box.hidden = false;
      box.innerHTML = '';
      box.appendChild(el('div', 'face', pInfo.mark));
      var t = el('div');
      t.appendChild(el('div', 'name', pInfo.name));
      var body = el('div', 'stats', pInfo.text);
      body.style.whiteSpace = 'pre-line';
      t.appendChild(body);
      box.appendChild(t);
      return;
    }
    var cellInfo = ui.infoCell && TERRAIN_INFO[Core.terrainAt(state, ui.infoCell.r, ui.infoCell.c)];
    if (cellInfo) return renderTerrainInfo(box, Core.terrainAt(state, ui.infoCell.r, ui.infoCell.c));
    var u = ui.infoId && Core.getUnit(state, ui.infoId);
    box.hidden = !u || !u.alive;
    if (box.hidden) return;
    box.innerHTML = '';
    box.appendChild(el('div', 'face', u.emoji));
    var text = el('div');
    var name = el('div', 'name', u.name);
    if (u.guest) name.appendChild(el('span', 'guest', '객장'));
    text.appendChild(name);
    text.appendChild(el('div', 'sub', u.side === 'neutral'
      ? (seonangHidden() ? '정체를 알 수 없다' : u.faction + ' · 원귀를 막고 있는 신령')
      : u.faction + ' · ' + u.title));
    text.appendChild(el('div', 'stats',
      'HP ' + u.hp + '/' + u.maxHp +
      ' · 기력 ' + (u.ki === null ? '—' : u.ki + '/' + u.maxKi) +
      ' · 속성 ' + u.elem));
    var under = Core.terrainAt(state, u.r, u.c);
    if (under !== 'D' && TERRAIN_INFO[under]) {
      text.appendChild(el('div', 'sub', TERRAIN_MARK[under] + ' ' + TERRAIN_INFO[under].name + ' 위 · ' + TERRAIN_INFO[under].text));
    }
    box.appendChild(text);
  }

  function renderTerrainInfo(box, t) {
    box.hidden = false;
    box.innerHTML = '';
    box.appendChild(el('div', 'face', TERRAIN_MARK[t]));
    var text = el('div');
    text.appendChild(el('div', 'name', TERRAIN_INFO[t].name));
    text.appendChild(el('div', 'stats', TERRAIN_INFO[t].text));
    box.appendChild(text);
  }

  // 화면 아래에 잠깐 뜨는 알림. lines: [{ b: 굵게, small: 작게, text: 보통 }], kind: 'lore' 면 한지 색.
  // 한 번에 하나만 보이고, 기다리는 알림은 우선순위(rank) 순 → 같은 순위는 들어온 순 (specs/immersion.md 11장)
  var TOAST_RANK = { mission: 0, lore: 1, terrain: 2, other: 3 };
  var toastQueue = [];
  var toastSeq = 0;
  var toastTimer = null;
  var toastCurrent = null; // 지금 보이는 알림 { node, rank }
  function toast(lines, kind, ms, rank) {
    toastQueue.push({ lines: lines, kind: kind, ms: ms || 2800, rank: rank || TOAST_RANK.other, seq: toastSeq++ });
    if (!toastTimer) nextToast();
  }
  function nextToast() {
    toastTimer = null;
    toastCurrent = null;
    if (!toastQueue.length) return;
    toastQueue.sort(function (a, b) { return a.rank - b.rank || a.seq - b.seq; });
    var item = toastQueue.shift();
    toastCurrent = { node: showToast(item.lines, item.kind, item.ms), rank: item.rank };
    toastTimer = setTimeout(nextToast, item.ms + 150); // 앞 알림이 사라진 뒤 다음
  }
  // 장을 새로 시작하면 지난 판의 알림은 버린다
  function clearToasts() {
    toastQueue = [];
    clearTimeout(toastTimer);
    toastTimer = null;
    document.getElementById('toasts').innerHTML = '';
  }
  function showToast(lines, kind, ms) {
    var t = el('div', 'toast' + (kind ? ' ' + kind : ''));
    t.style.setProperty('--ms', ms + 'ms');
    lines.forEach(function (line) {
      if (line.b) {
        var b = el('b', '', line.b);
        if (line.hanja) b.appendChild(el('small', '', line.hanja));
        t.appendChild(b);
      } else if (line.small) {
        t.appendChild(el('small', '', line.small));
      } else if (line.html) {
        var old = el('div');
        old.appendChild(el('s', '', line.html)); // 바뀌기 전 목표 (줄 긋기)
        t.appendChild(old);
      } else {
        t.appendChild(el('div', '', line.text));
      }
    });
    document.getElementById('toasts').appendChild(t);
    removeLater(t, ms);
    return t;
  }

  // 처음 만난 특수 지형을 전투 시작 때 한 번 알려 준다 (본 지형은 이 브라우저에 기록)
  var TIPS_KEY = 'joseon-exorcist.tips';
  function terrainTips() {
    var seen = [];
    try { seen = JSON.parse(localStorage.getItem(TIPS_KEY) || '[]'); } catch (e) { /* 저장이 막혀 있으면 매번 알려 준다 */ }
    if (!Array.isArray(seen)) seen = [];
    var fresh = TIP_TERRAINS.filter(function (t) {
      return seen.indexOf(t) === -1 && state.map.some(function (row) { return row.indexOf(t) !== -1; });
    });
    if (!fresh.length) return;
    toast(fresh.map(function (t) { return { text: TERRAIN_MARK[t] + ' ' + TERRAIN_INFO[t].name + ' · ' + TERRAIN_INFO[t].text }; })
      .concat([{ small: '지형 칸을 누르면 다시 볼 수 있습니다.' }]), '', 3600, TOAST_RANK.terrain);
    try { localStorage.setItem(TIPS_KEY, JSON.stringify(seen.concat(fresh))); } catch (e) { /* 무시 */ }
  }

  // 적 차례 문구: 귀물만 있으면 '귀물의 차례', 사람(신당회)이 섞이면 '상대의 차례' (specs/lore.md 보충 L5)
  function enemyTurnLabel() {
    var human = Core.livingUnits(state, 'enemy').some(function (u) { return u.entityType === 'HUMAN'; });
    return human ? '상대의 차례…' : '귀물의 차례…';
  }

  function renderPhase() {
    var canEnd = state.phase === 'ally' && !ui.busy && state.result === null;
    document.getElementById('btn-end').disabled = !canEnd;
    var note = document.getElementById('phase-note');
    note.className = '';
    if (ui.step === 'target' && canEnd) {
      // 대상 고르는 중: 무엇을 쓰는지 크게 (specs/immersion.md 9장)
      note.className = 'aim';
      note.innerHTML = '';
      note.appendChild(el('b', '', ui.kind === 'skill' ? Core.getUnit(state, ui.id).skill : '공격'));
      note.appendChild(document.createTextNode(' — 대상을 고르세요'));
      return;
    }
    note.textContent = state.phase === 'enemy' ? enemyTurnLabel() : (canEnd ? '아군 차례 — 유닛을 눌러 움직이세요' : '');
  }

  function renderMenu() {
    var menu = document.getElementById('menu');
    menu.hidden = ui.step !== 'menu';
    if (menu.hidden) return;
    var u = Core.getUnit(state, ui.id);
    document.getElementById('btn-attack').disabled = !Core.canAttack(state, u);
    var skill = document.getElementById('btn-skill');
    skill.disabled = !Core.canSkill(state, u);
    skill.innerHTML = '';
    skill.appendChild(document.createTextNode(u.skill || '스킬'));
    skill.appendChild(el('small', '', u.skill ? '기력 ' + Core.SKILL_COST + ' (' + u.ki + '/' + u.maxKi + ')' : '없음')); // 관군은 스킬 없음
    document.getElementById('btn-seal').hidden = !Core.repairablePoint(state, u); // 3장 봉인 칸에 섰을 때만
  }

  function marksHas(marks, u) {
    return !!marks[u.r + ',' + u.c];
  }

  function selectable(u) {
    return !!u && Core.canCommand(state, u) && !u.from;
  }

  function clearSelection() {
    ui.step = 'none';
    ui.id = null;
    ui.kind = null;
  }

  // 맵 칸을 눌렀을 때. 터치와 클릭 모두 click 이벤트로 온다.
  function onCell(r, c) {
    if (ui.busy || state.phase !== 'ally') return;
    var u = Core.unitAt(state, r, c);
    if (u) ui.infoId = u.id;
    ui.infoCell = u ? null : { r: r, c: c }; // 빈 칸이면 지형 설명
    if (ui.step === 'move') {
      var isBlue = Core.moveTargets(state, Core.getUnit(state, ui.id))
        .some(function (p) { return p.r === r && p.c === c; });
      if (isBlue) {
        var mover = ui.id;
        var path = Core.pathTo(state, Core.getUnit(state, mover), r, c);
        Core.moveUnit(state, mover, r, c);
        ui.step = 'menu';
        ui.infoId = mover;
        ui.infoCell = null;
        ui.busy = true; // 미끄러지는 동안 입력 잠금
        slide(mover, path, function () {
          ui.busy = false;
          render();
          arrival(mover);
        });
        return;
      } else if (selectable(u)) {
        ui.id = u.id;
      } else if (!u) {
        clearSelection(); // 빈 칸: 선택 해제. 다른 유닛: 정보만 보고 선택은 유지
        ui.infoId = null;
      }
    } else if (ui.step === 'target') {
      var target = u && currentTargets().indexOf(u) !== -1 ? u : null;
      if (!target) {
        ui.step = 'menu'; // 대상 밖을 누르면 메뉴로 돌아간다
      } else {
        // 3장: 진실을 안 뒤 서낭신을 치려 하면 한 번 묻는다 (진실 전 공격은 그대로 — 오해도 경험이다)
        if (target.side === 'neutral' && !seonangHidden() && !ui.askedSeonang) {
          ui.askedSeonang = true;
          return ask('서낭신은 원귀가 마을로 내려가지 못하게 막고 있다.\n정말 공격할까?', function () { strike(target); }, function () { ui.step = 'menu'; render(); });
        }
        strike(target);
        return;
      }
    } else if (ui.step === 'none') {
      if (selectable(u)) {
        ui.step = 'move';
        ui.id = u.id;
      } else if (!u) {
        ui.infoId = null;
      }
    }
    render();
  }

  function strike(target) {
    var from = startPos(ui.id), actor = ui.id;
    var events = ui.kind === 'skill' ? Core.useSkill(state, ui.id, target.id) : Core.attack(state, ui.id, target.id);
    logAllyAction(actor, from, events);
    afterAction(events);
  }
  function ask(text, onYes, onNo) {
    var box = document.getElementById('ask');
    document.getElementById('ask-text').textContent = text;
    document.getElementById('ask-text').style.whiteSpace = 'pre-line';
    box.hidden = false;
    document.getElementById('ask-yes').onclick = function () { box.hidden = true; onYes(); };
    document.getElementById('ask-no').onclick = function () { box.hidden = true; onNo(); };
  }

  // 3장: 이동을 마친 칸이 조사 지점이면 자동 조사 → 짧은 글, 2곳째면 진실 대사 → 임무 갱신
  function arrival(id) {
    var events = Core.arrive(state, id);
    if (!events.length) return;
    Core.logEvents(playLog, state, events);
    var lines = [];
    events.forEach(function (e) {
      if (e.type === 'investigate') {
        var p = Core.pointById(state, e.pointId);
        discover(['point:' + p.id]);
        lines.push({ who: '조사 — ' + p.investigate.title, face: '🔍', text: p.investigate.text });
      }
    });
    var truth = events.some(function (e) { return e.type === 'truth'; });
    if (truth) {
      lines = lines.concat(CHAPTERS[chapterId].truth.slice(0, 5));
      lines.push({ pause: 900, run: guardianShowcase });
      lines = lines.concat(CHAPTERS[chapterId].truth.slice(5));
    }
    playScene(lines, function () {
      ui.busy = false;
      render();
      if (truth) {
        var goal = Core.STAGES[chapterId].objective;
        toast([{ b: '임무 갱신' }, { html: goal.before }, { text: goal.after }], 'mission', 3200, 0);
      }
    });
  }
  // 진실 공개 중 서낭신이 원귀 하나를 밀어내는 짧은 장면 (가까운 원귀가 없으면 기술 이름만)
  function guardianShowcase() {
    var g = Core.getUnit(state, 'seonang');
    if (!g || !g.alive) return;
    skillLabel('금역', g.r, g.c, 'plain');
    var tile = board.querySelector('.unit[data-id="seonang"]');
    if (tile) tile.classList.add('acting');
  }

  // 행동이 끝난 뒤 공통 처리: 승리면 끝, 전원 행동했으면 잠시 뒤 자동으로 턴 종료
  function afterAction(events) {
    clearSelection();
    objectiveToasts(events || []);
    defeatToasts(events || []);
    ghostDeaths(events || []);
    render();
    showFloats(events || []);
    skillEffects(events || []);
    flashHits(events || []);
    if (state.result !== null) return finish();
    // 3장: 서낭신을 처음 친 뒤 한 번 (게임이 막지는 않는다)
    var struck = (events || []).some(function (e) { return e.type === 'damage' && Core.getUnit(state, e.targetId).side === 'neutral'; });
    if (struck && !ui.seonangWarned && CHAPTERS[chapterId].firstStrike) {
      ui.seonangWarned = true;
      return playScene(CHAPTERS[chapterId].firstStrike, function () { ui.busy = false; render(); continueTurn(); });
    }
    continueTurn();
  }
  function continueTurn() {
    if (Core.allActed(state)) {
      ui.busy = true;
      render();
      setTimeout(endTurn, ENEMY_STEP_MS);
      return;
    }
    autoSelect();
  }
  // 행동이 끝나면 다음 아군을 자동으로 고른다 (기획자 피드백 2026-09-26). 다른 유닛을 누르면 그쪽으로 바뀐다
  function autoSelect() {
    if (state.phase !== 'ally' || state.result !== null || ui.busy) return;
    var next = Core.livingUnits(state, 'ally').filter(selectable)[0];
    if (!next) return;
    ui.step = 'move';
    ui.id = next.id;
    ui.infoId = next.id;
    ui.infoCell = null;
    render();
  }

  // 3장 목표 알림: 봉인 복구·임무 완료, 원귀 재등장, 봉인 약화
  function objectiveToasts(events) {
    events.forEach(function (e) {
      if (e.type === 'seal') {
        discover(['point:' + e.pointId]);
        toast([{ text: Core.pointById(state, e.pointId).seal.done }, { small: '봉인 복구 · 공적 +' + e.merit }], '', 2400);
      } else if (e.type === 'objective') {
        toast([{ b: '바람이 멎었다.' }, { small: '임무 완료 · 공적 +' + e.merit }], 'mission', 2600, 0);
        fadeWraiths();
      } else if (e.type === 'respawn') {
        toast([{ text: '원한이 남아 다시 모습을 드러냈다.' }], '', 2400);
      } else if (e.type === 'weakened') {
        toast([{ text: '봉인이 크게 약해졌다.' }, { small: '원귀가 더 빨리 돌아온다' }], '', 2800);
      }
    });
  }
  // 마지막 봉인: 남은 원귀가 희미해지며 사라진다
  function fadeWraiths() {
    Core.livingUnits(state, 'enemy').forEach(function (u) {
      if (u.type !== 'wongwi') return;
      var tile = board.querySelector('.unit[data-id="' + u.id + '"]');
      if (!tile) return;
      var ghost = el('div', 'ghost dying');
      ghost.appendChild(tile.cloneNode(true));
      placeOver(ghost, u.r, u.c);
      board.appendChild(ghost);
      u.alive = false; // 화면에서만 지운다 (전투는 이미 끝났다)
      setTimeout(function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 900);
    });
  }

  // 쓰러진 적을 문장으로: 사람은 제압, 요괴는 퇴치. 2장 달래는 여의주를 떨어뜨리고 물러난다 (specs/immersion.md 4장)
  function defeatToasts(events) {
    events.forEach(function (e) {
      if (e.type !== 'defeat') return;
      var m = Core.defeatMessage(state, e);
      toast([{ text: m.line }, { small: m.merit }], '', 2400);
    });
  }

  // 쓰러진 유닛은 render() 가 지우기 전에 복제해 두고 0.4초 동안 흐려지게 한다
  function ghostDeaths(events) {
    events.forEach(function (e) {
      if (e.type !== 'defeat' && e.type !== 'retreat') return;
      var t = Core.getUnit(state, e.targetId);
      var tile = board.querySelector('.unit[data-id="' + e.targetId + '"]');
      if (!tile) return;
      var ghost = el('div', 'ghost dying');
      ghost.appendChild(tile.cloneNode(true));
      placeOver(ghost, t.r, t.c);
      board.appendChild(ghost);
      setTimeout(function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 450);
    });
  }

  // ── 기술 연출: 정화수·무령 (specs/lore.md 8장) ──
  var LABELED = { '정화수': 'water', '무령': 'bell' };

  function cellCenter(r, c) {
    var cell = cellAt(r, c);
    return { x: cell.offsetLeft + cell.offsetWidth / 2, y: cell.offsetTop + cell.offsetHeight / 2, cell: cell };
  }

  function removeLater(node, ms) {
    setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, ms);
  }

  // 기술 이름을 칸 위에 0.8초. 벽사록에 한자가 있으면 작게 붙인다 (정화수 井華水, 무령 巫鈴)
  function skillLabel(name, r, c, kind) {
    var p = cellCenter(r, c);
    var label = el('div', 'skill-label ' + kind, name);
    var entry = Core.LORE.filter(function (e) { return e.name === name && e.hanja; })[0];
    var hanja = entry ? entry.hanja : { '금역': '禁域' }[name];
    if (hanja) label.appendChild(el('small', '', hanja));
    label.style.left = p.x + 'px';
    label.style.top = p.cell.offsetTop + 'px';
    board.appendChild(label);
    removeLater(label, 850);
  }

  function skillEffects(events) {
    discover(events.filter(function (e) { return e.name; }).map(function (e) { return 'skill:' + e.name; }));
    events.forEach(function (e) {
      if (!e.name || (e.type !== 'damage' && e.type !== 'heal')) return;
      var kind = LABELED[e.name];
      var from = Core.getUnit(state, e.attackerId);
      var to = Core.getUnit(state, e.targetId);
      if (!kind) return skillLabel(e.name, to.r, to.c, 'plain'); // 다른 스킬은 글자만
      if (kind === 'water') {
        // 정화수: 받는 쪽에 푸른 파문 + 글자
        var w = el('div', 'water');
        placeOver(w, to.r, to.c);
        board.appendChild(w);
        removeLater(w, 1000);
        skillLabel(e.name, to.r, to.c, kind);
      } else {
        // 무령: 쏘는 쪽 위에 글자, 방울 파문이 목표로 날아간다
        skillLabel(e.name, from.r, from.c, kind);
        var a = cellCenter(from.r, from.c), b = cellCenter(to.r, to.c);
        var wave = el('div', 'bell-wave');
        wave.style.left = a.x + 'px';
        wave.style.top = a.y + 'px';
        wave.style.width = a.cell.offsetWidth * 0.34 + 'px';
        board.appendChild(wave);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            wave.style.left = b.x + 'px';
            wave.style.top = b.y + 'px';
            wave.style.opacity = '0';
          });
        });
        removeLater(wave, 700);
      }
    });
  }

  // 맞은 유닛 번쩍·흔들림. render() 뒤에 붙인다 (render 가 타일을 새로 만들기 때문)
  function flashHits(events) {
    events.forEach(function (e) {
      if (e.type !== 'damage' && e.type !== 'heal') return;
      var tile = board.querySelector('.unit[data-id="' + e.targetId + '"]');
      // 회복은 초록 빛 (2장 달래 정화수가 눈에 띄게, specs/chapter2.md 7-5)
      if (tile) tile.classList.add(e.type === 'heal' ? 'healed' : 'hit');
    });
  }

  function showEvents(events) {
    Core.logEvents(playLog, state, events);
    objectiveToasts(events);
    defeatToasts(events);
    ghostDeaths(events);
    render();
    showFloats(events);
    skillEffects(events);
    flashHits(events);
    events.forEach(function (e) {
      if (e.type !== 'respawn') return;
      var tile = board.querySelector('.unit[data-id="' + e.unitId + '"]');
      if (tile) tile.classList.add('respawned');
    });
    if (events.some(function (e) { return e.type === 'weather'; })) {
      var top = document.getElementById('top');
      top.classList.remove('flash');
      void top.offsetWidth; // 애니메이션 다시 시작
      top.classList.add('flash');
    }
  }

  var SLIDE_MS = 80; // 칸당 이동 시간 (specs/effects.md 2장)
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function placeOver(elm, r, c) {
    var cell = cellAt(r, c);
    elm.style.left = cell.offsetLeft + 'px';
    elm.style.top = cell.offsetTop + 'px';
    elm.style.width = cell.offsetWidth + 'px';
    elm.style.height = cell.offsetHeight + 'px';
  }

  // 유닛 타일을 path 를 따라 한 칸씩 옮기는 연출. 화면(DOM)은 아직 이동 전 모습이어야 한다.
  // 끝나면 done. 동작 줄이기 설정이거나 제자리면 바로 done.
  function slide(unitId, path, done) {
    var tile = board.querySelector('.unit[data-id="' + unitId + '"]');
    if (!tile || !path || path.length < 2 || reduceMotion) return done();
    var ghost = el('div', 'ghost');
    ghost.appendChild(tile.cloneNode(true));
    placeOver(ghost, path[0].r, path[0].c);
    board.appendChild(ghost);
    tile.style.visibility = 'hidden';
    var i = 1;
    function step() {
      if (i >= path.length) {
        setTimeout(function () { board.removeChild(ghost); done(); }, SLIDE_MS);
        return;
      }
      placeOver(ghost, path[i].r, path[i].c);
      i++;
      setTimeout(step, SLIDE_MS);
    }
    requestAnimationFrame(step);
  }

  // 요괴가 지나간 칸에 보라 점을 잠깐 남긴다 (도착 칸 제외)
  function footprints(path) {
    if (!path) return;
    path.slice(0, -1).forEach(function (p) {
      var dot = el('div', 'step-dot');
      placeOver(dot, p.r, p.c);
      board.appendChild(dot);
      setTimeout(function () { if (dot.parentNode) dot.parentNode.removeChild(dot); }, 650);
    });
  }

  function markActing(id) {
    var tile = board.querySelector('.unit[data-id="' + id + '"]');
    if (tile) tile.classList.add('acting');
  }

  // 아군 페이즈 끝 → 요괴가 0.5초 간격으로 하나씩 → 다음 턴 아군 페이즈 (그동안 입력 잠금)
  function endTurn() {
    if (state.phase !== 'ally' || state.result !== null) return;
    clearSelection();
    ui.busy = true;
    showEvents(Core.endAllyPhase(state));
    var order = Core.enemyOrder(state);
    var i = 0;
    function next() {
      if (state.result !== null) return finish();
      if (i >= order.length) {
        var end = Core.endEnemyPhase(state);
        if (state.result !== null) { Core.logEvents(playLog, state, end); render(); return finish(); }
        ui.busy = false;
        showEvents(end.concat(Core.startAllyPhase(state, Math.random)));
        autoSelect(); // 새 턴도 첫 아군부터
        return;
      }
      var id = order[i++];
      var events = Core.enemyAct(state, id);
      var move = events.filter(function (e) { return e.type === 'move'; })[0];
      var push = events.filter(function (e) { return e.type === 'push'; })[0]; // 3장 금역: 밀려난 원귀가 미끄러진다
      if (push) {
        skillLabel(push.name || '금역', Core.getUnit(state, id).r, Core.getUnit(state, id).c, 'plain');
        markActing(id);
      }
      slide(push ? push.targetId : id, push ? [push.from, push.to] : move && move.path, function () {
        showEvents(events);
        if (move) footprints(move.path);
        if (events.length) markActing(id);
        setTimeout(next, events.length ? ENEMY_STEP_MS : 0);
      });
    }
    setTimeout(next, ENEMY_STEP_MS);
  }

  // 대사를 한 줄씩 보여 주고, 다 넘기면 done 을 부른다. 그동안 맵 입력은 잠근다.
  // 줄 대신 { pause: 밀리초, run: 함수 } 를 넣으면 연출을 돌리고 그 시간 동안 기다린다.
  function playScene(lines, done) {
    var scene = document.getElementById('scene');
    var i = 0;
    ui.busy = true;
    render();
    function show() {
      if (i >= lines.length) {
        scene.hidden = true;
        scene.onclick = null;
        return done();
      }
      var line = lines[i++];
      if (line.pause) {
        scene.hidden = true;
        scene.onclick = null;
        line.run();
        return setTimeout(show, line.pause);
      }
      document.getElementById('scene-face').textContent = line.face;
      document.getElementById('scene-who').textContent = line.who;
      document.getElementById('scene-line').textContent = line.text;
      scene.hidden = false;
      scene.onclick = show;
    }
    show();
  }

  // ── 벽사록 화면 ──
  var loreView = { cat: '세력', id: null };

  function renderLore() {
    var seen = loreTokens();
    var open = Core.LORE.filter(function (e) { return Core.loreUnlocked(e, seen); }).length;
    document.getElementById('lore-count').textContent = '밝힌 기록 ' + open + ' / ' + Core.LORE.length;
    var tabs = document.getElementById('lore-tabs');
    tabs.innerHTML = '';
    Core.LORE_CATEGORIES.forEach(function (cat) {
      var b = el('button', cat === loreView.cat ? 'on' : '', cat);
      b.type = 'button';
      b.addEventListener('click', function () { loreView = { cat: cat, id: null }; renderLore(); });
      tabs.appendChild(b);
    });
    var body = document.getElementById('lore-body');
    body.innerHTML = '';
    body.scrollTop = 0;
    var entry = loreView.id && Core.LORE.filter(function (e) { return e.id === loreView.id; })[0];
    if (entry) return renderLoreDetail(body, entry);
    var list = Core.LORE.filter(function (e) { return e.cat === loreView.cat; });
    if (!list.length) return body.appendChild(el('div', 'empty', '아직 기록이 없습니다.'));
    list.forEach(function (e) {
      var on = Core.loreUnlocked(e, seen);
      var row = el('button', 'entry' + (on ? '' : ' locked'));
      row.type = 'button';
      var name = el('span', '', on ? e.name : '?????');
      if (on && e.hanja) name.appendChild(el('small', '', e.hanja));
      row.appendChild(name);
      var g = Core.HISTORICITY[e.grade];
      row.appendChild(el('span', 'grade', on ? g.icon + ' ' + g.label : '잠김'));
      row.disabled = !on;
      row.addEventListener('click', function () { loreView.id = e.id; renderLore(); });
      body.appendChild(row);
    });
  }

  function renderLoreDetail(body, e) {
    var box = el('div', 'detail');
    var back = el('button', 'back', '← ' + e.cat + ' 목록');
    back.type = 'button';
    back.addEventListener('click', function () { loreView.id = null; renderLore(); });
    box.appendChild(back);
    var h = el('h3', '', e.name);
    if (e.grade === 'A') h.appendChild(el('span', 'seal', '史'));
    box.appendChild(h);
    var meta = [e.hanja, e.entityType ? '분류 ' + Core.ENTITY_TYPES[e.entityType] : '', e.faction ? e.faction + ' 계열' : '']
      .filter(Boolean).join(' · ');
    if (meta) box.appendChild(el('div', 'meta', meta));
    // 기록(객관적 설명) → 인물의 기록(캐릭터 시점) → 고증 메모 (specs/immersion.md 8장)
    box.appendChild(el('div', 'part', '기록'));
    box.appendChild(el('p', '', e.lore));
    Object.keys(e.characterNotes || {}).forEach(function (who) {
      box.appendChild(el('div', 'part', Core.ALLY_DEFS[who].name + '의 기록'));
      box.appendChild(el('p', 'char-note', e.characterNotes[who]));
    });
    var g = Core.HISTORICITY[e.grade];
    var foot = el('div', 'foot');
    foot.appendChild(el('b', '', g.icon + ' ' + g.label));
    foot.appendChild(el('div', '', e.note));
    if (e.motif) foot.appendChild(el('div', '', '모티프: ' + e.motif.join(', ')));
    box.appendChild(foot);
    body.appendChild(box);
  }

  function openLore() {
    loreView.id = null;
    renderLore();
    document.getElementById('lore').hidden = false;
    document.getElementById('lore-close').focus();
  }
  function closeLore() {
    document.getElementById('lore').hidden = true;
  }
  document.getElementById('lore-open-title').addEventListener('click', openLore);
  document.getElementById('lore-open-battle').addEventListener('click', openLore);
  document.getElementById('lore-close').addEventListener('click', closeLore);
  document.getElementById('lore').addEventListener('click', function (ev) {
    if (ev.target.id === 'lore') closeLore(); // 종이 바깥을 누르면 닫힌다
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !document.getElementById('lore').hidden) closeLore();
  });

  // ── 월드맵 (specs/worldmap.md) — 지역 상태는 진행(progress)에서 계산, 본 급보만 저장 ──
  var WORLD_KEY = 'joseon-exorcist.world';
  var worldSeen = (function () {
    try {
      var v = JSON.parse(localStorage.getItem(WORLD_KEY));
      if (v && v.v === 1 && Array.isArray(v.seen)) return v.seen.filter(function (t) { return typeof t === 'string'; });
    } catch (e) { /* 없거나 깨졌으면 처음부터 */ }
    return [];
  })();
  function saveWorld() {
    try { localStorage.setItem(WORLD_KEY, JSON.stringify({ v: 1, seen: worldSeen })); } catch (e) { /* 저장이 막히면 이번에만 */ }
  }
  var worldOverride = {}; // ?dev=1 도구의 임시 상태 (메모리에만)
  var worldSelected = null;
  var STATUS_DOT = { EXORCISM_REQUIRED: '🔴', OMEN: '🟡', STABILIZED: '🔵', PEACEFUL: '⚪', UNKNOWN: '🔒', LOCKED: '🔒', BLOCKED: '⛔', HQ: '' };

  // 지역 사이 길 (지도 좌표 100×130). 산을 돌아가게 굽혔다. 키는 두 지역 id
  var ROAD_PATHS = {
    'hq-heukseok': 'M50 95 C43 89 51 81 46 74',
    'heukseok-yeougol': 'M46 74 C38 67 60 63 53 52',
    'yeougol-seonang': 'M53 52 C58 45 41 41 46 31',
    'seonang-pyesachal': 'M46 31 C40 24 62 20 58 11',
    'yeougol-keungoeul': 'M53 52 C63 59 72 43 84 50',
    'yeougol-sangil': 'M53 52 C42 59 29 43 16 50',
    'hq-naru': 'M50 95 C57 102 43 110 50 117'
  };
  function svgEl(tag, cls, attrs) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (cls) n.setAttribute('class', cls);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  function regionStatus(id) {
    return worldOverride[id] || Core.worldState(progress)[id];
  }

  function renderWorld() {
    var rank = Core.rankFor(progress.merit).name;
    var rankBox = document.getElementById('world-rank');
    rankBox.innerHTML = '';
    rankBox.appendChild(document.createTextNode(rank + ' 벽사청 종사관 윤무겸 · 공적 '));
    rankBox.appendChild(el('b', '', String(progress.merit)));
    var m = Core.currentMission(progress);
    var mission = document.getElementById('world-mission');
    mission.innerHTML = '';
    mission.appendChild(el('small', '', '현재 임무'));
    mission.appendChild(document.createTextNode((STATUS_DOT[regionStatus(m.region)] || '') + ' ' + Core.regionById(m.region).name + ' — ' + m.title));
    // 길: 손으로 그린 굽은 산길. 막힌 곳(미확인·봉쇄·통행 불가)으로 가는 길은 흐리게
    var roads = document.getElementById('world-roads');
    roads.innerHTML = '';
    var shutSt = ['LOCKED', 'BLOCKED', 'UNKNOWN'];
    Object.keys(ROAD_PATHS).forEach(function (key) {
      var ends = key.split('-');
      var g = svgEl('g', shutSt.indexOf(regionStatus(ends[0])) !== -1 || shutSt.indexOf(regionStatus(ends[1])) !== -1 ? 'shut' : '');
      g.appendChild(svgEl('path', 'road-edge', { d: ROAD_PATHS[key] }));
      g.appendChild(svgEl('path', 'road', { d: ROAD_PATHS[key] }));
      roads.appendChild(g);
    });
    // 길 위의 막힘: 봉쇄된 산길의 무너진 바위, 폐사찰 길의 금줄 (상태가 풀리면 사라진다)
    var marks = document.getElementById('world-marks');
    marks.innerHTML = '';
    if (regionStatus('sangil') === 'BLOCKED') {
      [[27, 48, 2.2], [29.5, 49.6, 1.6], [25, 50, 1.4], [28.6, 46.4, 1.2]].forEach(function (q) {
        marks.appendChild(svgEl('circle', 'rock', { cx: q[0], cy: q[1], r: q[2] }));
      });
    }
    if (regionStatus('pyesachal') === 'LOCKED') {
      marks.appendChild(svgEl('path', 'rope', { d: 'M46 20 Q52 23 58 19' }));
      [[49, 21.2], [52, 21.8], [55, 20.9]].forEach(function (q) {
        marks.appendChild(svgEl('rect', 'rope-tab', { x: q[0] - 0.6, y: q[1], width: 1.2, height: 2.2 }));
      });
    }
    // 노드
    var nodes = document.getElementById('world-nodes');
    nodes.innerHTML = '';
    Core.REGIONS.forEach(function (r) {
      var st = regionStatus(r.id);
      var b = el('button', 'node st-' + st + (r.id === worldSelected ? ' on' : ''));
      b.type = 'button';
      b.dataset.id = r.id;
      b.style.left = r.x + '%';
      b.style.top = (r.y / 130 * 100) + '%';
      b.appendChild(el('span', 'seal', r.mark));
      b.appendChild(el('span', 'label', r.name));
      // 안전한 곳은 조용하게: 평온·본진은 상태 글자 없음 (specs/worldmap-polish.md 3장)
      if (st !== 'HQ' && st !== 'PEACEFUL') b.appendChild(el('span', 'state', Core.REGION_STATUS[st]));
      b.setAttribute('aria-label', r.name + ' ' + Core.REGION_STATUS[st]);
      b.addEventListener('click', function (ev) { ev.stopPropagation(); openRegion(r.id); });
      nodes.appendChild(b);
    });
    renderWorldDev();
  }

  function sheetButton(row, label, cls, fn) {
    var b = el('button', cls || '', label);
    b.type = 'button';
    b.addEventListener('click', fn);
    row.appendChild(b);
    return b;
  }

  // 지역 카드 (바텀시트)
  function openRegion(id) {
    worldSelected = id;
    var r = Core.regionById(id);
    var st = regionStatus(id);
    var sheet = document.getElementById('world-sheet');
    sheet.innerHTML = '';
    var head = el('div', 'head');
    head.appendChild(el('h2', '', r.title || r.name));
    if (st !== 'HQ') head.appendChild(el('span', 'w-badge ' + st, Core.REGION_STATUS[st]));
    var x = el('button', 'x', '✕');
    x.type = 'button';
    x.setAttribute('aria-label', '닫기');
    x.addEventListener('click', closeRegion);
    head.appendChild(x);
    sheet.appendChild(head);
    sheet.appendChild(el('p', '', Core.regionDesc(r, st)));
    var row = el('div', 'row');
    if (st === 'HQ') {
      var stats = el('div', 'stats');
      stats.appendChild(document.createTextNode('현재 품계 '));
      stats.appendChild(el('b', '', Core.rankFor(progress.merit).name));
      stats.appendChild(document.createTextNode(' · 누적 공적 '));
      stats.appendChild(el('b', '', String(progress.merit)));
      sheet.appendChild(stats);
      sheetButton(row, '📖 벽사록', '', openLore);
      sheetButton(row, '현재 임무', '', showMission);
    } else if (r.chapter && worldOverride[id]) {
      // ?dev=1 임시 상태에서는 출동하지 않는다 — 진행 저장이 장 순서와 어긋나지 않게
      sheet.appendChild(el('div', 'note', 'DEV 임시 상태입니다. [되돌리기] 후 출동하세요.'));
    } else if (Core.sortieChapter(progress, id) && st !== 'STABILIZED') {
      // 다음 장의 무대: [출동] (3장 서낭고개는 [조사한다] — 성격이 다른 임무)
      sheetButton(row, r.action || '출동', 'go', function () { closeRegion(); startChapter(r.chapter); });
    } else if (st === 'STABILIZED' && r.record) {
      var rec = sheetButton(row, '기록 보기', '', function () {
        sheet.insertBefore(el('div', 'record', r.record), row);
        row.removeChild(rec); // 한 번 보면 버튼은 사라진다
      });
    } else if (Core.regionNote(r, st)) {
      sheet.appendChild(el('div', 'note', Core.regionNote(r, st)));
    }
    if (row.childNodes.length) sheet.appendChild(row);
    sheet.hidden = false;
    renderWorld();
    liftMapFor(id);
  }
  function closeRegion() {
    worldSelected = null;
    document.getElementById('world-sheet').hidden = true;
    document.getElementById('world-map').style.transform = '';
    renderWorld();
  }
  // 고른 지역이 카드에 가려지면 지도를 그만큼 위로 올린다 (본진·나루터처럼 아래쪽 노드)
  function liftMapFor(id) {
    var map = document.getElementById('world-map');
    map.style.transform = '';
    var node = document.querySelector('#world-nodes .node[data-id="' + id + '"]');
    var sheetTop = document.getElementById('world-sheet').getBoundingClientRect().top;
    var over = node.getBoundingClientRect().bottom + 8 - sheetTop;
    if (over > 0) map.style.transform = 'translateY(' + (-over) + 'px)';
  }

  // 본진 [현재 임무] → 임무 카드, [지도에서 보기] 로 그 지역
  function showMission() {
    var m = Core.currentMission(progress);
    var sheet = document.getElementById('world-sheet');
    sheet.innerHTML = '';
    var head = el('div', 'head');
    head.appendChild(el('h2', '', '현재 임무 — ' + m.title));
    var x = el('button', 'x', '✕');
    x.type = 'button';
    x.addEventListener('click', closeRegion);
    head.appendChild(x);
    sheet.appendChild(head);
    sheet.appendChild(el('p', '', m.text));
    var row = el('div', 'row');
    sheetButton(row, '지도에서 보기', '', function () { openRegion(m.region); pulseRegion(m.region); });
    sheet.appendChild(row);
    sheet.hidden = false;
  }

  function pulseRegion(id) {
    var n = document.querySelector('#world-nodes .node[data-id="' + id + '"]');
    if (!n) return;
    n.classList.remove('news');
    void n.offsetWidth;
    n.classList.add('news');
  }

  // 급보: 장을 깬 뒤 처음 지도를 볼 때 차례로
  function showNews() {
    var news = Core.worldNews(progress, worldSeen)[0];
    var box = document.getElementById('world-news');
    if (!news) { box.hidden = true; return; }
    document.getElementById('world-news-title').textContent = news.title;
    document.getElementById('world-news-text').textContent = news.text;
    box.hidden = false;
    document.getElementById('world-news-ok').onclick = function () {
      worldSeen.push(news.id);
      saveWorld();
      box.hidden = true;
      pulseRegion(news.region);
      setTimeout(showNews, 400);
    };
  }

  function showWorld() {
    ['title', 'result', 'scene', 'prologue'].forEach(function (id) { document.getElementById(id).hidden = true; });
    clearToasts();
    worldSelected = null;
    document.getElementById('world-sheet').hidden = true;
    document.getElementById('world').hidden = false;
    renderWorld();
    showNews();
  }

  // ?dev=1: 흑석촌·여우골 상태를 잠깐 바꿔 보는 도구 (저장하지 않는다)
  function renderWorldDev() {
    var box = document.getElementById('world-dev');
    box.hidden = !DEV;
    if (!DEV) return;
    box.innerHTML = '';
    box.appendChild(el('b', '', 'DEV'));
    ['heukseok', 'yeougol'].forEach(function (id) {
      box.appendChild(el('span', '', Core.regionById(id).name));
      [['UNKNOWN', '미확인'], ['EXORCISM_REQUIRED', '괴변'], ['STABILIZED', '안정']].forEach(function (o) {
        sheetButton(box, o[1], '', function (ev) { ev.stopPropagation(); worldOverride[id] = o[0]; renderWorld(); });
      });
    });
    sheetButton(box, '되돌리기', '', function (ev) { ev.stopPropagation(); worldOverride = {}; renderWorld(); });
  }

  // 카드 바깥(지도 빈 곳·위쪽 글자)을 누르면 카드를 닫는다. 노드·버튼·카드 자신은 제외
  document.getElementById('world').addEventListener('click', function (ev) {
    if (document.getElementById('world-sheet').hidden) return;
    if (ev.target.closest('.node, button, #world-sheet, #world-news')) return;
    closeRegion();
  });
  document.getElementById('world-home').addEventListener('click', function () {
    document.getElementById('world').hidden = true;
    showTitle();
  });
  document.getElementById('world-lore').addEventListener('click', openLore);
  document.getElementById('world-mission').addEventListener('click', function () {
    var m = Core.currentMission(progress);
    openRegion(m.region);
    pulseRegion(m.region); // openRegion 이 노드를 다시 그리므로 그 뒤에
  });

  // ── 개발자용 플레이 기록 화면 (?dev=1) ──
  function isAllyId(id) { return !!Core.ALLY_DEFS[id] || /^gwangun\d$/.test(id); }
  function countBy(list, key) {
    var out = {};
    list.forEach(function (x) { out[x[key]] = (out[x[key]] || 0) + 1; });
    return out;
  }
  function renderPlayLog() {
    var list = document.getElementById('playlog-list');
    list.innerHTML = '';
    document.getElementById('playlog-title').textContent = '🧪 플레이 기록 (' + playStore.battles.length + '판)';
    if (!playStore.battles.length) return list.appendChild(el('div', 'empty', '아직 끝난 전투가 없습니다. 일반 주소로 플레이한 판도 여기에 쌓입니다.'));
    playStore.battles.slice().reverse().forEach(function (b) {
      var box = el('div', 'battle');
      var ch = CHAPTERS[b.chapter] ? CHAPTERS[b.chapter].label : b.chapter;
      box.appendChild(el('h3', b.result, ch + ' — ' + (b.result === 'win' ? '승리' : '패배') + ' · ' + b.totalTurns + '턴'));
      box.appendChild(el('div', 'meta', [b.rank, '관군 ' + b.soldierCount, '다시하기 ' + b.restartCount + '회', b.at ? new Date(b.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''].join(' · ')));
      Object.keys(b.names).filter(isAllyId).forEach(function (id) {
        var parts = [];
        if (b.unitMoves[id]) parts.push('이동 ' + b.unitMoves[id]);
        if (b.attacks[id]) parts.push('공격 ' + b.attacks[id]);
        if (b.skillsByUnit[id]) parts.push('스킬 ' + b.skillsByUnit[id]);
        if (b.damageDealt[id]) parts.push('준 피해 ' + b.damageDealt[id]);
        if (b.damageTaken[id]) parts.push('받은 피해 ' + b.damageTaken[id]);
        if (b.healing[id]) parts.push('회복 ' + b.healing[id]);
        box.appendChild(el('div', '', b.names[id] + ' ' + (parts.join(' / ') || '행동 없음')));
      });
      if (b.chapter === 'ch2') {
        box.appendChild(el('div', '', '달래 정화수 ' + b.dalraeHealCount + '회 · 끝날 때 탈출로까지 ' +
          (b.dalraeEscapeDistance === null ? '— (물러남·길 막힘)' : b.dalraeEscapeDistance + '칸')));
      }
      var how = countBy(b.defeatedUnits, 'how');
      var downs = Object.keys(how).map(function (k) { return k + ' ' + how[k]; });
      box.appendChild(el('div', '', downs.length ? downs.join(' · ') : '쓰러진 유닛 없음'));
      box.appendChild(el('div', '', '공적 +' + b.meritEarned));
      list.appendChild(box);
    });
  }
  var clearArmed = false;
  function openPlayLog() {
    clearArmed = false;
    document.getElementById('playlog-clear').textContent = '기록 지우기';
    document.getElementById('playlog-msg').textContent = '';
    document.getElementById('playlog-json').hidden = true;
    renderPlayLog();
    document.getElementById('playlog').hidden = false;
  }
  document.getElementById('playlog-open-title').hidden = !DEV;
  document.getElementById('playlog-open-battle').hidden = !DEV;
  document.getElementById('playlog-open-title').addEventListener('click', openPlayLog);
  document.getElementById('playlog-open-battle').addEventListener('click', openPlayLog);
  document.getElementById('playlog-close').addEventListener('click', function () { document.getElementById('playlog').hidden = true; });
  document.getElementById('playlog-copy').addEventListener('click', function () {
    var text = JSON.stringify(playStore, null, 2);
    var msg = document.getElementById('playlog-msg');
    var box = document.getElementById('playlog-json');
    function fallback() {
      box.value = text;
      box.hidden = false;
      box.focus();
      box.select();
      msg.textContent = '자동 복사가 막혔습니다. 선택된 글을 길게 눌러 복사하세요.';
    }
    try {
      navigator.clipboard.writeText(text).then(function () { msg.textContent = '복사했습니다 (' + playStore.battles.length + '판).'; }, fallback);
    } catch (e) { fallback(); }
  });
  // 지우기는 두 번 눌러야 한다 (다음 테스트 사람 전에)
  document.getElementById('playlog-clear').addEventListener('click', function () {
    var btn = document.getElementById('playlog-clear');
    if (!clearArmed) {
      clearArmed = true;
      btn.textContent = '한 번 더 누르면 지웁니다';
      return;
    }
    playStore = { v: 1, battles: [], restarts: {} };
    savePlayStore();
    clearArmed = false;
    btn.textContent = '기록 지우기';
    document.getElementById('playlog-msg').textContent = '지웠습니다.';
    renderPlayLog();
  });

  // 장 시작: 공적 누계로 품계·관군을 정하고 시작 대사부터
  function startChapter(id) {
    chapterId = id;
    clearToasts();
    document.getElementById('result').hidden = true;
    document.getElementById('title').hidden = true;
    document.getElementById('world').hidden = true;
    state = Core.newBattle(Core.STAGES[id], { merit: progress.merit });
    playLog = Core.newPlayLog(state, id, playStore.restarts[id] || 0);
    ui = { step: 'none', id: null, kind: null, busy: false, infoId: null, infoCell: null, dallaeGone: false, orb: null, seonangWarned: false, askedSeonang: false };
    buildBoard();
    Core.startAllyPhase(state, Math.random);
    render();
    playScene(CHAPTERS[id].intro(), function () {
      ui.busy = false;
      render();
      discover(Core.loreTokensForBattle(state, id)); // 이 장에서 만난 세력·귀물
      terrainTips();
      autoSelect();
    });
  }

  // 첫 화면: 누계·품계와 이어서 할 장
  function showTitle() {
    document.getElementById('result').hidden = true;
    document.getElementById('scene').hidden = true;
    document.getElementById('title').hidden = false;
    document.getElementById('new-confirm').hidden = true;
    var started = progress.cleared.length > 0;
    var prog = document.getElementById('title-prog');
    prog.innerHTML = '';
    if (started) {
      prog.appendChild(document.createTextNode('공적 누계 '));
      prog.appendChild(el('b', '', String(progress.merit)));
      prog.appendChild(document.createTextNode(' · 품계 '));
      prog.appendChild(el('b', '', Core.rankFor(progress.merit).name));
    }
    var cont = document.getElementById('btn-continue');
    cont.hidden = !started;
    cont.textContent = '이어하기'; // 언제나 지도로 (specs/worldmap.md 1장)
    document.getElementById('btn-new').textContent = started ? '처음부터' : '시작하기';
    document.getElementById('title-note').textContent = canStore ? '' : '이 브라우저에는 진행이 저장되지 않습니다.';
  }

  // 전투 끝: 승리면 승리 후 대사 → 승리 화면, 패배면 바로 패배 화면
  function finish() {
    savePlayLog();
    // 전투가 끝나면 밀린 쓰러짐 알림은 버리고 마지막 일격(흑린·달래)의 알림만 바로 보인다. 벽사록 알림은 남긴다
    var others = toastQueue.filter(function (t) { return t.rank === TOAST_RANK.other; });
    toastQueue = toastQueue.filter(function (t) { return t.rank < TOAST_RANK.other; }).concat(others.slice(-1));
    if (toastCurrent && toastCurrent.rank === TOAST_RANK.other && others.length) {
      if (toastCurrent.node.parentNode) toastCurrent.node.parentNode.removeChild(toastCurrent.node);
      clearTimeout(toastTimer);
      nextToast();
    }
    ui.busy = true;
    clearSelection();
    render();
    if (state.result === 'win') {
      setTimeout(function () { playScene(CHAPTERS[chapterId].outro(), showResult); }, 900); // 마지막 피해 숫자를 본 뒤
    } else {
      setTimeout(showResult, 900);
    }
  }

  // 결과 화면: 이기면 누계에 더해 저장하고 다음 장 안내, 지면 다시하기
  function showResult() {
    var ch = CHAPTERS[chapterId];
    var win = state.result === 'win';
    var before = Core.rankFor(progress.merit).name;
    if (win) {
      discover(['clear:' + chapterId]); // 누계 저장 전에: 깬 장은 이미 본 것으로 치기 때문
      progress = Core.applyResult(progress, chapterId, 'win', state.merit);
      saveProgress();
    }
    var t = document.getElementById('result-text');
    t.className = 'title ' + (win ? 'win' : 'lose');
    t.textContent = win
      ? ch.title + ' 완료 · 공적 ' + state.merit + ' / ' + Core.maxMerit(Core.STAGES[chapterId])
      : (typeof ch.lose === 'string' ? ch.lose : ch.lose[state.loseReason] || ch.lose.wipe);
    var sub = '';
    if (win) {
      var after = Core.rankFor(progress.merit).name;
      sub = '공적 누계 ' + progress.merit + ' · 품계 ' + after + (after !== before ? ' (승진!)' : '');
    }
    var subEl = document.getElementById('result-sub');
    subEl.textContent = sub;
    subEl.style.whiteSpace = 'pre-line';
    document.getElementById('btn-next').hidden = false; // 이겨도 져도 [지도로 돌아간다] (자동으로 다음 장을 시작하지 않는다)
    document.getElementById('btn-retry').hidden = win;
    document.getElementById('result').hidden = false;
  }

  document.getElementById('btn-retry').addEventListener('click', function () {
    playStore.restarts[chapterId] = (playStore.restarts[chapterId] || 0) + 1;
    savePlayStore();
    startChapter(chapterId);
  });
  document.getElementById('btn-next').addEventListener('click', showWorld); // [지도로 돌아간다]
  document.getElementById('btn-home').addEventListener('click', showTitle);
  document.getElementById('btn-continue').addEventListener('click', showWorld); // 이어하기는 언제나 지도로
  // 프롤로그: 문장이 한 덩이씩 나타나고(약 10초) 마지막에 [임무를 받는다]. 화면을 누르면 한 번에 다 보인다
  var PROLOGUE_STEP_MS = 1300;
  var prologueTimers = [];
  function showPrologue() {
    var box = document.getElementById('prologue');
    var parts = Array.prototype.slice.call(box.querySelectorAll('p')).concat([document.getElementById('btn-mission')]);
    parts.forEach(function (n) { n.classList.remove('on'); });
    box.hidden = false;
    document.getElementById('title').hidden = true;
    function reveal(n) { n.classList.add('on'); }
    prologueTimers = parts.map(function (n, i) {
      return setTimeout(function () { reveal(n); }, reduceMotion ? 0 : 400 + i * PROLOGUE_STEP_MS);
    });
    box.onclick = function (ev) {
      if (ev.target.id === 'btn-mission') return;
      prologueTimers.forEach(clearTimeout);
      parts.forEach(reveal);
    };
  }
  document.getElementById('btn-mission').addEventListener('click', function () {
    prologueTimers.forEach(clearTimeout);
    document.getElementById('prologue').hidden = true;
    showWorld(); // 프롤로그 뒤에는 지도부터 (벽사청 → 흑석촌 출동)
  });

  // 처음부터: 진행이 있으면 확인 화면을 거친다 (브라우저 확인 창은 쓸 수 없는 환경이라 화면 안에)
  function newGame() {
    document.getElementById('new-confirm').hidden = true;
    progress = Core.newProgress();
    saveProgress();
    worldSeen = []; // 새 게임에서는 급보를 다시 본다
    saveWorld();
    showPrologue();
  }
  document.getElementById('btn-new').addEventListener('click', function () {
    if (progress.cleared.length > 0) document.getElementById('new-confirm').hidden = false;
    else newGame();
  });
  document.getElementById('btn-new-yes').addEventListener('click', newGame);
  document.getElementById('btn-new-no').addEventListener('click', function () {
    document.getElementById('new-confirm').hidden = true;
  });

  document.getElementById('btn-end').addEventListener('click', function () {
    if (ui.busy) return;
    endTurn();
  });

  document.getElementById('btn-wait').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    var from = startPos(ui.id), actor = ui.id;
    Core.wait(state, ui.id);
    logAllyAction(actor, from, []);
    afterAction();
  });
  document.getElementById('btn-cancel').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    Core.cancelMove(state, ui.id);
    clearSelection();
    render();
  });
  document.getElementById('btn-seal').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    var from = startPos(ui.id), actor = ui.id;
    var events = Core.repairSeal(state, ui.id);
    if (!events) return;
    logAllyAction(actor, from, events);
    afterAction(events);
  });
  document.getElementById('btn-attack').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    ui.step = 'target';
    ui.kind = 'attack';
    render();
  });
  document.getElementById('btn-skill').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    ui.step = 'target';
    ui.kind = 'skill';
    render();
  });

  board.addEventListener('click', function (ev) {
    var cell = ev.target.closest('.cell');
    if (cell) onCell(+cell.dataset.r, +cell.dataset.c);
  });

  buildBoard();
  render();
  showTitle();
})();
</script>

<!-- 맵 에디터 화면 (specs/editor.md). 편집 규칙은 Core.paintStage 등 core 가 맡는다 -->
<script id="editor">
(function () {
  'use strict';

  var TERRAIN_CLASS = { '.': 't-dirt', 'D': 't-rock', 'M': 't-shrine', 'K': 't-spring', 'E': 't-escape' };
  var TERRAIN_MARK = { 'D': '🛖', 'M': '🏮', 'K': '💧', 'E': '🌲' };

  var stage = JSON.parse(Core.encodeStage(Core.STAGES.ch1)); // 1장 맵으로 시작
  var app = document.getElementById('editor-app');
  var game = document.getElementById('app');
  var board = document.getElementById('ed-board');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function unitAt(r, c) {
    var all = stage.allies.map(function (a) { return { u: a, side: 'ally' }; })
      .concat(stage.enemies.map(function (e) { return { u: e, side: 'enemy' }; }));
    for (var i = 0; i < all.length; i++) if (all[i].u.r === r && all[i].u.c === c) return all[i];
    return null;
  }

  function unitTile(x) {
    var d = x.side === 'ally' ? Core.ALLY_DEFS[x.u.id] : Core.ENEMY_TYPES[x.u.type];
    var cls = x.side === 'enemy' ? 'f-enemy' : (d.guest ? 'f-guest' : 'f-bs');
    var tile = el('div', 'unit ' + cls, d.emoji);
    if (d.guest) tile.appendChild(el('span', 'badge', '객'));
    return tile;
  }

  // 맵 폭: 화면 폭과 높이(58vh) 중 작은 쪽에 맞추되, 칸 모양은 정사각형을 유지한다
  function sizeBoard() {
    var byHeight = window.innerHeight * 0.58 * stage.cols / stage.rows;
    var w = Math.min(window.innerWidth - 16, byHeight, 464);
    board.style.width = w + 'px';
    board.style.height = (w * stage.rows / stage.cols) + 'px';
    board.style.gridTemplateColumns = 'repeat(' + stage.cols + ', 1fr)';
    board.style.gridTemplateRows = 'repeat(' + stage.rows + ', 1fr)';
  }

  function render() {
    document.getElementById('ed-name').value = stage.name || '';
    document.getElementById('ed-rows').textContent = stage.rows;
    document.getElementById('ed-cols').textContent = stage.cols;
    document.getElementById('ed-rows-dec').disabled = stage.rows <= Core.ROWS_MIN;
    document.getElementById('ed-rows-inc').disabled = stage.rows >= Core.ROWS_MAX;
    document.getElementById('ed-cols-dec').disabled = stage.cols <= Core.COLS_MIN;
    document.getElementById('ed-cols-inc').disabled = stage.cols >= Core.COLS_MAX;
    sizeBoard();
    board.innerHTML = '';
    for (var r = 0; r < stage.rows; r++) {
      for (var c = 0; c < stage.cols; c++) {
        var t = stage.map[r].charAt(c);
        var cell = el('div', 'cell ' + TERRAIN_CLASS[t]);
        cell.dataset.r = r;
        cell.dataset.c = c;
        if (TERRAIN_MARK[t]) cell.appendChild(el('span', 'mark', TERRAIN_MARK[t]));
        (stage.reserves || []).forEach(function (p, i) {
          if (p.r === r && p.c === c) cell.appendChild(el('span', 'reserve-mark', '관' + (i + 1)));
        });
        var x = unitAt(r, c);
        if (x) cell.appendChild(unitTile(x));
        board.appendChild(cell);
      }
    }
    var problems = Core.validateStage(stage);
    problems.forEach(function (p) {
      var cell = p.r !== undefined && board.querySelector('.cell[data-r="' + p.r + '"][data-c="' + p.c + '"]');
      if (cell) cell.classList.add('warn');
    });
    renderWarnings(problems);
    if (!pasting) document.getElementById('ed-code').value = Core.encodeStage(stage);
  }

  // ── 브라우저 저장 (이 기기·이 브라우저에만 남는다) ──
  var STORE_KEY = 'joseon-exorcist.maps';
  var NO_STORE = '이 브라우저에는 저장할 수 없습니다. 코드 복사를 쓰세요.';

  function readSaved() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {};
    } catch (e) {
      return null; // 저장소를 쓸 수 없음
    }
  }
  function writeSaved(all) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(all));
      return true;
    } catch (e) {
      return false;
    }
  }

  var armedDelete = null; // 삭제는 두 번 눌러야 한다 (확인 창을 쓸 수 없는 환경 대비)
  function renderSaved() {
    var list = document.getElementById('ed-saved');
    list.innerHTML = '';
    var all = readSaved();
    if (all === null) return list.appendChild(el('li', 'empty', NO_STORE));
    var names = Object.keys(all).sort();
    if (!names.length) return list.appendChild(el('li', 'empty', '저장한 맵이 없습니다.'));
    names.forEach(function (name) {
      var li = el('li');
      li.appendChild(el('span', '', name));
      var load = el('button', 'small-btn', '불러오기');
      load.type = 'button';
      load.addEventListener('click', function () {
        var result = Core.decodeStage(all[name]);
        if (result.error) return say(result.error, true);
        stage = result.stage;
        setPasting(false);
        render();
        say('불러왔습니다: ' + name);
      });
      var del = el('button', 'small-btn', armedDelete === name ? '정말 삭제' : '삭제');
      del.type = 'button';
      del.addEventListener('click', function () {
        if (armedDelete !== name) {
          armedDelete = name;
          renderSaved();
          setTimeout(function () { if (armedDelete === name) { armedDelete = null; renderSaved(); } }, 3000);
          return;
        }
        armedDelete = null;
        var now = readSaved() || {};
        delete now[name];
        if (!writeSaved(now)) return say(NO_STORE, true);
        renderSaved();
        say('삭제했습니다: ' + name);
      });
      li.appendChild(load);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  document.getElementById('ed-save').addEventListener('click', function () {
    var name = (stage.name || '').trim();
    if (!name) return say('맵 이름을 적어 주세요.', true);
    var all = readSaved();
    if (all === null) return say(NO_STORE, true);
    var existed = Object.prototype.hasOwnProperty.call(all, name);
    all[name] = Core.encodeStage(stage);
    if (!writeSaved(all)) return say(NO_STORE, true);
    renderSaved();
    say((existed ? '덮어써서 저장했습니다: ' : '저장했습니다: ') + name);
  });

  // ── 맵 코드 복사·붙여넣기 ──
  var pasting = false;
  var codeBox = document.getElementById('ed-code');

  function say(text, bad) {
    var m = document.getElementById('ed-msg');
    m.textContent = text;
    m.className = bad ? 'bad' : '';
  }

  function setPasting(on) {
    pasting = on;
    codeBox.readOnly = !on;
    document.getElementById('ed-load').hidden = !on;
    document.getElementById('ed-paste-cancel').hidden = !on;
    document.getElementById('ed-copy').hidden = on;
    document.getElementById('ed-paste').hidden = on;
    if (on) {
      codeBox.value = '';
      codeBox.placeholder = '받은 맵 코드를 여기에 붙여 넣으세요';
      codeBox.focus();
    } else {
      codeBox.placeholder = '';
      codeBox.value = Core.encodeStage(stage);
    }
  }

  function selectCode() {
    codeBox.focus();
    codeBox.select();
    codeBox.setSelectionRange(0, codeBox.value.length);
  }

  document.getElementById('ed-copy').addEventListener('click', function () {
    codeBox.value = Core.encodeStage(stage);
    var fallback = function () {
      selectCode();
      say('자동 복사가 막혀 있어 코드를 선택해 두었습니다. 길게 눌러(또는 Ctrl+C) 복사하세요.', true);
    };
    if (!navigator.clipboard || !navigator.clipboard.writeText) return fallback();
    navigator.clipboard.writeText(codeBox.value).then(function () {
      say('맵 코드를 복사했습니다.');
    }, fallback);
  });
  document.getElementById('ed-paste').addEventListener('click', function () {
    say('');
    setPasting(true);
  });
  document.getElementById('ed-paste-cancel').addEventListener('click', function () {
    say('');
    setPasting(false);
  });
  document.getElementById('ed-load').addEventListener('click', function () {
    var result = Core.decodeStage(codeBox.value);
    if (result.error) return say(result.error, true); // 지금 맵은 그대로
    stage = result.stage;
    setPasting(false);
    render();
    say('불러왔습니다: ' + (stage.name || '이름 없는 맵'));
  });

  // 도구 줄: 지형 4 · 아군 5 · 요괴 4 · 지우개
  var TOOL_GROUPS = [
    { label: '지형', tools: [
      { kind: 'terrain', t: '.', name: '흙길', cls: 't-dirt' },
      { kind: 'terrain', t: 'D', name: '초가집·바위', cls: 't-rock', mark: '🛖' },
      { kind: 'terrain', t: 'M', name: '서낭당', cls: 't-shrine', mark: '🏮' },
      { kind: 'terrain', t: 'K', name: '약수터', cls: 't-spring', mark: '💧' },
      { kind: 'terrain', t: 'E', name: '탈출로 (달래가 닿으면 패배)', cls: 't-escape', mark: '🌲' }
    ] },
    { label: '아군', tools: Core.ALLY_ORDER.map(function (id) {
      return { kind: 'ally', id: id, name: Core.ALLY_DEFS[id].name, mark: Core.ALLY_DEFS[id].emoji };
    }) },
    { label: '요괴', tools: Core.ENEMY_ORDER.map(function (type) {
      return { kind: 'enemy', type: type, name: Core.ENEMY_TYPES[type].name, mark: Core.ENEMY_TYPES[type].emoji };
    }) },
    { label: '관군', tools: [
      { kind: 'reserve', index: 0, name: '관군 자리 1번 (정9품부터 관군이 선다)', mark: '🪖', num: '1' },
      { kind: 'reserve', index: 1, name: '관군 자리 2번 (종8품이면 관군이 선다)', mark: '🪖', num: '2' }
    ] },
    { label: '기타', tools: [{ kind: 'erase', name: '지우개 (유닛 → 관군 자리 → 지형 순서로 지움)', mark: '🧽' }] }
  ];
  var tool = TOOL_GROUPS[0].tools[1]; // 처음엔 초가집·바위

  function buildTools() {
    var box = document.getElementById('ed-tools');
    box.innerHTML = '';
    TOOL_GROUPS.forEach(function (g) {
      var row = el('div', 'tool-group');
      row.appendChild(el('span', '', g.label));
      g.tools.forEach(function (t) {
        var b = el('button', 'tool' + (t.cls ? ' sw ' + t.cls : ''), t.mark || '');
        b.type = 'button';
        b.title = t.name;
        b.setAttribute('aria-label', t.name);
        if (t.num) b.appendChild(el('span', 'num', t.num));
        if (t === tool) b.className += ' on';
        b.addEventListener('click', function () { tool = t; buildTools(); });
        row.appendChild(b);
      });
      box.appendChild(row);
    });
    document.getElementById('ed-tool-name').textContent = '선택: ' + tool.name;
  }

  // 경고 (core 의 validateStage). 문제가 있어도 저장·복사는 된다
  function renderWarnings(problems) {
    var list = document.getElementById('ed-warns');
    list.innerHTML = '';
    if (!problems.length) list.appendChild(el('li', 'ok', '✓ 문제없음 — 이 맵으로 전투를 만들 수 있습니다'));
    problems.forEach(function (p) {
      list.appendChild(el('li', '', '⚠ ' + p.msg + (p.r !== undefined ? ' (' + (p.r + 1) + '행 ' + (p.c + 1) + '열)' : '')));
    });
  }

  // 칠하기: 누른 칸을 칠하고, 지형 도구면 끌고 가는 칸도 칠한다
  var dragging = false, lastKey = null;
  function paintAt(target) {
    var cell = target && target.closest && target.closest('#ed-board .cell');
    if (!cell) return;
    var key = cell.dataset.r + ',' + cell.dataset.c;
    if (key === lastKey) return;
    lastKey = key;
    stage = Core.paintStage(stage, tool, +cell.dataset.r, +cell.dataset.c);
    render();
  }
  board.addEventListener('pointerdown', function (e) {
    // 터치는 누른 칸에 포인터가 붙잡히는데, 칠할 때마다 칸을 새로 그리므로 풀어 둔다
    if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) e.target.releasePointerCapture(e.pointerId);
    dragging = tool.kind === 'terrain';
    lastKey = null;
    paintAt(e.target);
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    paintAt(document.elementFromPoint(e.clientX, e.clientY));
  });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });

  function resize(dr, dc) {
    stage = Core.resizeStage(stage, stage.rows + dr, stage.cols + dc);
    render();
  }

  document.getElementById('ed-rows-dec').addEventListener('click', function () { resize(-1, 0); });
  document.getElementById('ed-rows-inc').addEventListener('click', function () { resize(1, 0); });
  document.getElementById('ed-cols-dec').addEventListener('click', function () { resize(0, -1); });
  document.getElementById('ed-cols-inc').addEventListener('click', function () { resize(0, 1); });
  document.getElementById('ed-name').addEventListener('input', function (e) { stage.name = e.target.value; });

  // #editor 이면 에디터, 아니면 게임
  function route() {
    var editing = location.hash === '#editor';
    app.hidden = !editing;
    game.hidden = editing;
    if (editing) {
      render();
      renderSaved();
    }
  }
  document.getElementById('open-editor').hidden = !/[?&]dev=1(&|$)/.test(location.search);
  document.getElementById('open-editor').addEventListener('click', function () {
    location.hash = 'editor';
    route();
  });
  document.getElementById('ed-back').addEventListener('click', function () {
    location.hash = '';
    route();
  });
  buildTools();
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', function () { if (!app.hidden) sizeBoard(); });
  route();
})();
</script>
</body>
</html>
