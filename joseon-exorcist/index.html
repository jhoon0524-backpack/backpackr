<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선 퇴마전 — 1장 흑린 토벌</title>
<style>
  :root {
    --bg: #0e1016;
    --panel: #181b24;
    --text: #e6e2d6;
    --muted: #8a8778;
    --dirt: #2a2620;
    --rock: #121212;
    --shrine: #3a2327;
    --spring: #1d3140;
    --bs: #d9443a;      /* 벽사청 */
    --guest: #9a9a9a;   /* 객장 */
    --enemy: #a35ad8;   /* 요괴 */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 8px; }

  /* 맵: 폭 360px 세로 화면에서도 8칸이 다 들어가게 화면 폭·높이 중 작은 쪽에 맞춘다 */
  #board {
    position: relative;
    width: min(calc(100vw - 16px), 58vh, 464px);
    aspect-ratio: 1;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 2px;
    background: #07080b;
    padding: 2px;
    border-radius: 6px;
    touch-action: manipulation;
  }
  .cell {
    position: relative;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .t-dirt   { background: var(--dirt); }
  .t-rock   { background: var(--rock); }
  .t-shrine { background: var(--shrine); }
  .t-spring { background: var(--spring); }
  .mark {
    position: absolute;
    font-size: clamp(12px, 4.5vw, 22px);
    opacity: .35;
    pointer-events: none;
  }
  .unit {
    position: relative;
    width: 86%;
    height: 86%;
    border: 2px solid;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 5.6vw, 28px);
    line-height: 1;
    background: rgba(0, 0, 0, .35);
    z-index: 1;
  }
  .f-bs    { border-color: var(--bs); }
  .f-guest { border-color: var(--guest); }
  .f-enemy { border-color: var(--enemy); }
  .badge {
    position: absolute;
    top: -1px;
    left: -1px;
    font-size: 9px;
    line-height: 1;
    padding: 1px 2px;
    background: var(--guest);
    color: #111;
    border-radius: 0 0 3px 0;
  }
  .hl::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 3px;
    pointer-events: none;
    z-index: 0;
  }
  .hl-move::after { background: rgba(70, 140, 255, .38); box-shadow: inset 0 0 0 2px rgba(120, 180, 255, .8); }
  .hl-attack::after { background: rgba(230, 60, 60, .35); box-shadow: inset 0 0 0 2px rgba(255, 110, 110, .9); }
  .hl-heal::after { background: rgba(60, 200, 110, .32); box-shadow: inset 0 0 0 2px rgba(110, 240, 150, .9); }
  .tag {
    position: absolute;
    top: 1px;
    right: 1px;
    z-index: 2;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 3px;
    border-radius: 3px;
    pointer-events: none;
  }
  .tag.good { background: #f5c542; color: #2a1d00; }
  .tag.bad { background: #5a6070; color: #e8e8e8; }
  .float {
    position: absolute;
    z-index: 5;
    font-size: 20px;
    font-weight: 800;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 1px 2px #000, 0 0 4px #000;
    animation: rise .9s ease-out forwards;
  }
  .float.dmg { color: #ff4a4a; }
  .float.dmg.good { font-size: 28px; color: #ff3030; }
  .float.dmg.good small { display: block; font-size: 10px; color: #f5c542; margin-top: -2px; }
  .float.dmg.bad { font-size: 15px; color: #c98a8a; }
  .unit.hit { animation: hit .35s ease-out; }
  @keyframes hit {
    0% { filter: brightness(3) saturate(0); transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); filter: brightness(1.6); }
    100% { filter: none; transform: translateX(0); }
  }
  .float.heal { color: #5ef08a; }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-70%); opacity: 0; }
  }
  .unit.selected { box-shadow: 0 0 0 2px #fff, 0 0 10px 2px rgba(255, 255, 255, .5); }
  .hpbar {
    position: absolute;
    left: 3px;
    right: 3px;
    bottom: 2px;
    height: 3px;
    background: rgba(255, 255, 255, .15);
    border-radius: 2px;
  }
  .hpbar i { display: block; height: 100%; border-radius: 2px; background: #6fcf6a; }
  .hpbar i.low { background: #e0a030; }
  .hpbar i.crit { background: #e05050; }

  #top {
    display: flex;
    justify-content: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
    padding: 4px 0 8px;
    letter-spacing: .02em;
  }
  #top .sep { color: var(--muted); font-weight: 400; }

  .unit.acting { box-shadow: 0 0 0 2px var(--enemy), 0 0 12px 3px rgba(163, 90, 216, .7); }
  #top.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { color: #f5c542; } 100% { color: var(--text); } }
  #btn-end { background: #2a1f24; border-color: #5a3440; }
  #phase-note { text-align: center; font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 6px; }
  .ghost {
    position: absolute;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: left .08s linear, top .08s linear;
  }
  .ghost .unit { width: 86%; height: 86%; }
  .dying { animation: dying .4s ease-in forwards; }
  @keyframes dying { to { opacity: 0; transform: scale(.7); filter: grayscale(1); } }
  .step-dot {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: dotfade .6s ease-out forwards;
  }
  .step-dot::before {
    content: "";
    width: 22%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--enemy);
    box-shadow: 0 0 6px var(--enemy);
  }
  @keyframes dotfade { from { opacity: .9; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .ghost { transition: none; }
    .float, .step-dot, .unit.fading, .dying, .unit.hit { animation-duration: .01s; }
  }
  .unit.acted { filter: grayscale(1) brightness(.55); }

  #panel { margin-top: 8px; min-height: 120px; }
  #info {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--panel);
    border: 1px solid #2c303c;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }
  #info .face { font-size: 30px; line-height: 1; }
  #info .name { font-size: 15px; font-weight: 700; }
  #info .guest { font-size: 11px; font-weight: 600; color: #111; background: var(--guest); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  #info .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  #info .stats { margin-top: 3px; }
  #info .stats b { font-weight: 600; }
  .btns { display: flex; gap: 6px; margin-top: 6px; }
  .btns button {
    flex: 1;
    min-height: 44px;
    border: 1px solid #3a3f4d;
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    touch-action: manipulation;
  }
  .btns button small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
  .btns button:disabled { opacity: .35; }
  .btns button:not(:disabled):active { background: #262a36; }

  /* 대사 장면: 맵이 비쳐 보이게 옅게 덮고, 아래에 초상화 + 말풍선 */
  #scene {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(4, 5, 8, .45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
  }
  #scene .card {
    width: 100%;
    max-width: 464px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: #f1ead8;
    color: #1d1a14;
    border: 2px solid #3b2d1c;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .6);
  }
  #scene .portrait {
    flex: none;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    line-height: 1;
    background: #2a2620;
    border-radius: 10px;
  }
  #scene .who { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
  #scene .line { font-size: 16px; line-height: 1.45; word-break: keep-all; }
  #scene .next { text-align: right; font-size: 11px; color: #7a6e58; margin-top: 6px; }

  .unit.fading { animation: fadeaway 1.6s ease-in forwards; }
  @keyframes fadeaway { to { opacity: 0; transform: translateY(-20%) scale(.9); filter: blur(2px); } }

  #result {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(4, 5, 8, .88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }
  #result .title { font-size: 22px; font-weight: 800; line-height: 1.4; word-break: keep-all; }
  #result .title.win { color: #f5c542; }
  #result .title.lose { color: #c9b6e8; }
  #result button {
    min-width: 160px;
    min-height: 48px;
    border-radius: 10px;
    border: 1px solid #5a3440;
    background: #2a1f24;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
  }

  /* ── 맵 에디터 ── */
  #editor-app { max-width: 480px; margin: 0 auto; padding: 8px; }
  .ed-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0 8px; }
  .ed-head h1 { font-size: 17px; margin: 0; }
  .ed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .ed-row input[type="text"] {
    flex: 1; min-width: 0; height: 36px; padding: 0 10px; border-radius: 8px;
    border: 1px solid #3a3f4d; background: var(--panel); color: var(--text); font: inherit;
  }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .small-btn {
    min-height: 36px; min-width: 36px; padding: 0 10px; border-radius: 8px;
    border: 1px solid #3a3f4d; background: var(--panel); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; touch-action: manipulation;
  }
  .small-btn:disabled { opacity: .35; }
  .small-btn:focus-visible, .btns button:focus-visible, .tool:focus-visible { outline: 2px solid #f5c542; outline-offset: 1px; }
  #ed-board {
    position: relative;
    margin: 0 auto;
    display: grid;
    gap: 2px;
    background: #07080b;
    padding: 2px;
    border-radius: 6px;
    touch-action: none; /* 끌어 칠하기 */
    max-width: 100%;
  }
  #ed-board .cell.warn { box-shadow: inset 0 0 0 2px #f5c542; }
  .tools { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .tool-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .tool-group > span { width: 34px; font-size: 11px; color: var(--muted); }
  .tool {
    width: 40px; height: 40px; border-radius: 8px; border: 2px solid #2c303c;
    background: var(--panel); color: var(--text); font-size: 20px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; touch-action: manipulation;
  }
  .tool.sw { font-size: 16px; }
  .tool.t-dirt { background: var(--dirt); }
  .tool.t-rock { background: var(--rock); }
  .tool.t-shrine { background: var(--shrine); }
  .tool.t-spring { background: var(--spring); }
  .tool.on { border-color: #f5c542; box-shadow: 0 0 0 1px #f5c542; }
  #ed-tool-name { font-size: 12px; color: var(--muted); min-height: 16px; }
  #ed-warns { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; }
  #ed-warns li { color: #f5c542; padding: 2px 0; }
  #ed-warns li.ok { color: #6fcf6a; }
  .ed-section { margin-top: 14px; border-top: 1px solid #2c303c; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .ed-section h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600; }
  #ed-code {
    width: 100%; min-height: 64px; resize: vertical; border-radius: 8px; padding: 8px;
    border: 1px solid #3a3f4d; background: #0a0c11; color: var(--text);
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all;
    user-select: text; -webkit-user-select: text;
  }
  #ed-msg { font-size: 12px; min-height: 16px; color: #6fcf6a; }
  #ed-msg.bad { color: #ff7a7a; }
  #ed-saved { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #ed-saved li { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #ed-saved li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ed-saved .empty { color: var(--muted); font-size: 12px; }
  #open-editor { display: block; margin: 14px auto 0; background: none; border: none; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; }

  #legend {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
  #legend span::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 4px;
    vertical-align: -1px;
    border-radius: 2px;
    background: var(--c);
  }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span id="top-turn"></span><span class="sep">·</span>
    <span id="top-weather"></span><span class="sep">·</span>
    <span id="top-merit"></span>
  </header>
  <div id="board"></div>
  <div id="legend">
    <span style="--c: var(--shrine)">서낭당 · 받는 피해 −20%</span>
    <span style="--c: var(--spring)">약수터 · 턴 시작 HP +10</span>
    <span style="--c: var(--rock)">초가집·바위 · 못 지나감</span>
  </div>
  <div id="panel">
    <div id="info" hidden></div>
    <div id="menu" class="btns" hidden>
      <button id="btn-attack">공격</button>
      <button id="btn-skill">스킬</button>
      <button id="btn-wait">대기</button>
      <button id="btn-cancel">취소</button>
    </div>
    <div class="btns"><button id="btn-end">턴 종료</button></div>
    <div id="phase-note"></div>
    <button id="open-editor" type="button">🛠 맵 에디터</button>
  </div>

  <!-- 대사·결과 화면은 게임 안에 둔다: 에디터로 가면 함께 숨는다 -->
  <div id="scene" hidden>
    <div class="card">
      <div class="portrait" id="scene-face"></div>
      <div style="flex: 1">
        <div class="who" id="scene-who"></div>
        <div class="line" id="scene-line"></div>
        <div class="next">▼ 눌러서 계속</div>
      </div>
    </div>
  </div>
  <div id="result" hidden>
    <div class="title" id="result-text"></div>
    <button id="btn-retry">다시하기</button>
  </div>
</div>

<div id="editor-app" hidden>
  <div class="ed-head">
    <h1>🛠 맵 에디터</h1>
    <button class="small-btn" id="ed-back" type="button">게임으로</button>
  </div>
  <div class="ed-row">
    <label for="ed-name">맵 이름</label>
    <input type="text" id="ed-name" maxlength="30">
  </div>
  <div class="ed-row">
    <span>행</span>
    <span class="stepper"><button class="small-btn" id="ed-rows-dec" type="button">−</button><b id="ed-rows"></b><button class="small-btn" id="ed-rows-inc" type="button">+</button></span>
    <span>열</span>
    <span class="stepper"><button class="small-btn" id="ed-cols-dec" type="button">−</button><b id="ed-cols"></b><button class="small-btn" id="ed-cols-inc" type="button">+</button></span>
  </div>
  <div id="ed-board"></div>
  <div class="tools" id="ed-tools"></div>
  <div id="ed-tool-name"></div>
  <ul id="ed-warns"></ul>
  <div class="ed-section">
    <h2>맵 코드</h2>
    <div class="ed-row">
      <button class="small-btn" id="ed-copy" type="button">코드 복사</button>
      <button class="small-btn" id="ed-paste" type="button">코드 붙여넣기</button>
      <button class="small-btn" id="ed-load" type="button" hidden>불러오기</button>
      <button class="small-btn" id="ed-paste-cancel" type="button" hidden>그만두기</button>
    </div>
    <textarea id="ed-code" readonly spellcheck="false" aria-label="맵 코드"></textarea>
    <div id="ed-msg" role="status"></div>
  </div>
  <div class="ed-section">
    <h2>이 브라우저에 저장</h2>
    <div class="ed-row">
      <button class="small-btn" id="ed-save" type="button">지금 맵 저장 (맵 이름으로)</button>
    </div>
    <ul id="ed-saved"></ul>
  </div>
</div>

<!-- 규칙: 화면(DOM)과 Math.random 을 쓰지 않는다. tests/ 가 Node 로 검사한다 (ADR 1번) -->
<script id="core">
var Core = (function () {
  'use strict';

  // ── 스테이지 (specs/battle.md 1·2장, ADR 2) ──────────
  // 한 전투 = 맵 크기·지형·유닛 배치. 맵 에디터의 "맵 코드"와 같은 모양이다.
  // 지형 글자: . 흙길  D 초가집·바위(통과 불가)  M 서낭당(받는 피해 ×0.8)  K 약수터(페이즈 시작 HP +10)
  // 아군은 배열 순서가 동률 판정 순서, 요괴는 배열 순서가 행동 순서다.
  var STAGES = {
    ch1: {
      v: 1,
      name: '1장 흑린 토벌',
      rows: 8,
      cols: 8,
      map: [
        '...MM...',
        '.D....D.',
        '.D....D.',
        '...K....',
        '.....D..',
        '.DD..D..',
        '........',
        '........'
      ],
      allies: [
        { id: 'yoon', r: 7, c: 2 },
        { id: 'hangyeol', r: 7, c: 3 },
        { id: 'yeoul', r: 7, c: 4 },
        { id: 'soun', r: 7, c: 5 },
        { id: 'dallae', r: 6, c: 3 }
      ],
      enemies: [
        { type: 'dokkaebi', r: 0, c: 1 },
        { type: 'dokkaebi', r: 0, c: 6 },
        { type: 'jangsan', r: 1, c: 3 },
        { type: 'jangsan', r: 1, c: 4 },
        { type: 'bulgasari', r: 2, c: 4 },
        { type: 'heuklin', r: 0, c: 3 }
      ]
    }
  };
  var TERRAINS = ['.', 'D', 'M', 'K'];

  function inBounds(state, r, c) {
    return r >= 0 && r < state.rows && c >= 0 && c < state.cols;
  }
  function terrainAt(state, r, c) {
    return inBounds(state, r, c) ? state.map[r].charAt(c) : null;
  }
  function isPassable(state, r, c) {
    var t = terrainAt(state, r, c);
    return t !== null && t !== 'D';
  }
  function isShrine(state, r, c) {
    return terrainAt(state, r, c) === 'M';
  }
  function isSpring(state, r, c) {
    return terrainAt(state, r, c) === 'K';
  }

  // ── 유닛 수치 (specs/battle.md 2장) ───────────────────
  // 수치는 기획자가 정한다. 위치는 스테이지가 정한다.
  var ALLY_DEFS = {
    yoon: { name: '윤무겸', faction: '벽사청', guest: false, title: '벽사청 종사관', emoji: '🗡️',
      hp: 30, atk: 12, def: 6, mov: 3, rng: 1, elem: '금', skill: '벽사검' },
    hangyeol: { name: '한결', faction: '벽사청', guest: false, title: '벽사청 궁수', emoji: '🏹',
      hp: 24, atk: 10, def: 4, mov: 3, rng: 2, elem: '목', skill: '파사궁' },
    yeoul: { name: '여울', faction: '청운 도문', guest: true, title: '축지의 도인', emoji: '🥷',
      hp: 34, atk: 11, def: 7, mov: 5, rng: 1, elem: '토', skill: '축지격' },
    soun: { name: '소운', faction: '청운 도문', guest: true, title: '청운 도문 도사', emoji: '🧙',
      hp: 22, atk: 11, def: 3, mov: 3, rng: 2, elem: '화', skill: '화염부' },
    dallae: { name: '달래', faction: '신당회', guest: true, title: '신당회 만신', emoji: '🔔',
      hp: 26, atk: 7, def: 5, mov: 4, rng: 1, elem: '없음', skill: '생명수' }
  };
  var ALLY_ORDER = ['yoon', 'hangyeol', 'yeoul', 'soun', 'dallae'];
  var ENEMY_TYPES = {
    dokkaebi: { name: '도깨비', emoji: '👹', hp: 22, atk: 10, def: 5, mov: 3, rng: 1, elem: '목' },
    jangsan: { name: '장산범', emoji: '🐅', hp: 22, atk: 10, def: 5, mov: 3, rng: 1, elem: '토' },
    bulgasari: { name: '불가사리', emoji: '🐗', hp: 22, atk: 10, def: 5, mov: 3, rng: 1, elem: '금' },
    heuklin: { name: '흑린', emoji: '🐍', hp: 50, atk: 13, def: 8, mov: 2, rng: 1, elem: '수', boss: true }
  };
  var ENEMY_ORDER = ['dokkaebi', 'jangsan', 'bulgasari', 'heuklin'];
  var KI_MAX = 10;
  var KI_START = 6;
  var SKILL_COST = 4;
  var HEAL_SKILL = '생명수';

  function makeUnit(d, id, side, r, c) {
    var ally = side === 'ally';
    return {
      id: id, name: d.name, side: side, emoji: d.emoji,
      faction: ally ? d.faction : '요괴 세력',
      guest: ally ? d.guest : false,
      title: ally ? d.title : (d.boss ? '요괴의 수장' : '—'),
      boss: !!d.boss,
      maxHp: d.hp, hp: d.hp, atk: d.atk, def: d.def, mov: d.mov, rng: d.rng, elem: d.elem,
      skill: ally ? d.skill : null,
      maxKi: ally ? KI_MAX : null, ki: ally ? KI_START : null,
      r: r, c: c, alive: true, acted: false,
      from: null // 이동했지만 아직 행동 전일 때 이동 전 위치 (취소용)
    };
  }

  // 요괴 id: 같은 종류가 여럿이면 종류+번호(dokkaebi1, dokkaebi2), 하나면 종류 그대로(heuklin)
  function enemyIds(enemies) {
    var total = {}, seen = {};
    enemies.forEach(function (e) { total[e.type] = (total[e.type] || 0) + 1; });
    return enemies.map(function (e) {
      seen[e.type] = (seen[e.type] || 0) + 1;
      return total[e.type] > 1 ? e.type + seen[e.type] : e.type;
    });
  }

  // 스테이지로 새 전투 상태를 만든다. 스테이지를 안 주면 1장.
  function newBattle(stage) {
    stage = stage || STAGES.ch1;
    var ids = enemyIds(stage.enemies);
    return {
      turn: 1, maxTurn: stage.maxTurn || 10, weather: '흐림', merit: 0, phase: 'ally', result: null,
      rows: stage.rows, cols: stage.cols, map: stage.map.slice(),
      units: stage.allies.map(function (a) { return makeUnit(ALLY_DEFS[a.id], a.id, 'ally', a.r, a.c); })
        .concat(stage.enemies.map(function (e, i) { return makeUnit(ENEMY_TYPES[e.type], ids[i], 'enemy', e.r, e.c); }))
    };
  }

  function getUnit(state, id) {
    for (var i = 0; i < state.units.length; i++) if (state.units[i].id === id) return state.units[i];
    return null;
  }
  function unitAt(state, r, c) {
    for (var i = 0; i < state.units.length; i++) {
      var u = state.units[i];
      if (u.alive && u.r === r && u.c === c) return u;
    }
    return null;
  }
  function livingUnits(state, side) {
    return state.units.filter(function (u) { return u.alive && u.side === side; });
  }

  // ── 이동 (specs/battle.md 8장) ────────────────────────
  var DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  // unit 위치에서 상하좌우로 퍼져 나가며 칸별 이동 칸 수를 잰다.
  // 초가집·바위와 다른 유닛이 있는 칸은 통과도 정지도 못 한다. limit 을 넘는 칸은 버린다.
  // 결과: { 'r,c': 칸 수 }
  function stepCosts(state, unit, limit) {
    var costs = {};
    costs[unit.r + ',' + unit.c] = 0;
    var queue = [[unit.r, unit.c]];
    while (queue.length) {
      var cur = queue.shift();
      var d = costs[cur[0] + ',' + cur[1]];
      if (d >= limit) continue;
      for (var i = 0; i < DIRS.length; i++) {
        var r = cur[0] + DIRS[i][0], c = cur[1] + DIRS[i][1], key = r + ',' + c;
        if (costs[key] !== undefined || !isPassable(state, r, c)) continue;
        var other = unitAt(state, r, c);
        if (other && other !== unit) continue;
        costs[key] = d + 1;
        queue.push([r, c]);
      }
    }
    return costs;
  }

  // unit 위치에서 (r, c) 까지 실제로 걷는 길. 출발 칸과 도착 칸을 포함한다. 못 가면 null.
  // 같은 거리의 길이 여럿이면 위 → 아래 → 왼쪽 → 오른쪽 순서로 먼저 찾은 길.
  function pathTo(state, unit, r, c) {
    var start = unit.r + ',' + unit.c, goal = r + ',' + c;
    var prev = {};
    prev[start] = null;
    var queue = [[unit.r, unit.c]];
    while (queue.length && prev[goal] === undefined) {
      var cur = queue.shift();
      for (var i = 0; i < DIRS.length; i++) {
        var nr = cur[0] + DIRS[i][0], nc = cur[1] + DIRS[i][1], key = nr + ',' + nc;
        if (prev[key] !== undefined || !isPassable(state, nr, nc)) continue;
        var other = unitAt(state, nr, nc);
        if (other && other !== unit) continue;
        prev[key] = cur[0] + ',' + cur[1];
        queue.push([nr, nc]);
      }
    }
    if (prev[goal] === undefined) return null;
    var path = [];
    for (var k = goal; k !== null; k = prev[k]) {
      var p = k.split(',');
      path.unshift({ r: +p[0], c: +p[1] });
    }
    return path;
  }

  // 이동할 수 있는 칸 (제자리 포함). 행 → 열 순서로 정렬한다.
  function moveTargets(state, unit) {
    var costs = stepCosts(state, unit, unit.mov);
    return Object.keys(costs).map(function (key) {
      var p = key.split(',');
      return { r: +p[0], c: +p[1], cost: costs[key] };
    }).sort(function (a, b) { return a.r - b.r || a.c - b.c; });
  }

  // ── 거리와 대상 (specs/battle.md 4·8장) ───────────────
  var HEAL_RANGE = 2;

  function distance(a, b) {
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
  }

  // pos 를 주면 그 칸에 서 있다고 보고 잰다 (이동 전 미리 보기용). 없으면 지금 위치.
  function attackTargets(state, unit, pos) {
    var from = pos || unit;
    return state.units.filter(function (t) {
      if (!t.alive || t.side === unit.side) return false;
      var d = distance(from, t);
      return d >= 1 && d <= unit.rng;
    });
  }

  // 생명수: 거리 2 안의 아군(자기 포함). 그 외 스킬: 기본공격과 같은 대상.
  function skillTargets(state, unit, pos) {
    if (unit.skill !== HEAL_SKILL) return attackTargets(state, unit, pos);
    var from = pos || unit;
    return state.units.filter(function (t) {
      return t.alive && t.side === unit.side && distance(from, t) <= HEAL_RANGE;
    });
  }

  // ── 오행 상성 (specs/battle.md 5장) ───────────────────
  // 금 > 목 > 토 > 수 > 화 > 금 : 각 속성이 이기는 상대
  var BEATS = { '금': '목', '목': '토', '토': '수', '수': '화', '화': '금' };
  var ADVANTAGE = 1.5;
  var DISADVANTAGE = 0.7;

  function elementMultiplier(skillElem, targetElem) {
    if (BEATS[skillElem] === targetElem) return ADVANTAGE;
    if (BEATS[targetElem] === skillElem) return DISADVANTAGE;
    return 1;
  }

  // ── 날씨와 피해 (specs/battle.md 6·7장) ───────────────
  var WEATHERS = ['맑음', '강풍', '비', '흐림'];
  var SHRINE_FACTOR = 0.8;

  function weatherMultiplier(weather, elem) {
    if (weather === '맑음' && elem === '화') return 1.3;
    if (weather === '강풍' && elem === '목') return 1.3;
    if (weather === '비' && elem === '화') return 0.7;
    return 1;
  }

  // 기본공격 = max(1, 공격 − 방어). 상성·날씨 없음.
  // 스킬     = max(1, 공격×1.5 − 방어) × 상성 × 날씨.
  // 대상이 서낭당이면 마지막에 ×0.8. 반올림은 맨 끝에 한 번 (0.5 이상 올림).
  function damage(state, attacker, target, useSkill) {
    var v;
    if (useSkill) {
      v = Math.max(1, attacker.atk * 1.5 - target.def)
        * elementMultiplier(attacker.elem, target.elem)
        * weatherMultiplier(state.weather, attacker.elem);
    } else {
      v = Math.max(1, attacker.atk - target.def);
    }
    if (isShrine(state, target.r, target.c)) v *= SHRINE_FACTOR;
    // 1e-9: 0.5 경계가 부동소수점 오차로 내림되는 것을 막는다
    return Math.max(1, Math.round(v + 1e-9));
  }

  // ── 아군 행동 (specs/battle.md 3·4·9장) ───────────────
  var HEAL_AMOUNT = 12;

  function canCommand(state, unit) {
    return !!unit && unit.alive && unit.side === 'ally' && !unit.acted
      && state.phase === 'ally' && state.result === null;
  }

  // 이동. 이동 전 위치를 unit.from 에 남겨 취소할 수 있게 한다. 성공하면 true.
  function moveUnit(state, id, r, c) {
    var u = getUnit(state, id);
    if (!canCommand(state, u) || u.from) return false;
    var ok = moveTargets(state, u).some(function (p) { return p.r === r && p.c === c; });
    if (!ok) return false;
    u.from = { r: u.r, c: u.c };
    u.r = r; u.c = c;
    return true;
  }

  // 취소: 이동 전 위치로 되돌린다. 행동 완료가 아니다.
  function cancelMove(state, id) {
    var u = getUnit(state, id);
    if (!canCommand(state, u) || !u.from) return false;
    u.r = u.from.r; u.c = u.from.c;
    u.from = null;
    return true;
  }

  function finishAction(u) {
    u.acted = true;
    u.from = null;
  }

  function canAttack(state, unit) {
    return attackTargets(state, unit).length > 0;
  }
  function canSkill(state, unit) {
    return unit.ki !== null && unit.ki >= SKILL_COST && skillTargets(state, unit).length > 0;
  }

  // 피해를 입히고 이벤트 목록에 남긴다. HP 는 0 밑으로 내려가지 않는다.
  function hit(state, attacker, target, useSkill, events) {
    var amount = damage(state, attacker, target, useSkill);
    target.hp = Math.max(0, target.hp - amount);
    events.push({
      type: 'damage', attackerId: attacker.id, targetId: target.id, amount: amount,
      mult: useSkill ? elementMultiplier(attacker.elem, target.elem) : 1 // 상성 배율 (화면 연출용)
    });
    if (target.hp === 0) knockOut(state, attacker, target, events);
    return events;
  }

  // ── HP 0 처리와 공적 (specs/battle.md 11·12장) ────────
  var MERIT_NORMAL = 1;
  var MERIT_BOSS = 3;

  // 요괴는 사라지고, 아군은 퇴각해 사라진다. 벽사청 유닛의 마지막 일격만 공적이 된다.
  function knockOut(state, attacker, target, events) {
    target.alive = false;
    var merit = 0;
    if (target.side === 'enemy' && attacker.faction === '벽사청') {
      merit = target.boss ? MERIT_BOSS : MERIT_NORMAL;
      state.merit += merit;
    }
    events.push({
      type: target.side === 'enemy' ? 'defeat' : 'retreat',
      attackerId: attacker.id, targetId: target.id, merit: merit
    });
    updateResult(state, events);
  }

  // ── 승패 (specs/battle.md 13장) ───────────────────────
  // 흑린 격파 → 즉시 승리. 아군 전원 퇴각 → 즉시 패배. 끝나면 phase 는 'over'.
  function updateResult(state, events) {
    if (state.result !== null) return;
    var boss = state.units.filter(function (u) { return u.boss; })[0];
    if (!boss.alive) state.result = 'win';
    else if (livingUnits(state, 'ally').length === 0) state.result = 'lose';
    else return;
    state.phase = 'over';
    events.push({ type: 'result', result: state.result });
  }

  // 요괴 페이즈가 끝났을 때: 10턴이었으면 패배(흑린 승천), 아니면 다음 턴으로.
  function endEnemyPhase(state) {
    var events = [];
    if (state.result !== null) return events;
    if (state.turn >= state.maxTurn) {
      state.result = 'lose';
      state.phase = 'over';
      events.push({ type: 'result', result: 'lose' });
      return events;
    }
    state.turn += 1;
    state.phase = 'ally';
    return events;
  }

  function inList(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  // 결과: 이벤트 배열. 못 하는 행동이면 null.
  function attack(state, id, targetId) {
    var u = getUnit(state, id);
    if (!canCommand(state, u)) return null;
    var t = inList(attackTargets(state, u), targetId);
    if (!t) return null;
    var events = hit(state, u, t, false, []);
    finishAction(u);
    return events;
  }

  function useSkill(state, id, targetId) {
    var u = getUnit(state, id);
    if (!canCommand(state, u) || u.ki < SKILL_COST) return null;
    var t = inList(skillTargets(state, u), targetId);
    if (!t) return null;
    u.ki -= SKILL_COST;
    var events;
    if (u.skill === HEAL_SKILL) {
      var amount = Math.min(HEAL_AMOUNT, t.maxHp - t.hp);
      t.hp += amount;
      events = [{ type: 'heal', attackerId: u.id, targetId: t.id, amount: amount }];
    } else {
      events = hit(state, u, t, true, []);
    }
    finishAction(u);
    return events;
  }

  function wait(state, id) {
    var u = getUnit(state, id);
    if (!canCommand(state, u)) return null;
    finishAction(u);
    return [];
  }

  // ── 턴 진행 (specs/battle.md 3·6·9장) ─────────────────
  var WEATHER_TURNS = [4, 7, 10];
  var SPRING_HEAL = 10;

  // 약수터 위에 있는 side 유닛을 HP +10 (최대 HP 까지)
  function springHeal(state, side, events) {
    livingUnits(state, side).forEach(function (u) {
      if (!isSpring(state, u.r, u.c)) return;
      var amount = Math.min(SPRING_HEAL, u.maxHp - u.hp);
      u.hp += amount;
      events.push({ type: 'spring', targetId: u.id, amount: amount });
    });
  }

  // 아군 페이즈 시작. 1턴 포함 매 턴 부른다.
  // rng: 0 이상 1 미만을 돌려주는 함수. 날씨가 바뀌는 턴에만 한 번 부른다.
  function startAllyPhase(state, rng) {
    var events = [];
    if (WEATHER_TURNS.indexOf(state.turn) !== -1) {
      state.weather = WEATHERS[Math.floor(rng() * WEATHERS.length)];
      events.push({ type: 'weather', weather: state.weather });
    }
    springHeal(state, 'ally', events);
    livingUnits(state, 'ally').forEach(function (u) {
      if (state.turn >= 2) u.ki = Math.min(u.maxKi, u.ki + 1);
      u.acted = false;
      u.from = null;
    });
    state.phase = 'ally';
    return events;
  }

  function allActed(state) {
    return livingUnits(state, 'ally').every(function (u) { return u.acted; });
  }

  // [턴 종료] 또는 전원 행동 끝 → 요괴 페이즈 시작 (요괴 약수터 회복).
  // 이동만 하고 행동하지 않은 유닛은 그 자리에 머문다.
  function endAllyPhase(state) {
    var events = [];
    if (state.phase !== 'ally' || state.result !== null) return events;
    livingUnits(state, 'ally').forEach(function (u) { u.from = null; });
    state.phase = 'enemy';
    springHeal(state, 'enemy', events);
    return events;
  }

  // ── 요괴 AI (specs/battle.md 10장) ────────────────────
  // target 을 칠 수 있는 칸(거리 1~사거리)들에서 거꾸로 퍼져 나가며, 각 칸에서 그곳까지 몇 칸인지 잰다.
  // mover 자신의 칸은 비어 있다고 본다. 다른 유닛 칸은 지나갈 수 없다.
  function approachMap(state, mover, target) {
    var dist = {}, queue = [];
    function free(r, c) {
      if (!isPassable(state, r, c)) return false;
      var o = unitAt(state, r, c);
      return !o || o === mover;
    }
    for (var r = 0; r < state.rows; r++) {
      for (var c = 0; c < state.cols; c++) {
        var d = distance({ r: r, c: c }, target);
        if (d >= 1 && d <= mover.rng && free(r, c)) {
          dist[r + ',' + c] = 0;
          queue.push([r, c]);
        }
      }
    }
    while (queue.length) {
      var cur = queue.shift();
      var base = dist[cur[0] + ',' + cur[1]];
      for (var i = 0; i < DIRS.length; i++) {
        var nr = cur[0] + DIRS[i][0], nc = cur[1] + DIRS[i][1], key = nr + ',' + nc;
        if (dist[key] !== undefined || !free(nr, nc)) continue;
        dist[key] = base + 1;
        queue.push([nr, nc]);
      }
    }
    return dist;
  }

  function stepsFrom(map, p) {
    var v = map[p.r + ',' + p.c];
    return v === undefined ? Infinity : v;
  }

  // 칸 고르기 동률 규칙: 이동 칸 수가 적은 칸 → 행이 작은 칸 → 열이 작은 칸
  function byCell(a, b) {
    return a.cost - b.cost || a.r - b.r || a.c - b.c;
  }

  // 이동해서 칠 수 있는 아군마다 가장 좋은 공격 칸을 찾는다.
  // 결과: [{ target, cell }] (아군 표 순서)
  function attackPlans(state, e) {
    var cells = moveTargets(state, e);
    var plans = [];
    livingUnits(state, 'ally').forEach(function (t) {
      var ok = cells.filter(function (p) {
        var d = distance(p, t);
        return d >= 1 && d <= e.rng;
      }).sort(byCell);
      if (ok.length) plans.push({ target: t, cell: ok[0] });
    });
    return plans;
  }

  function relocate(state, e, cell, events) {
    if (cell.r === e.r && cell.c === e.c) return;
    events.push({ type: 'move', unitId: e.id, from: { r: e.r, c: e.c }, to: { r: cell.r, c: cell.c },
      path: pathTo(state, e, cell.r, cell.c) });
    e.r = cell.r; e.c = cell.c;
  }

  // 일반 요괴 한 마리의 행동.
  // 칠 수 있으면: HP 최저 → 이동 칸 수가 적은 쪽 → 아군 표 순서로 대상을 골라 이동 후 공격.
  // 없으면: 실제 이동 칸 수로 가장 가까운 아군(동률은 표 순서)에게 최대한 다가간다. 길이 없으면 제자리.
  function normalEnemyAct(state, e) {
    var events = [];
    var plans = attackPlans(state, e);
    if (plans.length) {
      plans.sort(function (a, b) {
        return a.target.hp - b.target.hp || a.cell.cost - b.cell.cost;
      }); // sort 는 안정 정렬이라 나머지 동률은 아군 표 순서가 유지된다
      relocate(state, e, plans[0].cell, events);
      return hit(state, e, plans[0].target, false, events);
    }
    var best = null;
    livingUnits(state, 'ally').forEach(function (t) {
      var map = approachMap(state, e, t);
      var d = stepsFrom(map, e);
      if (d !== Infinity && (!best || d < best.d)) best = { map: map, d: d };
    });
    if (!best) return events;
    var cells = moveTargets(state, e).sort(function (a, b) {
      return stepsFrom(best.map, a) - stepsFrom(best.map, b) || byCell(a, b);
    });
    relocate(state, e, cells[0], events);
    return events;
  }

  // 흑린: 움직이지 않는다. 인접한 아군 중 HP 최저(동률은 아군 표 순서)를 친다.
  function bossAct(state, e) {
    var targets = attackTargets(state, e).slice().sort(function (a, b) {
      return a.hp - b.hp || distance(e, a) - distance(e, b);
    });
    if (!targets.length) return [];
    return hit(state, e, targets[0], false, []);
  }

  // 요괴 한 마리 행동. 화면은 이것을 0.5초 간격으로 부른다.
  function enemyAct(state, id) {
    var e = getUnit(state, id);
    if (!e || !e.alive || e.side !== 'enemy' || state.phase !== 'enemy' || state.result !== null) return [];
    return e.boss ? bossAct(state, e) : normalEnemyAct(state, e);
  }

  // 이번 요괴 페이즈에 행동할 요괴 id (표 순서)
  function enemyOrder(state) {
    return livingUnits(state, 'enemy').map(function (u) { return u.id; });
  }

  // 요괴 페이즈 전체를 한 번에 돈다 (테스트·시뮬레이션용. 화면은 enemyOrder + enemyAct + endEnemyPhase 로 나눠 부른다).
  // 도중에 아군이 전원 퇴각하면 남은 요괴는 행동하지 않는다.
  function runEnemyPhase(state) {
    var events = [];
    enemyOrder(state).forEach(function (id) {
      if (state.result !== null) return;
      events = events.concat(enemyAct(state, id));
    });
    return events.concat(endEnemyPhase(state));
  }

  // ── 맵 에디터용: 스테이지 검사·코드·편집 (specs/editor.md) ──
  var ROWS_MIN = 6, ROWS_MAX = 12, COLS_MIN = 6, COLS_MAX = 10;

  // 받침 유무로 조사 고르기: josa('윤무겸', '이', '가') → '윤무겸이', josa('도깨비', '이', '가') → '도깨비가'
  function josa(word, withFinal, withoutFinal) {
    var code = word.charCodeAt(word.length - 1) - 0xAC00;
    var hasFinal = code >= 0 && code <= 11171 && code % 28 !== 0;
    return word + (hasFinal ? withFinal : withoutFinal);
  }

  // 문제 목록. level 'error' 는 불러오기 거부, 'warn' 은 경고만.
  function validateStage(st) {
    var out = [];
    function err(msg) { out.push({ level: 'error', msg: msg }); }
    function warn(msg, r, c) { out.push({ level: 'warn', msg: msg, r: r, c: c }); }
    if (!st || typeof st !== 'object') { err('맵 데이터가 아닙니다'); return out; }
    if (!(st.rows >= ROWS_MIN && st.rows <= ROWS_MAX)) err('행 수는 ' + ROWS_MIN + '~' + ROWS_MAX + ' 사이여야 합니다');
    if (!(st.cols >= COLS_MIN && st.cols <= COLS_MAX)) err('열 수는 ' + COLS_MIN + '~' + COLS_MAX + ' 사이여야 합니다');
    if (!Array.isArray(st.map) || st.map.length !== st.rows) err('지형 줄 수가 행 수와 다릅니다');
    if (!Array.isArray(st.allies) || !Array.isArray(st.enemies)) err('유닛 목록이 없습니다');
    if (out.length) return out;
    for (var r = 0; r < st.rows; r++) {
      var row = st.map[r];
      if (typeof row !== 'string' || row.length !== st.cols) { err((r + 1) + '번째 줄 길이가 열 수와 다릅니다'); continue; }
      for (var c = 0; c < row.length; c++) {
        if (TERRAINS.indexOf(row.charAt(c)) === -1) err('알 수 없는 지형 글자 "' + row.charAt(c) + '"');
      }
    }
    st.allies.forEach(function (a) { if (!ALLY_DEFS[a.id]) err('알 수 없는 아군 "' + a.id + '"'); });
    st.enemies.forEach(function (e) { if (!ENEMY_TYPES[e.type]) err('알 수 없는 요괴 "' + e.type + '"'); });
    if (out.length) return out;

    var seen = {}, allyCount = {}, bosses = 0;
    st.allies.map(function (a) { return { u: a, name: ALLY_DEFS[a.id].name }; })
      .concat(st.enemies.map(function (e) { return { u: e, name: ENEMY_TYPES[e.type].name }; }))
      .forEach(function (x) {
        var u = x.u, key = u.r + ',' + u.c;
        if (!(u.r >= 0 && u.r < st.rows && u.c >= 0 && u.c < st.cols)) { warn(josa(x.name, '이', '가') + ' 맵 밖에 있습니다', u.r, u.c); return; }
        if (st.map[u.r].charAt(u.c) === 'D') warn(josa(x.name, '이', '가') + ' 초가집·바위 위에 있습니다', u.r, u.c);
        if (seen[key]) warn(josa(x.name, '과', '와') + ' ' + josa(seen[key], '이', '가') + ' 같은 칸에 있습니다', u.r, u.c);
        seen[key] = x.name;
      });
    st.allies.forEach(function (a) {
      allyCount[a.id] = (allyCount[a.id] || 0) + 1;
      if (allyCount[a.id] === 2) warn(josa(ALLY_DEFS[a.id].name, '이', '가') + ' 두 번 배치되었습니다');
    });
    st.enemies.forEach(function (e) { if (ENEMY_TYPES[e.type].boss) bosses++; });
    if (bosses === 0) warn('흑린이 없으면 이길 수 없습니다');
    if (bosses > 1) warn('흑린은 한 마리만 둘 수 있습니다');
    if (st.allies.length === 0) warn('아군이 한 명도 없습니다');
    return out;
  }

  // 맵 코드 = 한 줄 JSON. 게임 안 스테이지 데이터와 같은 모양이다.
  function encodeStage(st) {
    return JSON.stringify({
      v: 1, name: st.name || '', rows: st.rows, cols: st.cols, map: st.map,
      allies: st.allies.map(function (a) { return { id: a.id, r: a.r, c: a.c }; }),
      enemies: st.enemies.map(function (e) { return { type: e.type, r: e.r, c: e.c }; })
    });
  }

  // 결과: { stage, problems } 또는 { error }. 'error' 수준 문제가 있으면 불러오지 않는다.
  function decodeStage(text) {
    var st;
    try {
      st = JSON.parse(String(text).trim());
    } catch (e) {
      return { error: '맵 코드를 읽을 수 없습니다: 형식이 잘못되었습니다' };
    }
    var problems = validateStage(st);
    var fatal = problems.filter(function (p) { return p.level === 'error'; });
    if (fatal.length) return { error: '맵 코드를 읽을 수 없습니다: ' + fatal[0].msg };
    return { stage: JSON.parse(encodeStage(st)), problems: problems };
  }

  function copyStage(st) {
    return JSON.parse(encodeStage(st));
  }

  // 아군은 정의표 순서, 요괴는 종류 순서 → 행 → 열 순서로 둔다 (1장 순서와 같아진다)
  function sortUnits(st) {
    st.allies.sort(function (a, b) { return ALLY_ORDER.indexOf(a.id) - ALLY_ORDER.indexOf(b.id); });
    st.enemies.sort(function (a, b) {
      return ENEMY_ORDER.indexOf(a.type) - ENEMY_ORDER.indexOf(b.type) || a.r - b.r || a.c - b.c;
    });
    return st;
  }

  function removeUnitAt(st, r, c) {
    var at = function (u) { return u.r === r && u.c === c; };
    var had = st.allies.some(at) || st.enemies.some(at);
    st.allies = st.allies.filter(function (u) { return !at(u); });
    st.enemies = st.enemies.filter(function (u) { return !at(u); });
    return had;
  }

  function setTerrain(st, r, c, t) {
    st.map[r] = st.map[r].slice(0, c) + t + st.map[r].slice(c + 1);
  }

  // 칸 하나를 칠한 새 스테이지를 돌려준다 (원본은 그대로).
  // tool: { kind: 'terrain', t } | { kind: 'ally', id } | { kind: 'enemy', type } | { kind: 'erase' }
  function paintStage(stage, tool, r, c) {
    var st = copyStage(stage);
    if (!(r >= 0 && r < st.rows && c >= 0 && c < st.cols)) return st;
    var rock = st.map[r].charAt(c) === 'D';
    if (tool.kind === 'terrain') {
      setTerrain(st, r, c, tool.t);
      if (tool.t === 'D') removeUnitAt(st, r, c);
    } else if (tool.kind === 'erase') {
      if (!removeUnitAt(st, r, c)) setTerrain(st, r, c, '.');
    } else if (rock) {
      return st; // 초가집·바위 위에는 유닛을 놓지 않는다
    } else if (tool.kind === 'ally') {
      removeUnitAt(st, r, c);
      st.allies = st.allies.filter(function (a) { return a.id !== tool.id; }); // 이미 있으면 옮긴다
      st.allies.push({ id: tool.id, r: r, c: c });
    } else if (tool.kind === 'enemy') {
      removeUnitAt(st, r, c);
      if (ENEMY_TYPES[tool.type].boss) {
        st.enemies = st.enemies.filter(function (e) { return !ENEMY_TYPES[e.type].boss; }); // 흑린은 한 마리
      }
      st.enemies.push({ type: tool.type, r: r, c: c });
    }
    return sortUnits(st);
  }

  // 크기 바꾸기: 늘어난 칸은 흙길, 밖으로 나간 유닛은 지운다. 범위를 넘는 값은 끝값으로 맞춘다.
  function resizeStage(stage, rows, cols) {
    var st = copyStage(stage);
    rows = Math.max(ROWS_MIN, Math.min(ROWS_MAX, rows));
    cols = Math.max(COLS_MIN, Math.min(COLS_MAX, cols));
    var map = [];
    for (var r = 0; r < rows; r++) {
      var row = (st.map[r] || '').slice(0, cols);
      while (row.length < cols) row += '.';
      map.push(row);
    }
    var inside = function (u) { return u.r < rows && u.c < cols; };
    st.rows = rows;
    st.cols = cols;
    st.map = map;
    st.allies = st.allies.filter(inside);
    st.enemies = st.enemies.filter(inside);
    return st;
  }

  return {
    STAGES: STAGES,
    TERRAINS: TERRAINS,
    ALLY_DEFS: ALLY_DEFS,
    ALLY_ORDER: ALLY_ORDER,
    ENEMY_TYPES: ENEMY_TYPES,
    ENEMY_ORDER: ENEMY_ORDER,
    inBounds: inBounds,
    terrainAt: terrainAt,
    isPassable: isPassable,
    isShrine: isShrine,
    isSpring: isSpring,
    KI_MAX: KI_MAX,
    KI_START: KI_START,
    SKILL_COST: SKILL_COST,
    HEAL_SKILL: HEAL_SKILL,
    newBattle: newBattle,
    getUnit: getUnit,
    unitAt: unitAt,
    livingUnits: livingUnits,
    stepCosts: stepCosts,
    pathTo: pathTo,
    moveTargets: moveTargets,
    distance: distance,
    attackTargets: attackTargets,
    skillTargets: skillTargets,
    elementMultiplier: elementMultiplier,
    WEATHERS: WEATHERS,
    weatherMultiplier: weatherMultiplier,
    damage: damage,
    canCommand: canCommand,
    moveUnit: moveUnit,
    cancelMove: cancelMove,
    canAttack: canAttack,
    canSkill: canSkill,
    attack: attack,
    useSkill: useSkill,
    wait: wait,
    endEnemyPhase: endEnemyPhase,
    startAllyPhase: startAllyPhase,
    allActed: allActed,
    endAllyPhase: endAllyPhase,
    approachMap: approachMap,
    attackPlans: attackPlans,
    normalEnemyAct: normalEnemyAct,
    enemyAct: enemyAct,
    enemyOrder: enemyOrder,
    runEnemyPhase: runEnemyPhase,
    ROWS_MIN: ROWS_MIN,
    ROWS_MAX: ROWS_MAX,
    COLS_MIN: COLS_MIN,
    COLS_MAX: COLS_MAX,
    validateStage: validateStage,
    encodeStage: encodeStage,
    decodeStage: decodeStage,
    paintStage: paintStage,
    resizeStage: resizeStage
  };
})();
</script>

<script id="ui">
(function () {
  'use strict';

  var TERRAIN_CLASS = { '.': 't-dirt', 'D': 't-rock', 'M': 't-shrine', 'K': 't-spring' };
  var TERRAIN_MARK = { 'D': '🛖', 'M': '🏮', 'K': '💧' };
  var WEATHER_ICON = { '맑음': '☀️', '강풍': '🌬️', '비': '🌧️', '흐림': '☁️' };
  var ENEMY_STEP_MS = 500; // 요괴 한 마리씩 행동하는 간격 (기획서 14장)

  // 대사 (specs/screens.md 6장). 문구는 기획자가 정한다 — 고치지 않는다
  var INTRO = [
    { who: '흑린', face: '🐍', text: '천 년을 기다렸다. 오늘 밤 이 마을을 삼키고 하늘로 오르리라.' },
    { who: '윤무겸', face: '🗡️', text: '벽사청의 명이다. 요괴는 벤다.' },
    { who: '소운', face: '🧙', text: '닭이 울기 전에 끝냅시다. 난 아침잠이 많아서.' },
    { who: '여울', face: '🥷', text: '관군과 한편이라니, 오늘 밤만이오.' },
    { who: '달래', face: '🔔', text: '베기 전에 저 원한부터 들어보시지요.' }
  ];
  var FADE_MS = 1600;
  var LOSE_TEXT = '날이 밝았다. 흑린이 용이 되어 승천했다.';

  // 승리 후 대사. 달래가 맵에 있으면 첫 줄 뒤 달래 유닛이 서서히 사라진다
  function victoryLines() {
    var lines = [{ who: '달래', face: '🔔', text: '원한이 풀렸네. 이제 편히 가시게.' }];
    if (Core.getUnit(state, 'dallae').alive) {
      lines.push({ pause: FADE_MS, run: function () { ui.dallaeGone = true; render(); } });
    }
    return lines.concat([
      { who: '윤무겸', face: '🗡️', text: '여의주는 어디 있소?' },
      { who: '한결', face: '🏹', text: '…달래님이 안 보입니다.' }
    ]);
  }

  var state = Core.newBattle();
  var board = document.getElementById('board');
  var cells = [];
  // 조작 상태. step: 'none' 선택 없음 / 'move' 파란 칸 고르는 중 / 'menu' 이동 후 행동 고르는 중
  var ui = { step: 'none', id: null, kind: null, busy: false, infoId: null, dallaeGone: false };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildBoard() {
    board.innerHTML = '';
    cells = [];
    board.style.gridTemplateColumns = 'repeat(' + state.cols + ', 1fr)';
    board.style.gridTemplateRows = 'repeat(' + state.rows + ', 1fr)';
    board.style.aspectRatio = state.cols + ' / ' + state.rows;
    for (var r = 0; r < state.rows; r++) {
      for (var c = 0; c < state.cols; c++) {
        var t = Core.terrainAt(state, r, c);
        var cell = el('div', 'cell ' + TERRAIN_CLASS[t]);
        cell.dataset.r = r;
        cell.dataset.c = c;
        if (TERRAIN_MARK[t]) cell.appendChild(el('span', 'mark', TERRAIN_MARK[t]));
        board.appendChild(cell);
        cells.push(cell);
      }
    }
  }

  function factionClass(u) {
    if (u.side === 'enemy') return 'f-enemy';
    return u.guest ? 'f-guest' : 'f-bs';
  }

  function unitTile(u) {
    var tile = el('div', 'unit ' + factionClass(u), u.emoji);
    tile.dataset.id = u.id;
    if (u.guest) tile.appendChild(el('span', 'badge', '객'));
    var bar = el('div', 'hpbar');
    var fill = el('i');
    var ratio = u.hp / u.maxHp;
    fill.style.width = Math.round(ratio * 100) + '%';
    if (ratio <= 0.25) fill.className = 'crit';
    else if (ratio <= 0.5) fill.className = 'low';
    bar.appendChild(fill);
    tile.appendChild(bar);
    return tile;
  }

  function cellAt(r, c) {
    return cells[r * state.cols + c];
  }

  function renderTop() {
    document.getElementById('top-turn').textContent = '턴 ' + state.turn + '/' + state.maxTurn;
    document.getElementById('top-weather').textContent = WEATHER_ICON[state.weather] + ' ' + state.weather;
    document.getElementById('top-merit').textContent = '공적 ' + state.merit;
  }

  function highlights() {
    var marks = {};
    if (ui.step === 'move') {
      Core.moveTargets(state, Core.getUnit(state, ui.id)).forEach(function (p) {
        marks[p.r + ',' + p.c] = 'hl-move';
      });
    }
    if (ui.step === 'target') {
      var u = Core.getUnit(state, ui.id);
      var cls = ui.kind === 'skill' && u.skill === Core.HEAL_SKILL ? 'hl-heal' : 'hl-attack';
      currentTargets().forEach(function (t) { marks[t.r + ',' + t.c] = cls; });
    }
    return marks;
  }

  function currentTargets() {
    var u = Core.getUnit(state, ui.id);
    return ui.kind === 'skill' ? Core.skillTargets(state, u) : Core.attackTargets(state, u);
  }

  // 공격 스킬 대상 위 "유리!"(×1.5) / "불리"(×0.7)
  function affinityTag(t) {
    var u = Core.getUnit(state, ui.id);
    if (ui.step !== 'target' || ui.kind !== 'skill' || u.skill === Core.HEAL_SKILL) return null;
    var m = Core.elementMultiplier(u.elem, t.elem);
    if (m > 1) return el('span', 'tag good', '유리!');
    if (m < 1) return el('span', 'tag bad', '불리');
    return null;
  }

  // 피해·회복 숫자를 칸 위에 띄웠다 사라지게 한다
  function showFloats(events) {
    events.forEach(function (e) {
      if (e.type !== 'damage' && e.type !== 'heal' && e.type !== 'spring') return;
      var t = Core.getUnit(state, e.targetId);
      var cell = cellAt(t.r, t.c);
      var f = el('div', 'float ' + (e.type === 'damage' ? 'dmg' : 'heal'), (e.type === 'damage' ? '-' : '+') + e.amount);
      if (e.type === 'damage' && e.mult > 1) {
        f.className += ' good';
        f.appendChild(el('small', '', '유리!'));
      } else if (e.type === 'damage' && e.mult < 1) {
        f.className += ' bad';
      }
      f.style.left = cell.offsetLeft + 'px';
      f.style.top = cell.offsetTop + 'px';
      f.style.width = cell.offsetWidth + 'px';
      board.appendChild(f);
      setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 950);
    });
  }

  function render() {
    renderTop();
    var marks = highlights();
    cells.forEach(function (cell) {
      var old = cell.querySelector('.unit');
      if (old) cell.removeChild(old);
      cell.className = cell.className.replace(/\s*\bhl(-\w+)?\b/g, '');
      var m = marks[cell.dataset.r + ',' + cell.dataset.c];
      if (m) cell.className += ' hl ' + m;
      var oldTag = cell.querySelector('.tag');
      if (oldTag) cell.removeChild(oldTag);
    });
    state.units.forEach(function (u) {
      if (!u.alive) return;
      var tile = unitTile(u);
      if (u.id === ui.id) tile.className += ' selected';
      if (u.side === 'ally' && u.acted) tile.className += ' acted';
      if (u.id === 'dallae' && ui.dallaeGone) tile.className += ' fading';
      cellAt(u.r, u.c).appendChild(tile);
      var tag = u.side !== 'ally' || ui.kind === 'skill' ? affinityTag(u) : null;
      if (tag && marksHas(marks, u)) cellAt(u.r, u.c).appendChild(tag);
    });
    renderInfo();
    renderMenu();
    renderPhase();
  }

  // 정보창: 이름 / 소속 / 칭호 / HP / 기력 / 속성
  function renderInfo() {
    var box = document.getElementById('info');
    var u = ui.infoId && Core.getUnit(state, ui.infoId);
    box.hidden = !u || !u.alive;
    if (box.hidden) return;
    box.innerHTML = '';
    box.appendChild(el('div', 'face', u.emoji));
    var text = el('div');
    var name = el('div', 'name', u.name);
    if (u.guest) name.appendChild(el('span', 'guest', '객장'));
    text.appendChild(name);
    text.appendChild(el('div', 'sub', u.faction + ' · ' + u.title));
    text.appendChild(el('div', 'stats',
      'HP ' + u.hp + '/' + u.maxHp +
      ' · 기력 ' + (u.ki === null ? '—' : u.ki + '/' + u.maxKi) +
      ' · 속성 ' + u.elem));
    box.appendChild(text);
  }

  function renderPhase() {
    var canEnd = state.phase === 'ally' && !ui.busy && state.result === null;
    document.getElementById('btn-end').disabled = !canEnd;
    document.getElementById('phase-note').textContent =
      state.phase === 'enemy' ? '요괴의 차례…' : (canEnd ? '아군 차례 — 유닛을 눌러 움직이세요' : '');
  }

  function renderMenu() {
    var menu = document.getElementById('menu');
    menu.hidden = ui.step !== 'menu';
    if (menu.hidden) return;
    var u = Core.getUnit(state, ui.id);
    document.getElementById('btn-attack').disabled = !Core.canAttack(state, u);
    var skill = document.getElementById('btn-skill');
    skill.disabled = !Core.canSkill(state, u);
    skill.innerHTML = '';
    skill.appendChild(document.createTextNode(u.skill));
    skill.appendChild(el('small', '', '기력 ' + Core.SKILL_COST + ' (' + u.ki + '/' + u.maxKi + ')'));
  }

  function marksHas(marks, u) {
    return !!marks[u.r + ',' + u.c];
  }

  function selectable(u) {
    return !!u && Core.canCommand(state, u) && !u.from;
  }

  function clearSelection() {
    ui.step = 'none';
    ui.id = null;
    ui.kind = null;
  }

  // 맵 칸을 눌렀을 때. 터치와 클릭 모두 click 이벤트로 온다.
  function onCell(r, c) {
    if (ui.busy || state.phase !== 'ally') return;
    var u = Core.unitAt(state, r, c);
    if (u) ui.infoId = u.id;
    if (ui.step === 'move') {
      var isBlue = Core.moveTargets(state, Core.getUnit(state, ui.id))
        .some(function (p) { return p.r === r && p.c === c; });
      if (isBlue) {
        var mover = ui.id;
        var path = Core.pathTo(state, Core.getUnit(state, mover), r, c);
        Core.moveUnit(state, mover, r, c);
        ui.step = 'menu';
        ui.infoId = mover;
        ui.busy = true; // 미끄러지는 동안 입력 잠금
        slide(mover, path, function () {
          ui.busy = false;
          render();
        });
        return;
      } else if (selectable(u)) {
        ui.id = u.id;
      } else if (!u) {
        clearSelection(); // 빈 칸: 선택 해제. 다른 유닛: 정보만 보고 선택은 유지
        ui.infoId = null;
      }
    } else if (ui.step === 'target') {
      var target = u && currentTargets().indexOf(u) !== -1 ? u : null;
      if (!target) {
        ui.step = 'menu'; // 대상 밖을 누르면 메뉴로 돌아간다
      } else {
        var events = ui.kind === 'skill' ? Core.useSkill(state, ui.id, target.id) : Core.attack(state, ui.id, target.id);
        afterAction(events);
        return;
      }
    } else if (ui.step === 'none') {
      if (selectable(u)) {
        ui.step = 'move';
        ui.id = u.id;
      } else if (!u) {
        ui.infoId = null;
      }
    }
    render();
  }

  // 행동이 끝난 뒤 공통 처리: 승리면 끝, 전원 행동했으면 잠시 뒤 자동으로 턴 종료
  function afterAction(events) {
    clearSelection();
    ghostDeaths(events || []);
    render();
    showFloats(events || []);
    flashHits(events || []);
    if (state.result !== null) return finish();
    if (Core.allActed(state)) {
      ui.busy = true;
      render();
      setTimeout(endTurn, ENEMY_STEP_MS);
    }
  }

  // 쓰러진 유닛은 render() 가 지우기 전에 복제해 두고 0.4초 동안 흐려지게 한다
  function ghostDeaths(events) {
    events.forEach(function (e) {
      if (e.type !== 'defeat' && e.type !== 'retreat') return;
      var t = Core.getUnit(state, e.targetId);
      var tile = board.querySelector('.unit[data-id="' + e.targetId + '"]');
      if (!tile) return;
      var ghost = el('div', 'ghost dying');
      ghost.appendChild(tile.cloneNode(true));
      placeOver(ghost, t.r, t.c);
      board.appendChild(ghost);
      setTimeout(function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 450);
    });
  }

  // 맞은 유닛 번쩍·흔들림. render() 뒤에 붙인다 (render 가 타일을 새로 만들기 때문)
  function flashHits(events) {
    events.forEach(function (e) {
      if (e.type !== 'damage') return;
      var tile = board.querySelector('.unit[data-id="' + e.targetId + '"]');
      if (tile) tile.classList.add('hit');
    });
  }

  function showEvents(events) {
    ghostDeaths(events);
    render();
    showFloats(events);
    flashHits(events);
    if (events.some(function (e) { return e.type === 'weather'; })) {
      var top = document.getElementById('top');
      top.classList.remove('flash');
      void top.offsetWidth; // 애니메이션 다시 시작
      top.classList.add('flash');
    }
  }

  var SLIDE_MS = 80; // 칸당 이동 시간 (specs/effects.md 2장)
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function placeOver(elm, r, c) {
    var cell = cellAt(r, c);
    elm.style.left = cell.offsetLeft + 'px';
    elm.style.top = cell.offsetTop + 'px';
    elm.style.width = cell.offsetWidth + 'px';
    elm.style.height = cell.offsetHeight + 'px';
  }

  // 유닛 타일을 path 를 따라 한 칸씩 옮기는 연출. 화면(DOM)은 아직 이동 전 모습이어야 한다.
  // 끝나면 done. 동작 줄이기 설정이거나 제자리면 바로 done.
  function slide(unitId, path, done) {
    var tile = board.querySelector('.unit[data-id="' + unitId + '"]');
    if (!tile || !path || path.length < 2 || reduceMotion) return done();
    var ghost = el('div', 'ghost');
    ghost.appendChild(tile.cloneNode(true));
    placeOver(ghost, path[0].r, path[0].c);
    board.appendChild(ghost);
    tile.style.visibility = 'hidden';
    var i = 1;
    function step() {
      if (i >= path.length) {
        setTimeout(function () { board.removeChild(ghost); done(); }, SLIDE_MS);
        return;
      }
      placeOver(ghost, path[i].r, path[i].c);
      i++;
      setTimeout(step, SLIDE_MS);
    }
    requestAnimationFrame(step);
  }

  // 요괴가 지나간 칸에 보라 점을 잠깐 남긴다 (도착 칸 제외)
  function footprints(path) {
    if (!path) return;
    path.slice(0, -1).forEach(function (p) {
      var dot = el('div', 'step-dot');
      placeOver(dot, p.r, p.c);
      board.appendChild(dot);
      setTimeout(function () { if (dot.parentNode) dot.parentNode.removeChild(dot); }, 650);
    });
  }

  function markActing(id) {
    var tile = board.querySelector('.unit[data-id="' + id + '"]');
    if (tile) tile.classList.add('acting');
  }

  // 아군 페이즈 끝 → 요괴가 0.5초 간격으로 하나씩 → 다음 턴 아군 페이즈 (그동안 입력 잠금)
  function endTurn() {
    if (state.phase !== 'ally' || state.result !== null) return;
    clearSelection();
    ui.busy = true;
    showEvents(Core.endAllyPhase(state));
    var order = Core.enemyOrder(state);
    var i = 0;
    function next() {
      if (state.result !== null) return finish();
      if (i >= order.length) {
        var end = Core.endEnemyPhase(state);
        if (state.result !== null) { render(); return finish(); }
        ui.busy = false;
        showEvents(end.concat(Core.startAllyPhase(state, Math.random)));
        return;
      }
      var id = order[i++];
      var events = Core.enemyAct(state, id);
      var move = events.filter(function (e) { return e.type === 'move'; })[0];
      slide(id, move && move.path, function () {
        showEvents(events);
        if (move) footprints(move.path);
        if (events.length) markActing(id);
        setTimeout(next, events.length ? ENEMY_STEP_MS : 0);
      });
    }
    setTimeout(next, ENEMY_STEP_MS);
  }

  // 대사를 한 줄씩 보여 주고, 다 넘기면 done 을 부른다. 그동안 맵 입력은 잠근다.
  // 줄 대신 { pause: 밀리초, run: 함수 } 를 넣으면 연출을 돌리고 그 시간 동안 기다린다.
  function playScene(lines, done) {
    var scene = document.getElementById('scene');
    var i = 0;
    ui.busy = true;
    render();
    function show() {
      if (i >= lines.length) {
        scene.hidden = true;
        scene.onclick = null;
        return done();
      }
      var line = lines[i++];
      if (line.pause) {
        scene.hidden = true;
        scene.onclick = null;
        line.run();
        return setTimeout(show, line.pause);
      }
      document.getElementById('scene-face').textContent = line.face;
      document.getElementById('scene-who').textContent = line.who;
      document.getElementById('scene-line').textContent = line.text;
      scene.hidden = false;
      scene.onclick = show;
    }
    show();
  }

  function startBattle() {
    playScene(INTRO, function () {
      ui.busy = false;
      render();
    });
  }

  // 전투 끝: 승리면 승리 후 대사 → 승리 화면, 패배면 바로 패배 화면
  function finish() {
    ui.busy = true;
    clearSelection();
    render();
    if (state.result === 'win') {
      setTimeout(function () { playScene(victoryLines(), showResult); }, 900); // 마지막 피해 숫자를 본 뒤
    } else {
      setTimeout(showResult, 900);
    }
  }

  function showResult() {
    var t = document.getElementById('result-text');
    var win = state.result === 'win';
    t.className = 'title ' + (win ? 'win' : 'lose');
    t.textContent = win ? '1장 흑린 토벌 완료 · 공적 ' + state.merit + ' / 8' : LOSE_TEXT;
    document.getElementById('result').hidden = false;
  }

  // 다시하기: 새 전투 상태로 시작 대사부터
  function restart() {
    document.getElementById('result').hidden = true;
    state = Core.newBattle();
    ui = { step: 'none', id: null, kind: null, busy: false, infoId: null, dallaeGone: false };
    Core.startAllyPhase(state, Math.random);
    render();
    startBattle();
  }

  document.getElementById('btn-retry').addEventListener('click', restart);

  document.getElementById('btn-end').addEventListener('click', function () {
    if (ui.busy) return;
    endTurn();
  });

  document.getElementById('btn-wait').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    Core.wait(state, ui.id);
    afterAction();
  });
  document.getElementById('btn-cancel').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    Core.cancelMove(state, ui.id);
    clearSelection();
    render();
  });
  document.getElementById('btn-attack').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    ui.step = 'target';
    ui.kind = 'attack';
    render();
  });
  document.getElementById('btn-skill').addEventListener('click', function () {
    if (ui.step !== 'menu') return;
    ui.step = 'target';
    ui.kind = 'skill';
    render();
  });

  board.addEventListener('click', function (ev) {
    var cell = ev.target.closest('.cell');
    if (cell) onCell(+cell.dataset.r, +cell.dataset.c);
  });

  buildBoard();
  Core.startAllyPhase(state, Math.random);
  render();
  startBattle();
})();
</script>

<!-- 맵 에디터 화면 (specs/editor.md). 편집 규칙은 Core.paintStage 등 core 가 맡는다 -->
<script id="editor">
(function () {
  'use strict';

  var TERRAIN_CLASS = { '.': 't-dirt', 'D': 't-rock', 'M': 't-shrine', 'K': 't-spring' };
  var TERRAIN_MARK = { 'D': '🛖', 'M': '🏮', 'K': '💧' };

  var stage = JSON.parse(Core.encodeStage(Core.STAGES.ch1)); // 1장 맵으로 시작
  var app = document.getElementById('editor-app');
  var game = document.getElementById('app');
  var board = document.getElementById('ed-board');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function unitAt(r, c) {
    var all = stage.allies.map(function (a) { return { u: a, side: 'ally' }; })
      .concat(stage.enemies.map(function (e) { return { u: e, side: 'enemy' }; }));
    for (var i = 0; i < all.length; i++) if (all[i].u.r === r && all[i].u.c === c) return all[i];
    return null;
  }

  function unitTile(x) {
    var d = x.side === 'ally' ? Core.ALLY_DEFS[x.u.id] : Core.ENEMY_TYPES[x.u.type];
    var cls = x.side === 'enemy' ? 'f-enemy' : (d.guest ? 'f-guest' : 'f-bs');
    var tile = el('div', 'unit ' + cls, d.emoji);
    if (d.guest) tile.appendChild(el('span', 'badge', '객'));
    return tile;
  }

  // 맵 폭: 화면 폭과 높이(58vh) 중 작은 쪽에 맞추되, 칸 모양은 정사각형을 유지한다
  function sizeBoard() {
    var byHeight = window.innerHeight * 0.58 * stage.cols / stage.rows;
    var w = Math.min(window.innerWidth - 16, byHeight, 464);
    board.style.width = w + 'px';
    board.style.height = (w * stage.rows / stage.cols) + 'px';
    board.style.gridTemplateColumns = 'repeat(' + stage.cols + ', 1fr)';
    board.style.gridTemplateRows = 'repeat(' + stage.rows + ', 1fr)';
  }

  function render() {
    document.getElementById('ed-name').value = stage.name || '';
    document.getElementById('ed-rows').textContent = stage.rows;
    document.getElementById('ed-cols').textContent = stage.cols;
    document.getElementById('ed-rows-dec').disabled = stage.rows <= Core.ROWS_MIN;
    document.getElementById('ed-rows-inc').disabled = stage.rows >= Core.ROWS_MAX;
    document.getElementById('ed-cols-dec').disabled = stage.cols <= Core.COLS_MIN;
    document.getElementById('ed-cols-inc').disabled = stage.cols >= Core.COLS_MAX;
    sizeBoard();
    board.innerHTML = '';
    for (var r = 0; r < stage.rows; r++) {
      for (var c = 0; c < stage.cols; c++) {
        var t = stage.map[r].charAt(c);
        var cell = el('div', 'cell ' + TERRAIN_CLASS[t]);
        cell.dataset.r = r;
        cell.dataset.c = c;
        if (TERRAIN_MARK[t]) cell.appendChild(el('span', 'mark', TERRAIN_MARK[t]));
        var x = unitAt(r, c);
        if (x) cell.appendChild(unitTile(x));
        board.appendChild(cell);
      }
    }
    var problems = Core.validateStage(stage);
    problems.forEach(function (p) {
      var cell = p.r !== undefined && board.querySelector('.cell[data-r="' + p.r + '"][data-c="' + p.c + '"]');
      if (cell) cell.classList.add('warn');
    });
    renderWarnings(problems);
    if (!pasting) document.getElementById('ed-code').value = Core.encodeStage(stage);
  }

  // ── 브라우저 저장 (이 기기·이 브라우저에만 남는다) ──
  var STORE_KEY = 'joseon-exorcist.maps';
  var NO_STORE = '이 브라우저에는 저장할 수 없습니다. 코드 복사를 쓰세요.';

  function readSaved() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {};
    } catch (e) {
      return null; // 저장소를 쓸 수 없음
    }
  }
  function writeSaved(all) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(all));
      return true;
    } catch (e) {
      return false;
    }
  }

  var armedDelete = null; // 삭제는 두 번 눌러야 한다 (확인 창을 쓸 수 없는 환경 대비)
  function renderSaved() {
    var list = document.getElementById('ed-saved');
    list.innerHTML = '';
    var all = readSaved();
    if (all === null) return list.appendChild(el('li', 'empty', NO_STORE));
    var names = Object.keys(all).sort();
    if (!names.length) return list.appendChild(el('li', 'empty', '저장한 맵이 없습니다.'));
    names.forEach(function (name) {
      var li = el('li');
      li.appendChild(el('span', '', name));
      var load = el('button', 'small-btn', '불러오기');
      load.type = 'button';
      load.addEventListener('click', function () {
        var result = Core.decodeStage(all[name]);
        if (result.error) return say(result.error, true);
        stage = result.stage;
        setPasting(false);
        render();
        say('불러왔습니다: ' + name);
      });
      var del = el('button', 'small-btn', armedDelete === name ? '정말 삭제' : '삭제');
      del.type = 'button';
      del.addEventListener('click', function () {
        if (armedDelete !== name) {
          armedDelete = name;
          renderSaved();
          setTimeout(function () { if (armedDelete === name) { armedDelete = null; renderSaved(); } }, 3000);
          return;
        }
        armedDelete = null;
        var now = readSaved() || {};
        delete now[name];
        if (!writeSaved(now)) return say(NO_STORE, true);
        renderSaved();
        say('삭제했습니다: ' + name);
      });
      li.appendChild(load);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  document.getElementById('ed-save').addEventListener('click', function () {
    var name = (stage.name || '').trim();
    if (!name) return say('맵 이름을 적어 주세요.', true);
    var all = readSaved();
    if (all === null) return say(NO_STORE, true);
    var existed = Object.prototype.hasOwnProperty.call(all, name);
    all[name] = Core.encodeStage(stage);
    if (!writeSaved(all)) return say(NO_STORE, true);
    renderSaved();
    say((existed ? '덮어써서 저장했습니다: ' : '저장했습니다: ') + name);
  });

  // ── 맵 코드 복사·붙여넣기 ──
  var pasting = false;
  var codeBox = document.getElementById('ed-code');

  function say(text, bad) {
    var m = document.getElementById('ed-msg');
    m.textContent = text;
    m.className = bad ? 'bad' : '';
  }

  function setPasting(on) {
    pasting = on;
    codeBox.readOnly = !on;
    document.getElementById('ed-load').hidden = !on;
    document.getElementById('ed-paste-cancel').hidden = !on;
    document.getElementById('ed-copy').hidden = on;
    document.getElementById('ed-paste').hidden = on;
    if (on) {
      codeBox.value = '';
      codeBox.placeholder = '받은 맵 코드를 여기에 붙여 넣으세요';
      codeBox.focus();
    } else {
      codeBox.placeholder = '';
      codeBox.value = Core.encodeStage(stage);
    }
  }

  function selectCode() {
    codeBox.focus();
    codeBox.select();
    codeBox.setSelectionRange(0, codeBox.value.length);
  }

  document.getElementById('ed-copy').addEventListener('click', function () {
    codeBox.value = Core.encodeStage(stage);
    var fallback = function () {
      selectCode();
      say('자동 복사가 막혀 있어 코드를 선택해 두었습니다. 길게 눌러(또는 Ctrl+C) 복사하세요.', true);
    };
    if (!navigator.clipboard || !navigator.clipboard.writeText) return fallback();
    navigator.clipboard.writeText(codeBox.value).then(function () {
      say('맵 코드를 복사했습니다.');
    }, fallback);
  });
  document.getElementById('ed-paste').addEventListener('click', function () {
    say('');
    setPasting(true);
  });
  document.getElementById('ed-paste-cancel').addEventListener('click', function () {
    say('');
    setPasting(false);
  });
  document.getElementById('ed-load').addEventListener('click', function () {
    var result = Core.decodeStage(codeBox.value);
    if (result.error) return say(result.error, true); // 지금 맵은 그대로
    stage = result.stage;
    setPasting(false);
    render();
    say('불러왔습니다: ' + (stage.name || '이름 없는 맵'));
  });

  // 도구 줄: 지형 4 · 아군 5 · 요괴 4 · 지우개
  var TOOL_GROUPS = [
    { label: '지형', tools: [
      { kind: 'terrain', t: '.', name: '흙길', cls: 't-dirt' },
      { kind: 'terrain', t: 'D', name: '초가집·바위', cls: 't-rock', mark: '🛖' },
      { kind: 'terrain', t: 'M', name: '서낭당', cls: 't-shrine', mark: '🏮' },
      { kind: 'terrain', t: 'K', name: '약수터', cls: 't-spring', mark: '💧' }
    ] },
    { label: '아군', tools: Core.ALLY_ORDER.map(function (id) {
      return { kind: 'ally', id: id, name: Core.ALLY_DEFS[id].name, mark: Core.ALLY_DEFS[id].emoji };
    }) },
    { label: '요괴', tools: Core.ENEMY_ORDER.map(function (type) {
      return { kind: 'enemy', type: type, name: Core.ENEMY_TYPES[type].name, mark: Core.ENEMY_TYPES[type].emoji };
    }) },
    { label: '기타', tools: [{ kind: 'erase', name: '지우개 (유닛 → 지형 순서로 지움)', mark: '🧽' }] }
  ];
  var tool = TOOL_GROUPS[0].tools[1]; // 처음엔 초가집·바위

  function buildTools() {
    var box = document.getElementById('ed-tools');
    box.innerHTML = '';
    TOOL_GROUPS.forEach(function (g) {
      var row = el('div', 'tool-group');
      row.appendChild(el('span', '', g.label));
      g.tools.forEach(function (t) {
        var b = el('button', 'tool' + (t.cls ? ' sw ' + t.cls : ''), t.mark || '');
        b.type = 'button';
        b.title = t.name;
        b.setAttribute('aria-label', t.name);
        if (t === tool) b.className += ' on';
        b.addEventListener('click', function () { tool = t; buildTools(); });
        row.appendChild(b);
      });
      box.appendChild(row);
    });
    document.getElementById('ed-tool-name').textContent = '선택: ' + tool.name;
  }

  // 경고 (core 의 validateStage). 문제가 있어도 저장·복사는 된다
  function renderWarnings(problems) {
    var list = document.getElementById('ed-warns');
    list.innerHTML = '';
    if (!problems.length) list.appendChild(el('li', 'ok', '✓ 문제없음 — 이 맵으로 전투를 만들 수 있습니다'));
    problems.forEach(function (p) {
      list.appendChild(el('li', '', '⚠ ' + p.msg + (p.r !== undefined ? ' (' + (p.r + 1) + '행 ' + (p.c + 1) + '열)' : '')));
    });
  }

  // 칠하기: 누른 칸을 칠하고, 지형 도구면 끌고 가는 칸도 칠한다
  var dragging = false, lastKey = null;
  function paintAt(target) {
    var cell = target && target.closest && target.closest('#ed-board .cell');
    if (!cell) return;
    var key = cell.dataset.r + ',' + cell.dataset.c;
    if (key === lastKey) return;
    lastKey = key;
    stage = Core.paintStage(stage, tool, +cell.dataset.r, +cell.dataset.c);
    render();
  }
  board.addEventListener('pointerdown', function (e) {
    // 터치는 누른 칸에 포인터가 붙잡히는데, 칠할 때마다 칸을 새로 그리므로 풀어 둔다
    if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) e.target.releasePointerCapture(e.pointerId);
    dragging = tool.kind === 'terrain';
    lastKey = null;
    paintAt(e.target);
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    paintAt(document.elementFromPoint(e.clientX, e.clientY));
  });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });

  function resize(dr, dc) {
    stage = Core.resizeStage(stage, stage.rows + dr, stage.cols + dc);
    render();
  }

  document.getElementById('ed-rows-dec').addEventListener('click', function () { resize(-1, 0); });
  document.getElementById('ed-rows-inc').addEventListener('click', function () { resize(1, 0); });
  document.getElementById('ed-cols-dec').addEventListener('click', function () { resize(0, -1); });
  document.getElementById('ed-cols-inc').addEventListener('click', function () { resize(0, 1); });
  document.getElementById('ed-name').addEventListener('input', function (e) { stage.name = e.target.value; });

  // #editor 이면 에디터, 아니면 게임
  function route() {
    var editing = location.hash === '#editor';
    app.hidden = !editing;
    game.hidden = editing;
    if (editing) {
      render();
      renderSaved();
    }
  }
  document.getElementById('open-editor').addEventListener('click', function () {
    location.hash = 'editor';
    route();
  });
  document.getElementById('ed-back').addEventListener('click', function () {
    location.hash = '';
    route();
  });
  buildTools();
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', function () { if (!app.hidden) sizeBoard(); });
  route();
})();
</script>
</body>
</html>
