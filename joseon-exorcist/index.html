<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선 퇴마전</title>
<style>
  :root {
    --bg: #0e1016;
    --panel: #181b24;
    --text: #e6e2d6;
    --muted: #8a8778;
    --dirt: #2a2620;
    --rock: #121212;
    --shrine: #3a2327;
    --spring: #1d3140;
    --escape: #1f3324;
    --bs: #d9443a;      /* 벽사청 */
    --guest: #9a9a9a;   /* 객장 */
    --enemy: #a35ad8;   /* 요괴 */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 8px; }

  /* 맵: 폭 360px 세로 화면에서도 8칸이 다 들어가게 화면 폭·높이 중 작은 쪽에 맞춘다 */
  #board {
    position: relative;
    width: min(calc(100vw - 16px), 58vh, 464px);
    aspect-ratio: 1;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 2px;
    background: #07080b;
    padding: 2px;
    border-radius: 6px;
    touch-action: manipulation;
  }
  .cell {
    position: relative;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .t-dirt   { background: var(--dirt); }
  .t-rock   { background: var(--rock); }
  .t-shrine { background: var(--shrine); }
  .t-spring { background: var(--spring); }
  .t-escape { background: var(--escape); box-shadow: inset 0 0 0 1px #3f6b48; }
  .mark {
    position: absolute;
    font-size: clamp(12px, 4.5vw, 22px);
    opacity: .35;
    pointer-events: none;
  }
  .unit {
    position: relative;
    width: 86%;
    height: 86%;
    border: 2px solid;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 5.6vw, 28px);
    line-height: 1;
    background: rgba(0, 0, 0, .35);
    z-index: 1;
  }
  .f-bs    { border-color: var(--bs); }
  .f-guest { border-color: var(--guest); }
  .f-enemy { border-color: var(--enemy); }
  .f-neutral { border-color: #e2c26b; box-shadow: 0 0 6px rgba(226, 194, 107, .45); } /* 3장 서낭신: 진실 뒤 금색 신령 */
  .f-unknown { border-color: #6b6b6b; } /* 3장 서낭신: 진실 전에는 정체 모름 (회색·먹색) */
  #ask { position: fixed; inset: 0; z-index: 44; background: rgba(4, 5, 8, .75); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #ask .card { max-width: 340px; width: 100%; background: var(--panel); border: 1px solid #e2c26b; border-radius: 10px; padding: 18px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
  #ask p { margin: 0 0 4px; font-size: 15px; line-height: 1.6; word-break: keep-all; }
  /* 3장 지점 표시 (칸 왼쪽 위 작은 글자) */
  .pt {
    position: absolute; left: 1px; top: 1px; z-index: 2; pointer-events: none;
    font-size: 9px; font-weight: 800; line-height: 1; padding: 2px 3px; border-radius: 3px; letter-spacing: -.02em;
  }
  .pt.clue { background: #e0b04a; color: #1d1a14; }
  .pt.done { background: #4a4f5c; color: #d8d4c8; }
  .pt.seal { background: #b0302a; color: #fbf6ea; animation: pt-pulse 1.6s ease-in-out infinite; }
  .pt.sealed { background: #e2c26b; color: #1d1a14; }
  .pt.grudge { background: #5b3a78; color: #eadcff; }
  @keyframes pt-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(176, 48, 42, .8); } 50% { box-shadow: 0 0 0 4px rgba(176, 48, 42, 0); } }
  .cell.goal { box-shadow: inset 0 0 0 2px rgba(176, 48, 42, .8); }
  #objective {
    margin: -4px auto 6px; max-width: 464px; padding: 4px 8px; border-radius: 6px; font-size: 13px; line-height: 1.4;
    background: rgba(226, 194, 107, .12); border: 1px solid rgba(226, 194, 107, .5); text-align: center;
  }
  #objective b { color: #e2c26b; }
  .toast.mission { background: rgba(60, 20, 18, .97); border-color: #b0302a; }
  .toast.mission b { color: #f5c542; font-size: 17px; }
  .toast.mission s { color: #8a8778; }
  .unit.respawned { animation: respawn .9s ease-out; }
  @keyframes respawn { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: none; } }
  .badge {
    position: absolute;
    top: -1px;
    left: -1px;
    font-size: 9px;
    line-height: 1;
    padding: 1px 2px;
    background: var(--guest);
    color: #111;
    border-radius: 0 0 3px 0;
  }
  .hl::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 3px;
    pointer-events: none;
    z-index: 0;
  }
  .hl-move::after { background: rgba(70, 140, 255, .38); box-shadow: inset 0 0 0 2px rgba(120, 180, 255, .8); }
  .hl-attack::after { background: rgba(230, 60, 60, .35); box-shadow: inset 0 0 0 2px rgba(255, 110, 110, .9); }
  .hl-heal::after { background: rgba(60, 200, 110, .32); box-shadow: inset 0 0 0 2px rgba(110, 240, 150, .9); }
  .tag {
    position: absolute;
    top: 1px;
    right: 1px;
    z-index: 2;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 3px;
    border-radius: 3px;
    pointer-events: none;
  }
  .tag.good { background: #f5c542; color: #2a1d00; }
  .tag.bad { background: #5a6070; color: #e8e8e8; }
  .float {
    position: absolute;
    z-index: 5;
    font-size: 20px;
    font-weight: 800;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 1px 2px #000, 0 0 4px #000;
    animation: rise .9s ease-out forwards;
  }
  .float.dmg { color: #ff4a4a; }
  .float.dmg.good { font-size: 28px; color: #ff3030; }
  .float.dmg.good small { display: block; font-size: 10px; color: #f5c542; margin-top: -2px; }
  .float.dmg.bad { font-size: 15px; color: #c98a8a; }
  .unit.hit { animation: hit .35s ease-out; }
  @keyframes hit {
    0% { filter: brightness(3) saturate(0); transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); filter: brightness(1.6); }
    100% { filter: none; transform: translateX(0); }
  }
  .float.heal { color: #6dff9a; font-size: 24px; }
  .unit.healed { animation: healed .7s ease-out; }
  /* 정화수: 맑은 물이 번지는 푸른 파문 (specs/lore.md 8장) */
  .water {
    position: absolute; z-index: 4; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .water::before, .water::after {
    content: ""; position: absolute; width: 40%; aspect-ratio: 1; border-radius: 50%;
    border: 2px solid #7fd4ff; box-shadow: 0 0 8px #7fd4ff;
    animation: ripple .8s ease-out forwards;
  }
  .water::after { animation-delay: .18s; opacity: 0; }
  @keyframes ripple { 0% { transform: scale(.3); opacity: .95; } 100% { transform: scale(2.3); opacity: 0; } }
  /* 기술 이름 글자 (정화수·무령) 0.8초 */
  .skill-label {
    position: absolute; z-index: 6; pointer-events: none; white-space: nowrap;
    font-size: 12px; font-weight: 800; letter-spacing: .05em;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(8, 10, 16, .85); color: #cfefff; border: 1px solid #7fd4ff;
    transform: translate(-50%, -100%);
    animation: label .8s ease-out forwards;
  }
  .skill-label.bell { color: #f1d7ff; border-color: #c69cf0; }
  .skill-label.plain { color: #ffe9a8; border-color: #f5c542; }
  @keyframes label { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  /* 무령: 방울 소리 파문이 목표로 날아간다 */
  .bell-wave {
    position: absolute; z-index: 5; pointer-events: none;
    width: 34%; aspect-ratio: 1; border-radius: 50%;
    border: 2px solid #c69cf0; box-shadow: 0 0 10px #c69cf0, inset 0 0 6px #c69cf0;
    transform: translate(-50%, -50%);
    transition: left .32s ease-in, top .32s ease-in, opacity .2s ease .32s;
  }
  @keyframes healed {
    0% { box-shadow: 0 0 0 3px #6dff9a, 0 0 16px 6px rgba(109, 255, 154, .8); }
    100% { box-shadow: 0 0 0 0 rgba(109, 255, 154, 0); }
  }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-70%); opacity: 0; }
  }
  .unit.selected { box-shadow: 0 0 0 2px #fff, 0 0 10px 2px rgba(255, 255, 255, .5); }
  .hpbar {
    position: absolute;
    left: 3px;
    right: 3px;
    bottom: 2px;
    height: 3px;
    background: rgba(255, 255, 255, .15);
    border-radius: 2px;
  }
  .hpbar i { display: block; height: 100%; border-radius: 2px; background: #6fcf6a; }
  .hpbar i.low { background: #e0a030; }
  .hpbar i.crit { background: #e05050; }

  #top {
    display: flex;
    justify-content: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
    padding: 4px 0 8px;
    letter-spacing: .02em;
  }
  #top .sep { color: var(--muted); font-weight: 400; }

  .unit.acting { box-shadow: 0 0 0 2px var(--enemy), 0 0 12px 3px rgba(163, 90, 216, .7); }
  #top.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { color: #f5c542; } 100% { color: var(--text); } }
  #btn-end { background: #2a1f24; border-color: #5a3440; }
  #phase-note { text-align: center; font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 6px; }
  #phase-note.aim { font-size: 15px; color: var(--text); }
  #phase-note.aim b { color: #f5c542; font-size: 17px; }
  #btn-skill { font-size: 16px; font-weight: 800; letter-spacing: .04em; }
  #btn-skill:not(:disabled) { color: #f5c542; }
  .skill-label small { font-size: 10px; font-weight: 600; margin-left: 3px; opacity: .85; }
  .ghost {
    position: absolute;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: left .08s linear, top .08s linear;
  }
  .ghost .unit { width: 86%; height: 86%; }
  .dying { animation: dying .4s ease-in forwards; }
  @keyframes dying { to { opacity: 0; transform: scale(.7); filter: grayscale(1); } }
  .step-dot {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: dotfade .6s ease-out forwards;
  }
  .step-dot::before {
    content: "";
    width: 22%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--enemy);
    box-shadow: 0 0 6px var(--enemy);
  }
  @keyframes dotfade { from { opacity: .9; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .ghost { transition: none; }
    .float, .step-dot, .unit.fading, .dying, .unit.hit, .unit.healed { animation-duration: .01s; }
    .water::before, .water::after, .skill-label { animation-duration: .01s; }
    .bell-wave { transition: none; }
  }
  .unit.acted { filter: grayscale(1) brightness(.55); }

  #panel { margin-top: 8px; min-height: 120px; }
  #info {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--panel);
    border: 1px solid #2c303c;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }
  #info .face { font-size: 30px; line-height: 1; }
  #info .name { font-size: 15px; font-weight: 700; }
  #info .guest { font-size: 11px; font-weight: 600; color: #111; background: var(--guest); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  #info .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  #info .stats { margin-top: 3px; }
  #info .stats b { font-weight: 600; }
  .btns { display: flex; gap: 6px; margin-top: 6px; }
  .btns button {
    flex: 1;
    min-height: 44px;
    border: 1px solid #3a3f4d;
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    touch-action: manipulation;
  }
  .btns button small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
  .btns button:disabled { opacity: .35; }
  .btns button:not(:disabled):active { background: #262a36; }

  /* 대사 장면: 맵이 비쳐 보이게 옅게 덮고, 아래에 초상화 + 말풍선 */
  #scene {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(4, 5, 8, .45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
  }
  #scene .card {
    width: 100%;
    max-width: 464px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: #f1ead8;
    color: #1d1a14;
    border: 2px solid #3b2d1c;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .6);
  }
  #scene .portrait {
    flex: none;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    line-height: 1;
    background: #2a2620;
    border-radius: 10px;
  }
  #scene .who { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
  #scene .line { font-size: 16px; line-height: 1.45; word-break: keep-all; }
  #scene .next { text-align: right; font-size: 11px; color: #7a6e58; margin-top: 6px; }

  .unit.fading { animation: fadeaway 1.6s ease-in forwards; }
  @keyframes fadeaway { to { opacity: 0; transform: translateY(-20%) scale(.9); filter: blur(2px); } }

  #result {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(4, 5, 8, .88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }
  #title {
    position: fixed;
    inset: 0;
    z-index: 25;
    background: radial-gradient(ellipse at 50% 30%, #1d1a2a 0%, var(--bg) 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px 16px;
    text-align: center;
  }
  #title h1 { margin: 0; font-size: 34px; letter-spacing: .12em; }
  #title .sub { color: var(--muted); font-size: 13px; margin-top: -6px; }
  #title .prog { font-size: 14px; line-height: 1.6; min-height: 22px; }
  #title .prog b { color: #f5c542; }
  #title .confirm {
    position: absolute; inset: 0; background: rgba(4, 5, 8, .92);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px;
  }
  #title .confirm p { margin: 0 0 6px; font-size: 15px; line-height: 1.6; }
  #title .note { font-size: 12px; color: var(--muted); max-width: 300px; }
  .big-btn {
    min-width: 200px; min-height: 48px; border-radius: 10px;
    border: 1px solid #5a3440; background: #2a1f24; color: var(--text);
    font: inherit; font-size: 16px; font-weight: 700; touch-action: manipulation;
  }
  .big-btn.plain { background: var(--panel); border-color: #3a3f4d; font-size: 14px; }
  .big-btn:focus-visible { outline: 2px solid #f5c542; outline-offset: 2px; }
  .orb { position: absolute; z-index: 2; font-size: clamp(16px, 5.6vw, 28px); animation: orb 1.2s ease-out; }
  @keyframes orb { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  #result .sub { font-size: 14px; color: var(--muted); line-height: 1.6; }
  #result .title { font-size: 22px; font-weight: 800; line-height: 1.4; word-break: keep-all; }
  #result .title.win { color: #f5c542; }
  #result .title.lose { color: #c9b6e8; }
  #result button {
    min-width: 160px;
    min-height: 48px;
    border-radius: 10px;
    border: 1px solid #5a3440;
    background: #2a1f24;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
  }

  /* ── 맵 에디터 ── */
  #editor-app { max-width: 480px; margin: 0 auto; padding: 8px; }
  .ed-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0 8px; }
  .ed-head h1 { font-size: 17px; margin: 0; }
  .ed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .ed-row input[type="text"] {
    flex: 1; min-width: 0; height: 36px; padding: 0 10px; border-radius: 8px;
    border: 1px solid #3a3f4d; background: var(--panel); color: var(--text); font: inherit;
  }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .small-btn {
    min-height: 36px; min-width: 36px; padding: 0 10px; border-radius: 8px;
    border: 1px solid #3a3f4d; background: var(--panel); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; touch-action: manipulation;
  }
  .small-btn:disabled { opacity: .35; }
  .small-btn:focus-visible, .btns button:focus-visible, .tool:focus-visible { outline: 2px solid #f5c542; outline-offset: 1px; }
  #ed-board {
    position: relative;
    margin: 0 auto;
    display: grid;
    gap: 2px;
    background: #07080b;
    padding: 2px;
    border-radius: 6px;
    touch-action: none; /* 끌어 칠하기 */
    max-width: 100%;
  }
  .reserve-mark {
    position: absolute; inset: 12%; border: 2px dashed var(--bs); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: var(--bs); pointer-events: none;
  }
  .tool .num { position: absolute; font-size: 10px; font-weight: 800; right: 3px; bottom: 1px; color: #f5c542; }
  .tool { position: relative; }
  #ed-board .cell.warn { box-shadow: inset 0 0 0 2px #f5c542; }
  .tools { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .tool-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .tool-group > span { width: 34px; font-size: 11px; color: var(--muted); }
  .tool {
    width: 40px; height: 40px; border-radius: 8px; border: 2px solid #2c303c;
    background: var(--panel); color: var(--text); font-size: 20px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; touch-action: manipulation;
  }
  .tool.sw { font-size: 16px; }
  .tool.t-dirt { background: var(--dirt); }
  .tool.t-rock { background: var(--rock); }
  .tool.t-shrine { background: var(--shrine); }
  .tool.t-spring { background: var(--spring); }
  .tool.t-escape { background: var(--escape); }
  .tool.on { border-color: #f5c542; box-shadow: 0 0 0 1px #f5c542; }
  #ed-tool-name { font-size: 12px; color: var(--muted); min-height: 16px; }
  #ed-warns { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; }
  #ed-warns li { color: #f5c542; padding: 2px 0; }
  #ed-warns li.ok { color: #6fcf6a; }
  .ed-section { margin-top: 14px; border-top: 1px solid #2c303c; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .ed-section h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600; }
  #ed-code {
    width: 100%; min-height: 64px; resize: vertical; border-radius: 8px; padding: 8px;
    border: 1px solid #3a3f4d; background: #0a0c11; color: var(--text);
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all;
    user-select: text; -webkit-user-select: text;
  }
  #ed-msg { font-size: 12px; min-height: 16px; color: #6fcf6a; }
  #ed-msg.bad { color: #ff7a7a; }
  #ed-saved { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #ed-saved li { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #ed-saved li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ed-saved .empty { color: var(--muted); font-size: 12px; }
  #open-editor { display: block; margin: 14px auto 0; background: none; border: none; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; }

  /* ── 벽사록: 관문서 종이·먹·붉은 관인 톤 (specs/lore.md 19장) ── */
  #top { position: relative; padding-left: 36px; padding-right: 36px; }
  .lore-open {
    position: absolute; right: 0; top: 0; width: 32px; height: 32px;
    border-radius: 6px; border: 1px solid #5a3440; background: #2a1f24; color: var(--text);
    font-size: 16px; line-height: 1; touch-action: manipulation;
  }
  #lore {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(4, 5, 8, .7);
    display: flex; justify-content: center; align-items: stretch;
    padding: 12px;
  }
  #lore .paper {
    width: 100%; max-width: 480px; display: flex; flex-direction: column;
    background: #efe6d2; color: #1d1a14; border-radius: 6px;
    border: 1px solid #b9a984; box-shadow: 0 8px 28px rgba(0, 0, 0, .6);
    overflow: hidden;
  }
  #lore header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 14px 8px; border-bottom: 2px solid #1d1a14;
  }
  #lore h2 { margin: 0; font-size: 18px; letter-spacing: .15em; }
  #lore .count { font-size: 11px; color: #6b5f48; }
  #lore .seal {
    display: inline-block; margin-left: 6px; padding: 1px 5px; border: 2px solid #b0302a; color: #b0302a;
    border-radius: 3px; font-size: 11px; font-weight: 800; transform: rotate(-4deg);
  }
  #lore .close { min-width: 44px; min-height: 36px; border-radius: 6px; border: 1px solid #1d1a14; background: transparent; color: #1d1a14; font: inherit; font-weight: 700; }
  #lore .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px dashed #b9a984; }
  #lore .tabs button {
    min-height: 32px; padding: 0 10px; border-radius: 4px; border: 1px solid #b9a984; background: #f7f1e3; color: #1d1a14;
    font: inherit; font-size: 13px;
  }
  #lore .tabs button.on { background: #1d1a14; color: #efe6d2; border-color: #1d1a14; }
  #lore .body { flex: 1; overflow-y: auto; padding: 8px 12px 16px; -webkit-overflow-scrolling: touch; }
  #lore .entry {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 8px; border: none; border-bottom: 1px solid #d8cdb2; background: transparent; color: inherit;
    font: inherit; font-size: 15px; text-align: left;
  }
  #lore .entry.locked { color: #9a8f78; }
  #lore .entry small { color: #6b5f48; font-size: 12px; margin-left: 4px; }
  #lore .grade { font-size: 11px; color: #6b5f48; white-space: nowrap; }
  #lore .empty { color: #6b5f48; font-size: 13px; padding: 16px 4px; }
  #lore .detail h3 { margin: 6px 0 2px; font-size: 20px; }
  #lore .detail .meta { font-size: 12px; color: #6b5f48; margin-bottom: 10px; }
  #lore .detail p { font-size: 14px; line-height: 1.7; margin: 0 0 12px; word-break: keep-all; }
  #lore .detail .part { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: #b0302a; margin-bottom: 2px; }
  #lore .detail .char-note { font-family: "Nanum Myeongjo", "AppleMyungjo", serif; font-style: italic; border-left: 3px solid #b9a984; padding-left: 8px; }
  #lore .detail .foot { border-top: 1px dashed #b9a984; padding-top: 10px; font-size: 13px; line-height: 1.6; color: #3b3326; }
  #lore .detail .foot b { color: #b0302a; }
  #lore .back { margin-top: 4px; min-height: 32px; padding: 0 10px; border-radius: 4px; border: 1px solid #b9a984; background: #f7f1e3; font: inherit; font-size: 13px; color: #1d1a14; }
  #lore button:focus-visible { outline: 2px solid #b0302a; outline-offset: 1px; }

  /* 프롤로그: 어두운 밤, 한지 색 글자, 붉은 인장 */
  #prologue {
    position: fixed; inset: 0; z-index: 30;
    background: radial-gradient(ellipse at 50% 40%, #1c1914 0%, #0a0907 75%);
    color: #efe6d2; font-family: "Nanum Myeongjo", "AppleMyungjo", "Noto Serif KR", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    padding: 24px 16px; text-align: center;
  }
  #prologue .lines { display: flex; flex-direction: column; gap: 14px; max-width: 320px; }
  #prologue p { margin: 0; font-size: 16px; line-height: 1.6; word-break: keep-all; opacity: 0; transition: opacity .9s ease; }
  #prologue p.on { opacity: 1; }
  #prologue p b { color: #f5c542; font-weight: 700; }
  #prologue .seal {
    align-self: center; padding: 6px 10px; border: 3px double #c0392b; border-radius: 4px;
    color: #d9443a; font-size: 26px; font-weight: 800; letter-spacing: .2em;
    transform: rotate(-3deg); box-shadow: 0 0 18px rgba(192, 57, 43, .35);
  }
  #prologue .big-btn { opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  #prologue .big-btn.on { opacity: 1; pointer-events: auto; }

  /* 월드맵: 한지·먹선 고지도 느낌. 노드는 또렷하게 (specs/worldmap.md 6장) */
  #world {
    position: fixed; inset: 0; z-index: 24; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #f3ebd9 0%, #e6d9bd 70%, #d9c9a6 100%);
    color: #1d1a14; display: flex; flex-direction: column; align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  #world .w-head { width: 100%; max-width: 480px; padding: 8px 12px 4px; text-align: center; }
  #world .w-top { display: flex; align-items: center; justify-content: space-between; }
  #world h1 { margin: 0; font-size: 20px; letter-spacing: .12em; font-family: "Nanum Myeongjo", "AppleMyungjo", serif; }
  #world h1 small { font-size: 12px; color: #6b5f48; letter-spacing: .1em; }
  #world .w-btn { min-width: 40px; height: 36px; border-radius: 6px; border: 1px solid #b9a984; background: #f7f1e3; color: #1d1a14; font: inherit; font-size: 16px; }
  #world .w-rank { font-size: 13px; color: #3b3326; margin-top: 2px; }
  #world .w-rank b { color: #b0302a; }
  #world .w-mission {
    margin-top: 6px; width: 100%; min-height: 36px; border-radius: 6px; border: 1px solid #b0302a;
    background: rgba(176, 48, 42, .08); color: #1d1a14; font: inherit; font-size: 13px; font-weight: 700;
  }
  #world .w-mission small { font-weight: 400; color: #6b5f48; margin-right: 6px; }
  #world .w-dev { margin-top: 6px; font-size: 11px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-items: center; }
  #world .w-dev button { font: inherit; font-size: 11px; padding: 2px 6px; border: 1px solid #6b5f48; background: #f7f1e3; border-radius: 3px; }
  #world .w-map {
    transition: transform .25s ease;
    position: relative; flex: none; aspect-ratio: 100 / 160; /* 세로로 늘려 노드 사이 여유 (좌표는 100×130 기준 그대로) */
    width: min(calc(100vw - 16px), calc((100vh - 150px) * 100 / 160), 440px);
  }
  #world .w-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #world .ridge path { fill: none; stroke: #3b3326; stroke-width: .5; stroke-linejoin: round; opacity: .3; }
  #world .peak .m-fill { fill: #ebe1c9; stroke: none; }
  #world .peak .m-line { fill: none; stroke: #3b3326; stroke-width: .6; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
  #world .stream { fill: none; stroke: #7f98a3; stroke-width: .8; opacity: .6; stroke-linecap: round; }
  #world .paddy rect { fill: #e2d8b6; stroke: #8a7a55; stroke-width: .3; }
  #world .roof path { fill: #4a4034; opacity: .8; }
  #world .road-edge { fill: none; stroke: #cdb98f; stroke-width: 2.6; stroke-linecap: round; }
  #world .road { fill: none; stroke: #8a6f4a; stroke-width: 1; stroke-linecap: round; opacity: .9; }
  #world .shut .road-edge, #world .shut .road { opacity: .4; }
  #world .rock { fill: #8f8a80; stroke: #3b3326; stroke-width: .3; }
  #world .rope { fill: none; stroke: #6b5f48; stroke-width: .6; }
  #world .rope-tab { fill: #fbf6ea; stroke: #6b5f48; stroke-width: .2; }
  #world .river { fill: none; stroke: #7f98a3; stroke-width: 4; opacity: .35; stroke-linecap: round; }
  #world .node {
    position: absolute; transform: translate(-50%, -50%); background: none; border: none; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; color: #1d1a14;
    min-width: 56px; min-height: 56px; justify-content: center; touch-action: manipulation;
  }
  #world .node .seal {
    position: relative; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: #f7f1e3; border: 2px solid #3b3326; font-family: "Nanum Myeongjo", "AppleMyungjo", serif; font-size: 19px; font-weight: 800;
  }
  #world .node .label, #world .node .state { white-space: nowrap; background: rgba(243, 235, 217, .9); border-radius: 3px; padding: 0 3px; line-height: 1.35; }
  #world .node .label { font-size: 12px; font-weight: 700; }
  #world .node .state { font-size: 10px; color: #6b5f48; margin-top: -1px; }
  #world .node.on .seal { outline: 3px solid rgba(29, 26, 20, .35); outline-offset: 2px; }
  /* 본진: 붉은 네모 인장, 조금 크게 */
  #world .st-HQ .seal { width: 46px; height: 46px; border-radius: 4px; border: 3px double #b0302a; color: #b0302a; transform: rotate(-4deg); font-size: 24px; }
  /* 평온·안정됨: 창문 불빛 */
  #world .st-PEACEFUL .seal::after {
    content: ""; position: absolute; right: -2px; bottom: 2px; width: 7px; height: 7px; border-radius: 50%;
    background: #f5c542; box-shadow: 0 0 6px 2px rgba(245, 197, 66, .7);
  }
  #world .st-STABILIZED .seal { background: #fbf6ea; border-color: #4a5a52; color: #2d3a33; }
  /* 이상 징후: 옅은 안개와 느린 회색 파동 */
  #world .st-OMEN .seal { border-color: #a8894a; color: #6e5a2e; box-shadow: 0 0 0 6px rgba(214, 178, 96, .18), 0 0 14px 6px rgba(230, 214, 170, .55); }
  #world .st-OMEN .seal::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid rgba(214, 170, 80, .7); animation: w-omen 3.2s ease-out infinite; }
  @keyframes w-omen { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
  /* 괴변 발생: 붉은 인장 + 검은 연기 + 느린 호흡 (가장 눈에 띈다) */
  #world .st-EXORCISM_REQUIRED .seal { background: #b0302a; border-color: #6e1b17; color: #f7f1e3; animation: w-breath 2.4s ease-in-out infinite; }
  #world .st-EXORCISM_REQUIRED .seal::before {
    content: ""; position: absolute; left: 50%; bottom: 80%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
    background: radial-gradient(circle, rgba(20, 16, 12, .75) 0%, rgba(20, 16, 12, 0) 70%); filter: blur(1px);
    animation: w-smoke 2.8s ease-out infinite;
  }
  #world .st-EXORCISM_REQUIRED .label { color: #8f231d; }
  #world .st-EXORCISM_REQUIRED .seal::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid rgba(176, 48, 42, .7); animation: w-omen 1.8s ease-out infinite; }
  @keyframes w-breath { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(176, 48, 42, .45); } 50% { transform: scale(1.06); box-shadow: 0 0 0 7px rgba(176, 48, 42, 0); } }
  @keyframes w-smoke { 0% { transform: translateY(4px) scale(.7); opacity: .9; } 100% { transform: translateY(-14px) scale(1.5); opacity: 0; } }
  /* 미확인·봉쇄·통행 불가: 흐리게, 금줄 */
  #world .st-UNKNOWN .seal { border-style: dashed; color: #8a8270; background: #eee5d0; }
  #world .st-UNKNOWN .label, #world .st-LOCKED .label, #world .st-BLOCKED .label { color: #6b5f48; }
  #world .st-LOCKED .seal, #world .st-BLOCKED .seal { opacity: .5; }
  #world .st-LOCKED .seal::after, #world .st-BLOCKED .seal::after {
    content: ""; position: absolute; left: -6px; right: -6px; top: 45%; height: 4px; transform: rotate(-18deg);
    background: repeating-linear-gradient(90deg, #6b5f48 0 3px, #d9c9a6 3px 5px); border-radius: 2px;
  }
  /* 급보가 도착한 지역: 붉은 파동 세 번 */
  #world .node.news .seal { box-shadow: 0 0 0 0 rgba(176, 48, 42, .7); animation: w-news 1s ease-out 3; }
  @keyframes w-news { 0% { box-shadow: 0 0 0 0 rgba(176, 48, 42, .7); } 100% { box-shadow: 0 0 0 18px rgba(176, 48, 42, 0); } }
  /* 바텀시트 */
  #world .w-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; margin: 0 auto; max-width: 480px;
    background: #f7f1e3; border: 1px solid #b9a984; border-bottom: none; border-radius: 12px 12px 0 0;
    box-shadow: 0 -6px 20px rgba(0, 0, 0, .25); padding: 14px 16px 18px;
  }
  #world .w-sheet .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #world .w-sheet h2 { margin: 0; font-size: 19px; font-family: "Nanum Myeongjo", "AppleMyungjo", serif; }
  #world .w-sheet .w-badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; border: 1px solid #6b5f48; white-space: nowrap; }
  #world .w-sheet .w-badge.EXORCISM_REQUIRED { background: #b0302a; color: #f7f1e3; border-color: #b0302a; }
  #world .w-sheet .w-badge.STABILIZED { background: #e3eadf; }
  #world .w-sheet .w-badge.OMEN { background: #e6e0d0; }
  #world .w-sheet p { margin: 8px 0; font-size: 14px; line-height: 1.6; white-space: pre-line; word-break: keep-all; }
  #world .w-sheet .note { font-size: 13px; color: #6b5f48; }
  #world .w-sheet .record { font-size: 13px; border-left: 3px solid #b0302a; padding-left: 8px; margin: 8px 0; }
  #world .w-sheet .stats { font-size: 14px; margin: 6px 0; }
  #world .w-sheet .stats b { color: #b0302a; }
  #world .w-sheet .row { display: flex; gap: 8px; margin-top: 10px; }
  #world .w-sheet .row button { flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #3b3326; background: #efe6d2; color: #1d1a14; font: inherit; font-size: 15px; font-weight: 700; }
  #world .w-sheet .row button.go { background: #b0302a; color: #f7f1e3; border-color: #6e1b17; }
  #world .w-sheet .x { min-width: 36px; height: 32px; border: none; background: none; font-size: 18px; color: #6b5f48; }
  /* 급보 */
  #world .w-news { position: fixed; inset: 0; z-index: 27; background: rgba(20, 16, 12, .55); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #world .w-news .card { max-width: 340px; width: 100%; background: #f7f1e3; border: 2px solid #b0302a; border-radius: 8px; padding: 18px 16px; text-align: center; }
  #world .w-news .t { font-weight: 800; font-size: 16px; color: #8f231d; }
  #world .w-news p { font-size: 15px; line-height: 1.7; white-space: pre-line; word-break: keep-all; margin: 12px 0 16px; }
  @media (prefers-reduced-motion: reduce) {
    #world .seal, #world .seal::before { animation: none !important; }
  }

  /* 개발자용 플레이 기록 */
  .dev-link { display: block; margin: 8px auto 0; background: none; border: none; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; }
  #playlog { position: fixed; inset: 0; z-index: 42; background: rgba(4, 5, 8, .8); display: flex; justify-content: center; padding: 12px; }
  #playlog .sheet { width: 100%; max-width: 480px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid #3a3f4d; border-radius: 8px; overflow: hidden; }
  #playlog header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #2c303c; }
  #playlog h2 { margin: 0; font-size: 16px; }
  #playlog .bar { display: flex; gap: 6px; padding: 8px 12px 0; }
  #playlog .msg { padding: 4px 12px; font-size: 12px; color: #f5c542; min-height: 16px; }
  #playlog textarea { margin: 0 12px 8px; height: 90px; font-size: 11px; background: #0e1016; color: var(--text); border: 1px solid #3a3f4d; border-radius: 4px; }
  #playlog .list { flex: 1; overflow-y: auto; padding: 0 12px 12px; -webkit-overflow-scrolling: touch; }
  #playlog .battle { border-top: 1px solid #2c303c; padding: 10px 0; font-size: 13px; line-height: 1.6; }
  #playlog .battle h3 { margin: 0; font-size: 15px; }
  #playlog .battle h3.win { color: #f5c542; }
  #playlog .battle h3.lose { color: #c9b6e8; }
  #playlog .battle .meta { color: var(--muted); font-size: 11px; }
  #playlog .empty { color: var(--muted); padding: 16px 0; font-size: 13px; }

  /* 토스트: 맵을 가리지 않게 화면 아래에 잠깐 (specs/immersion.md 2·4·7장) */
  #toasts {
    position: fixed; left: 0; right: 0; bottom: 12px; z-index: 45; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 12px;
  }
  #scene:not([hidden]) ~ #toasts { bottom: auto; top: 12px; } /* 대사 상자(아래)를 가리지 않게 */
  .toast {
    width: 100%; max-width: 440px; padding: 8px 12px; border-radius: 8px;
    background: rgba(24, 27, 36, .96); border: 1px solid #3a3f4d; box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
    font-size: 13px; line-height: 1.5; text-align: center; word-break: keep-all;
    animation: toast var(--ms, 2800ms) ease forwards;
  }
  .toast b { display: block; font-size: 15px; }
  .toast small { display: block; color: var(--muted); font-size: 11px; }
  .toast.lore { background: rgba(239, 230, 210, .97); color: #1d1a14; border-color: #b9a984; }
  .toast.lore small { color: #6b5f48; }
  .toast.lore b small { display: inline; font-size: 12px; margin-left: 4px; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 8% { opacity: 1; transform: none; } 88% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span id="top-turn"></span><span class="sep">·</span>
    <span id="top-weather"></span><span class="sep">·</span>
    <span id="top-merit"></span>
    <button class="lore-open" id="lore-open-battle" type="button" aria-label="벽사록 열기">📖</button>
  </header>
  <div id="objective" hidden></div>
  <div id="board"></div>
  <div id="panel">
    <div id="info" hidden></div>
    <div id="menu" class="btns" hidden>
      <button id="btn-attack">공격</button>
      <button id="btn-skill">스킬</button>
      <button id="btn-seal" hidden>봉인 복구</button>
      <button id="btn-wait">대기</button>
      <button id="btn-cancel">취소</button>
    </div>
    <div class="btns"><button id="btn-end">턴 종료</button></div>
    <div id="phase-note"></div>
    <!-- 개발용: 주소에 ?dev=1 이 있을 때만 보인다 (specs/immersion.md 1장) -->
    <button id="open-editor" type="button" hidden>🛠 맵 에디터</button>
    <button class="dev-link" id="playlog-open-battle" type="button" hidden>🧪 플레이 기록</button>
  </div>

  <!-- 첫 화면 (specs/chapter2.md 1-3, 보충 S7) -->
  <div id="title">
    <h1>조선 퇴마전</h1>
    <div class="sub">벽사청 루트</div>
    <div class="prog" id="title-prog"></div>
    <button class="big-btn" id="btn-continue" type="button">이어하기</button>
    <button class="big-btn plain" id="btn-new" type="button">처음부터</button>
    <button class="big-btn plain" id="lore-open-title" type="button">📖 벽사록</button>

    // 2장부터 품계에 따라 합류 (specs/chapter2.md 1-2). 스테이지에 직접 두지 않는다
    gwangun: { name: '관군', faction: '벽사청', guest: false, title: '벽사청 관군', emoji: '🪖',
