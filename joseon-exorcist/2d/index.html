<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>조선 퇴마전 2D 파일럿 v2 — 사라진 장부</title>
<style>
  :root { --ink: rgba(14,17,22,.86); --ink-soft: rgba(14,17,22,.6); --hanji: rgba(231,220,196,.28); --text: #f3efe6; --gold: #e8d3a0; --warn: #e0583a; --ally: #3fc1b0; --soldier: #4b63b8; --runner: #f08a24; }
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "WenQuanYi Zen Hei", sans-serif; color: var(--text); }
  #stage { position: absolute; left: 0; top: 0; width: 360px; height: 640px; transform-origin: 0 0; overflow: hidden; background: #0c1016; }
  canvas#view { position: absolute; left: 0; top: 0; width: 360px; height: 640px; }
  .panel { background: var(--ink); border: 1px solid var(--hanji); border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  #hudTop { position: absolute; left: 0; top: 0; width: 360px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-sizing: border-box; background: linear-gradient(var(--ink), var(--ink-soft)); border-bottom: 1px solid var(--hanji); font-size: 14px; }
  #objective { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
  #timer { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700; }
  #timer.low { color: var(--warn); }
  #logBtn { height: 44px; min-width: 44px; margin-left: auto; margin-right: 8px; background: transparent; color: var(--text); border: none; font: 11px inherit; font-family: inherit; opacity: .8; display: none; }
  #logBtn span { border: 1px solid rgba(232,211,160,.5); border-radius: 8px; padding: 4px 8px; }
  #hudBar { position: absolute; left: 0; top: 44px; width: 360px; height: 28px; display: none; align-items: center; gap: 8px; padding: 0 8px; box-sizing: border-box; background: var(--ink-soft); font-size: 11px; }
  .ring { display: flex; align-items: center; gap: 4px; min-width: 70px; }
  .ring i { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--c, #a9a39a) var(--p, 0%), rgba(255,255,255,.14) 0); display: inline-block; }
  .ring.hot i { --c: var(--warn); }
  .ring.hot b { color: var(--warn); }
  .ring b { font-weight: 400; font-variant-numeric: tabular-nums; }
  #gauge { flex: 1; display: flex; align-items: center; gap: 5px; }
  #gauge .track { flex: 1; height: 9px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; }
  #gauge .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #f0b35a, var(--runner)); border-radius: 5px; transition: width .15s; }
  #gauge .mark { position: relative; }
  #hint { position: absolute; left: 50%; top: 76px; transform: translateX(-50%); width: max-content; max-width: 300px; font-size: 12px; padding: 4px 10px; text-align: center; display: none; }
  #notebook { position: absolute; left: 8px; top: 50px; width: 250px; padding: 6px 9px; font-size: 11px; line-height: 1.5; display: none; }
  #notebook .concl { margin-top: 3px; padding-top: 3px; border-top: 1px dashed var(--hanji); color: var(--gold); }
  #notebook .concl.done { color: #fff; font-weight: 700; }
  #banner { position: absolute; left: 20px; right: 20px; top: 250px; text-align: center; font-size: 20px; font-weight: 700; color: var(--gold); padding: 14px 8px; opacity: 0; pointer-events: none; transition: opacity .3s, top .6s; }
  #banner.show { opacity: 1; }
  #banner small { display: block; font-size: 11px; font-weight: 400; color: #cfc6b3; margin-bottom: 4px; letter-spacing: 2px; }
  #toast { position: absolute; left: 50%; top: 106px; transform: translateX(-50%); width: max-content; max-width: 300px; text-align: center; font-size: 12px; line-height: 1.4; padding: 5px 12px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .rbtn { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: 700; color: var(--text); background: rgba(20,24,30,.7); border: 2px solid rgba(232,211,160,.55); box-shadow: 0 2px 8px rgba(0,0,0,.5); touch-action: none; overflow: hidden; }
  .rbtn .cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.66) var(--p, 0%), transparent 0); pointer-events: none; }
  .rbtn span { position: relative; }
  .rbtn small { position: relative; font-size: 9px; font-weight: 400; opacity: .8; }
  #btnAttack { left: 268px; top: 484px; width: 72px; height: 72px; font-size: 15px; }
  #btnAttack.pulse { animation: pulse .6s infinite; border-color: var(--runner); }
  #btnAttack.flash { box-shadow: 0 0 0 4px #fff; }
  #btnAttack.dim { opacity: .4; }
  #btnAttack.gap { border-color: #ffdd55; box-shadow: 0 0 0 4px rgba(255,221,85,.55), 0 0 16px rgba(255,221,85,.6); }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #btnSkill { left: 276px; top: 416px; width: 56px; height: 56px; font-size: 12px; display: none; }
  #btnDodge { left: 204px; top: 500px; width: 56px; height: 56px; font-size: 12px; display: none; }
  #stickZone { position: absolute; left: 0; top: 392px; width: 196px; height: 192px; touch-action: none; }
  #portraits { position: absolute; left: 0; top: 584px; width: 360px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 4px; background: linear-gradient(var(--ink-soft), var(--ink)); border-top: 1px solid var(--hanji); }
  .por { position: relative; width: 48px; height: 52px; display: flex; flex-direction: column; align-items: center; touch-action: none; }
  .por .ring2 { width: 44px; height: 44px; border-radius: 50%; padding: 3px; box-sizing: border-box; background: conic-gradient(var(--ally) var(--hp, 100%), rgba(255,255,255,.12) 0); }
  .por.sol .ring2 { background: conic-gradient(var(--soldier) var(--hp, 100%), rgba(255,255,255,.12) 0); }
  .por img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; object-position: 50% 15%; background: #20262e; display: block; }
  .por .tag { position: absolute; top: -4px; right: -3px; font-size: 9px; background: var(--ally); color: #062520; border-radius: 6px; padding: 0 4px; font-weight: 700; display: none; }
  .por.sol .tag { display: block; background: var(--soldier); color: #fff; }
  .por.ctl .ring2 { box-shadow: 0 0 0 2px var(--gold); }
  .por.ctl .tag { display: block; }
  .por.hurt .ring2 { box-shadow: 0 0 0 3px var(--warn); }
  .por.down { filter: grayscale(1) brightness(.5); }
  .por.locked { opacity: .45; }
  .por.hidden { display: none; }
  .divider { width: 1px; height: 40px; background: var(--hanji); margin: 0 6px; }
  #solMenu { position: absolute; display: none; gap: 4px; padding: 4px; }
  #solMenu button { height: 44px; min-width: 52px; border-radius: 8px; border: 1px solid rgba(232,211,160,.5); background: rgba(40,44,52,.95); color: var(--text); font-size: 13px; font-family: inherit; }
  #dialog { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 132px; display: none; padding: 10px 12px 10px 92px; box-sizing: border-box; }
  #dialog img { position: absolute; left: 10px; top: 12px; width: 70px; height: 70px; border-radius: 10px; object-fit: cover; object-position: 50% 12%; background: #20262e; }
  #dialog .who { font-size: 13px; color: var(--gold); margin-bottom: 6px; font-weight: 700; }
  #dialog .what { font-size: 16px; line-height: 1.5; min-height: 48px; }
  #dialog .next { position: absolute; right: 12px; bottom: 8px; font-size: 11px; color: #bdb4a2; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #fade.on { opacity: 1; }
  #fade.hold { pointer-events: auto; }
  #endCard { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; }
  #endCard .ch { font-size: 26px; letter-spacing: 3px; color: #e9e4d8; opacity: 0; transition: opacity 1.4s; }
  #endCard .res { margin-top: 26px; font-size: 13px; color: #bdb4a2; opacity: 0; transition: opacity 1s; padding: 0 16px; }
  #endCard .btns { margin-top: 24px; display: flex; gap: 10px; opacity: 0; transition: opacity 1s; }
  #endCard.show .ch, #endCard.show2 .res, #endCard.show2 .btns { opacity: 1; }
  #result { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; background: rgba(6,8,11,.94); padding-top: 60px; box-sizing: border-box; }
  #result h2 { margin: 0 0 6px; font-size: 22px; color: var(--warn); }
  #result p { margin: 0 0 14px; font-size: 13px; color: #cfc6b3; text-align: center; padding: 0 20px; }
  #resStats { width: 300px; font-size: 14px; line-height: 2; }
  #resStats div { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(232,211,160,.2); }
  #resStats b { color: var(--gold); font-weight: 400; }
  #result .btns { display: flex; gap: 10px; margin-top: 22px; }
  .bigbtn { height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--gold); background: #2a2419; color: var(--text); font-size: 15px; font-family: inherit; }
  .bigbtn.sub { border-color: #6b6559; background: #1d2024; font-size: 13px; }
  #logPanel { position: absolute; inset: 20px 10px; display: none; flex-direction: column; padding: 10px; }
  #logPanel textarea { flex: 1; width: 100%; box-sizing: border-box; background: #0c0f13; color: #d8e3dc; border: 1px solid #333; border-radius: 6px; font: 10px/1.35 ui-monospace, Menlo, monospace; resize: none; }
  #logPanel .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  #logPanel .row button { height: 44px; min-width: 64px; border-radius: 8px; border: 1px solid rgba(232,211,160,.5); background: #22262c; color: var(--text); font-family: inherit; }
  #logPanel h3 { margin: 0 0 6px; font-size: 13px; color: var(--gold); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hudTop"><span id="objective"></span><button id="logBtn"><span>기록</span></button><span id="timer"></span></div>
  <div id="hudBar">
    <div class="ring" id="ringN"><i></i><b>북 0%</b></div>
    <div id="gauge"><span>제압</span><div class="track"><div class="fill"></div></div></div>
    <div class="ring" id="ringS"><b>남 0%</b><i></i></div>
  </div>
  <div id="hint" class="panel"></div>
  <div id="notebook" class="panel"></div>
  <div id="toast" class="panel"></div>
  <div id="banner" class="panel"></div>
  <div id="stickZone"></div>
  <div id="btnSkill" class="rbtn"><div class="cd"></div><span>기술</span></div>
  <div id="btnDodge" class="rbtn"><div class="cd"></div><span>회피</span></div>
  <div id="btnAttack" class="rbtn"><span>살피기</span><small></small></div>
  <div id="portraits"></div>
  <div id="solMenu" class="panel"><button data-o="N">북문</button><button data-o="S">남문</button><button data-o="follow">따라와</button></div>
  <div id="dialog" class="panel"><img alt=""><div class="who"></div><div class="what"></div><div class="next">▼ 눌러서 넘기기</div></div>
  <div id="result">
    <h2 id="resTitle"></h2>
    <p id="resWhy"></p>
    <div id="resStats"></div>
    <div class="btns"><button class="bigbtn" id="btnRetry">추격부터 다시</button><button class="bigbtn sub" id="btnLog1">플레이 기록</button></div>
  </div>
  <div id="fade"></div>
  <div id="endCard"><div class="ch"></div><div class="res"></div><div class="btns"><button class="bigbtn" id="btnRestart">처음부터</button><button class="bigbtn sub" id="btnLog2">플레이 기록</button></div></div>
  <div id="logPanel" class="panel">
    <h3>플레이 기록 (JSON) — 재미 가설 H1~H4 (브리프 v2 14장)</h3>
    <textarea id="logText" readonly></textarea>
    <div class="row"><button id="logCopy">복사</button><button id="logClose">닫기</button></div>
  </div>
</div>
<script src="stage-ch5.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const S = window.STAGE_CH5, C = window.JC2D, K = C.K;
  const $ = (id) => document.getElementById(id);
  const hyp = Math.hypot;
  const ASSET = '../assets/';

  // ── 화면 크기: 360×640 논리 화면을 창에 맞춰 늘인다 ─────────────
  const stageEl = $('stage'), canvas = $('view'), ctx = canvas.getContext('2d');
  let DPR = 1, UI = 1;
  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    UI = Math.min(w / 360, h / 640);
    stageEl.style.transform = `translate(${(w - 360 * UI) / 2}px, ${(h - 640 * UI) / 2}px) scale(${UI})`;
    DPR = Math.min(2, (window.devicePixelRatio || 1) * UI);
    canvas.width = Math.round(360 * DPR); canvas.height = Math.round(640 * DPR);
  }
  window.addEventListener('resize', fit);
  fit();

  // ── 그림 ───────────────────────────────────────────────
  const IMG = {};
  const imgList = {
    yoon: 'characters/yoon_battle.webp', hangyeol: 'characters/hangyeol_battle.webp', yeoul: 'characters/yeoul_battle.webp', soun: 'characters/soun_battle.webp',
    sol: 'npcs/soldier_battle.webp', official: 'npcs/official_battle.webp', runner: 'enemies/ledger_runner.webp', gwihwa: 'enemies/gwihwa.webp',
    road: 'environment/ch5/env_city_road.webp', alley: 'environment/ch5/env_city_alley.webp', wall: 'environment/ch5/env_city_wall.webp',
    gate: 'environment/ch5/env_city_gate.webp', gaeksa: 'environment/ch5/env_point_gaeksa.webp',
  };
  let loaded = 0;
  const total = Object.keys(imgList).length;
  for (const [k, src] of Object.entries(imgList)) {
    const im = new Image();
    im.onload = im.onerror = () => { loaded++; if (loaded === total) onAssets(); };
    im.src = ASSET + src;
    IMG[k] = im;
  }
  const ok = (im) => im && im.complete && im.naturalWidth > 0;

  const COLORS = { ally: '#3fc1b0', soldier: '#4b63b8', runner: '#f08a24', gwihwa: '#bfe6ff', official: '#9a9a9a' };
  const HERO_IDS = S.HEROES.map((h) => h.id);
  const DEF = {}; S.HEROES.concat(S.SOLDIERS).forEach((d) => { DEF[d.id] = d; });
  // ── 소리 (효과음 몇 개만) ─────────────────────────────────
  let AC = null;
  function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
  function tone(freq, dur, type, vol, when) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (when || 0);
    const o = a.createOscillator(), gn = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.55), t + dur);
    gn.gain.setValueAtTime(vol || 0.2, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, when, lp) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (when || 0);
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    let seed = 7; for (let i = 0; i < len; i++) { seed = (seed * 16807) % 2147483647; d[i] = (seed / 2147483647 * 2 - 1) * (1 - i / len); }
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 900;
    const gn = a.createGain(); gn.gain.value = vol || 0.2;
    src.connect(f).connect(gn).connect(a.destination); src.start(t);
  }
  const SFX = {
    heart() { tone(62, 0.16, 'sine', 0.35); tone(55, 0.18, 'sine', 0.28, 0.2); },
    alert() { tone(880, 0.12, 'triangle', 0.12); },
    grab() { noise(0.12, 0.25, 0, 1400); },
    shake() { noise(0.2, 0.3, 0, 700); tone(160, 0.15, 'sawtooth', 0.08); },
    shot() { noise(0.08, 0.2, 0, 3000); tone(1200, 0.1, 'triangle', 0.06); },
    barrier() { tone(520, 0.4, 'sine', 0.12); tone(780, 0.4, 'sine', 0.06, 0.05); },
    gwihwa() { tone(300, 0.6, 'sine', 0.12); tone(460, 0.6, 'triangle', 0.05, 0.1); },
    hit() { noise(0.07, 0.2, 0, 2000); },
    knock(when) { noise(0.09, 0.9, when, 260); tone(70, 0.12, 'sine', 0.6, when); },
    step() { noise(0.03, 0.05, 0, 500); },
    ui() { tone(660, 0.05, 'triangle', 0.05); },
  };

  // ── 공통 상태 ───────────────────────────────────────────
  const G = {
    scene: 'boot', paused: false, cam: { x: 0, y: 0 }, camLock: null, time: 0,
    world: null, bg: null, worldW: 360, worldH: 640, units: [], ctlId: 'yoon', bubbles: [], effects: [], guides: [],
    stick: null, attackHeld: false, attackPressed: false, skillPressed: false, dodgePressed: false,
    chase: null, graph: null, inv: null, room: null, hitstop: 0, zoom: 1, lastActionLabel: '살피기',
  };
  const LOG = {
    version: '2d-pilot-v2', brief: 'DESIGN-BRIEF v2 14장 H1~H4',
    investigation: { roomSec: null, alleySec: null, officialSec: null, totalSec: null, standSec: 0, dialogueSec: 0, roomOrder: [], traceAt: {} },
    chases: [], retries: [], ending: null,
  };
  const TIMES = {};
  let chaseInput = null; // 추격 한 판의 입력 기록

  const CITY = C.makeWorld(S.WALK, S.BLOCKS, null);
  const ROOMW = C.makeWorld(S.ROOM_SCENE.walk, S.ROOM_SCENE.blocks, null);

  // ── 정적 배경 ───────────────────────────────────────────
  const BG = {};
  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function stretch(c, im, x, y, w, h, alpha) {
    if (!ok(im)) return;
    c.save(); c.globalAlpha = alpha; c.drawImage(im, 0, 0, im.naturalWidth, im.naturalHeight, x, y, w, h); c.restore();
  }
  function drawRoof(c, b, seed) {
    const w = b.x1 - b.x0, h = b.y1 - b.y0;
    const pal = { office: ['#222a34', '#161b22'], gaeksa: ['#29302a', '#1a1e18'], town: ['#23272c', '#171a1e'], store: ['#2a2723', '#1a1815'], wall: ['#2e2e2c', '#20201e'] }[b.kind] || ['#23272c', '#171a1e'];
    c.save();
    c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    roundRect(c, b.x0 + 2, b.y0 + 2, w - 4, h - 4, Math.min(10, w / 4));
    const gr = c.createLinearGradient(b.x0, b.y0, b.x1, b.y1); gr.addColorStop(0, pal[0]); gr.addColorStop(1, pal[1]);
    c.fillStyle = gr; c.fill();
    c.restore();
    if (b.kind === 'wall') return;
    c.save();
    roundRect(c, b.x0 + 2, b.y0 + 2, w - 4, h - 4, Math.min(10, w / 4)); c.clip();
    // 지붕이 여러 채로 나뉜 덩어리 (크기 제각각)
    let yy = b.y0 + 4, k = seed;
    while (yy < b.y1 - 20) {
      k = (k * 9301 + 49297) % 233280;
      const hh = 34 + (k % 60);
      const inset = 3 + (k % 7);
      c.fillStyle = 'rgba(255,255,255,0.035)';
      roundRect(c, b.x0 + inset, yy, w - inset * 2, Math.min(hh, b.y1 - yy - 4), 7); c.fill();
      // 용마루
      c.strokeStyle = 'rgba(210,205,190,0.13)'; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(b.x0 + inset + 6, yy + hh / 2); c.quadraticCurveTo(b.x0 + w / 2, yy + hh / 2 - 3, b.x1 - inset - 6, yy + hh / 2); c.stroke();
      // 기와 골 (곡선, 간격 불규칙)
      c.strokeStyle = 'rgba(0,0,0,0.22)'; c.lineWidth = 1;
      for (let x = b.x0 + inset + 5; x < b.x1 - inset - 3; x += 5 + (k % 3)) {
        c.beginPath(); c.moveTo(x, yy + 3); c.quadraticCurveTo(x + 1.5, yy + hh / 2, x, yy + hh - 3); c.stroke();
      }
      yy += hh + 6;
    }
    c.restore();
    if (b.name) {
      c.save(); c.font = '10px sans-serif'; c.fillStyle = 'rgba(220,210,190,.35)'; c.textAlign = 'center';
      c.fillText(b.name, (b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2 + 3); c.restore();
    }
  }
  function drawGround(c, rects, pad, color, tex, alpha) {
    // 땅은 이어진 띠로: 가장자리를 흐리게 (격자처럼 보이지 않게)
    c.save();
    c.fillStyle = color; c.shadowColor = color; c.shadowBlur = 10;

  // ── 유닛 그리기 (그림 64px, 발밑 원 32u) ──────────────────────
  function tokenImg(id) {
    if (id === 'sol1' || id === 'sol2' || id === 'messenger') return IMG.sol;
    return IMG[id] || null;
  }
  function drawUnit(c, u, color, opt) {
    opt = opt || {};
    const bob = u.moving ? Math.sin(G.time * 16 + (u.x + u.y) * 0.1) * 2 : 0;
    const f = u.facing || { x: 0, y: 1 };
    const tilt = u.moving ? Math.max(-0.14, Math.min(0.14, f.x * 0.14)) : 0;
    const lunge = u.lungeT > 0 ? 12 * (u.lungeT / 0.12) : 0;
    const x = u.x + f.x * lunge, y = u.y + f.y * lunge;
    const a = opt.alpha == null ? 1 : opt.alpha;
    c.save(); c.globalAlpha = a;
    c.fillStyle = color; c.globalAlpha = a * 0.5;
    c.beginPath(); c.ellipse(x, y, 16, 16, 0, 0, 7); c.fill();
    c.globalAlpha = a; c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.5; c.stroke();
    const im = opt.img || tokenImg(u.id);
    if (ok(im)) {
      c.translate(x, y - 22 + bob);
      c.rotate(tilt);
      if (opt.gray) c.filter = 'grayscale(1) brightness(.6)';
      if (opt.glow) c.globalCompositeOperation = 'lighter';
      c.drawImage(im, -32, -34, 64, 64);
      c.filter = 'none';
      if (u.hitFlash > 0) { c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, u.hitFlash * 7); c.drawImage(im, -32, -34, 64, 64); }
    }
    c.restore();
  }

    c.fillStyle = col; roundRect(c, x - 22, y, Math.max(2, 44 * frac), 6, 3); c.fill();
  }

    opts = opts || {};

  function nextLine() {
    if (!dlg) return;

    dlg.i++;

      const r = dlg.resolve; dlg = null; G.paused = false; r();

      el.querySelector('.who').textContent = ''; el.querySelector('.what').textContent = '';

  // ═══════════════ 객사 방 (7-1) ═══════════════
  function enterRoom() {

    const sd = S.ROOM_SCENE;
    G.units = HERO_IDS.map((id) => { const p = id === 'yoon' ? sd.start.yoon : sd.companions[id]; return C.makeHero(DEF[id], p[0], p[1]); });
    G.ctlId = 'yoon';

    $('notebook').style.display = 'block';
    setObjective(S.OBJECTIVES.gaeksa);
    renderNotebook();
    snapCam(); updatePortraits();
  }
  function nearestSpot() {
    if (!G.room) return null;
    const me = ctlUnit();
    let best = null, bd = S.ROOM_SCENE.spotRadius;
    for (const sp of S.ROOM_SCENE.spots) { const d = hyp(me.x - sp.pos[0], me.y - sp.pos[1]); if (d < bd) { bd = d; best = sp; } }
    return best;
  }
  function inspect(sp) {
    const R = G.room;
    if (R.seen.includes(sp.id)) return;
    R.seen.push(sp.id);
    LOG.investigation.roomOrder.push(sp.id);
    SFX.ui(); renderNotebook();
    let near = null, nd = 1e9;
    for (const u of G.units) { if (u.id === 'yoon') continue; const d = hyp(u.x - sp.pos[0], u.y - sp.pos[1]); if (d < nd) { nd = d; near = u; } }
    if (near) bubble(near.id, sp.id === 'hook' ? '…!' : '…', 1.2); // 원문 대사가 없어 새로 쓰지 않는다
    if (!R.concluded && R.seen.length >= S.ROOM_SCENE.spots.length) {
      R.concluded = true;
      setTimeout(async () => {
        renderNotebook(true);
        await say(S.LINES.gaeksaConclusion);
        LOG.investigation.roomSec = round(G.time - TIMES.room);
        setObjective(S.OBJECTIVES.exit);
        banner(S.OBJECTIVES.exit, '목표 갱신');

  function updateRoom(dt) {

  function updateAlley(dt) {
    const I = G.inv, A = S.ALLEY_INVESTIGATION;
    moveControlled(dt);
    companionsFollow(dt);
    const idx = I.found.length;
    if (idx < A.traces.length) {
      const tr = A.traces[idx];
      const who = G.units.find((u) => hyp(u.x - tr.pos[0], u.y - tr.pos[1]) <= A.traceRadius);
      if (who) {
        I.found.push(tr.id);
        LOG.investigation.traceAt[tr.id] = round(G.time - TIMES.alley);
        SFX.ui(); toast(`흔적 — ${tr.name}`, 1.4);
        const next = A.traces[idx + 1] ? A.traces[idx + 1].pos : A.official;
        G.guides.push({ a: tr.pos, b: next, t: 3, t0: 3 });
        if (tr.id === 't2') { bubble('soun', S.LINES.fragment[0][1], 2.4); setObjective(S.OBJECTIVES.official); banner(S.OBJECTIVES.official, '목표 갱신', 1.2); }
      }
    }
    if (!I.omen && I.found.length >= 1) { I.omen = true; G.effects.push({ kind: 'omen', x: A.omen[0], y: A.omen[1], t: 1.4 }); }
    if (!I.triggered && I.found.length >= 3) {
      const who = G.units.find((u) => hyp(u.x - A.official[0], u.y - A.official[1]) <= A.officialTalkRadius);
      if (who) { I.triggered = true; officialEvent(); }
    }
  }
  function companionsFollow(dt) {
    const me = ctlUnit();
    let k = 0;
    for (const u of G.units) {
      if (u === me) continue;
      k++; u.moving = false;
      const d = hyp(me.x - u.x, me.y - u.y);
      if (d < 40 + 20 * k) { u.path = []; continue; }
      u.pathT = (u.pathT || 0) - dt;
      if (u.pathT <= 0 || !u.path || !u.path.length) { u.pathT = 0.4; u.path = C.planPath(G.inv.st, u, me); }
      const q = u.path[0]; if (!q) continue;
      const dq = hyp(q.x - u.x, q.y - u.y);
      if (dq < 3) { u.path.shift(); continue; }
      const s = Math.min(dq, Math.max(u.speed, me.speed) * dt);
      const r = C.moveCircle(G.world, u, (q.x - u.x) / dq * s, (q.y - u.y) / dq * s, K.R_BODY);
      u.facing = { x: (q.x - u.x) / dq, y: (q.y - u.y) / dq };
      u.x = r.x; u.y = r.y; u.moving = true;
    }
  }

  // ── 이동 공통 (조사) ────────────────────────────────────
  function ctlUnit() { return (G.chase && (G.scene === 'chase' || G.scene === 'ending' || G.scene === 'defeat-cut')) ? C.ctlUnit(G.chase) : G.units.find((u) => u.id === G.ctlId); }
  function moveControlled(dt) {
    const me = ctlUnit(); if (!me) return;
    const { mx, my } = readStick();
    const m = Math.min(1, hyp(mx, my));
    me.moving = false;
    if (m > 0.05) {
      const sp = me.speed * m * dt;
      const q = C.moveCircle(G.world, me, mx / m * sp, my / m * sp, K.R_BODY);
      if (hyp(q.x - me.x, q.y - me.y) > 0.01) { me.x = q.x; me.y = q.y; me.moving = true; me.facing = { x: mx / m, y: my / m }; }
    } else if (!G.paused) LOG.investigation.standSec = round(LOG.investigation.standSec + dt);
  }
  // 장부 확인: 화면 가득 장부를 펼친 그림
  function drawLedger(c) {
    const L = G.ledger; L.t += 1 / 60;
    c.fillStyle = '#0b0906'; c.fillRect(0, 0, 360, 640);
    c.save(); c.translate(180, 250);
    c.fillStyle = '#d9ccaa'; roundRect(c, -165, -170, 160, 330, 6); c.fill(); roundRect(c, 5, -170, 160, 330, 6); c.fill();
    c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(-6, -170, 12, 330);
    // 세로 글줄 (먹선)
    c.strokeStyle = 'rgba(40,30,20,.55)'; c.lineWidth = 1.4;
    for (let x = -150; x < -20; x += 13) { c.beginPath(); c.moveTo(x, -150); c.lineTo(x, -150 + 60 + ((x * 7) % 90 + 90) % 90); c.stroke(); }
    // 봉인처 표시 — 서낭고개 · 폐사찰 · 그 밖의 봉인처
    c.fillStyle = '#7a1f1f'; c.font = '12px serif'; c.textAlign = 'left';
    const marks = [[-140, 30, '서낭고개'], [-80, 90, '폐사찰'], [-120, 130, '…'], [-60, 10, '…']];
    for (const [x, y, t] of marks) { c.beginPath(); c.arc(x, y, 4, 0, 7); c.fill(); c.fillText(t, x + 8, y + 4); }
    // 오른쪽 장: 뜯긴 자국
    c.fillStyle = '#0b0906';
    c.beginPath(); c.moveTo(60, -170); for (let y = -170; y <= 160; y += 12) c.lineTo(60 + ((y * 13) % 9 + 9) % 9 - 4, y); c.lineTo(170, 160); c.lineTo(170, -170); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(40,30,20,.5)';
    for (let x = 18; x < 50; x += 13) { c.beginPath(); c.moveTo(x, -150); c.lineTo(x, 40); c.stroke(); }
    // 넘기던 소운의 손이 뜯긴 자국에서 멈춘다
    const hx = Math.min(56, -120 + L.t * 110);
    c.fillStyle = 'rgba(30,22,16,.55)'; c.beginPath(); c.ellipse(hx, 30, 16, 26, 0.2, 0, 7); c.fill();
    c.restore();
  }

  // [기획자 결정: 옆·뒤 틈 안내] 성문에서 일하는 운반자와 조종 인물의 각도 — 'side'(옆·뒤, 들어간다) / 'front'(±60°, 막힌다)
  function flankGap(st) {
    const r = st.runner, me = C.ctlUnit(st);
    if (!me || me.down || r.subdued || !C.runnerWorking(r)) return null;
    const d = hyp(me.x - r.x, me.y - r.y);
    if (d > 140 || d < 1) return null;
    const v = { x: (me.x - r.x) / d, y: (me.y - r.y) / d }, f = r.facing;
    const dot = v.x * f.x + v.y * f.y;
    return { zone: dot < -K.BACK_COS ? 'side' : 'front', d, v, side: (f.x * v.y - f.y * v.x) >= 0 ? 1 : -1 };
  }

  // ── 카메라: 조종 인물을 45% 높이에, 운반자가 260u 안이면 둘의 가운데 ─────

      c.beginPath(); c.moveTo(u.x - 5, y + h); c.lineTo(u.x, y + h + 7); c.lineTo(u.x + 5, y + h); c.fill();
      c.fillStyle = '#1b1b1b'; c.textAlign = 'center';
      lines.forEach((l, i) => c.fillText(l, x, y + 18 + i * 17));
      c.restore();
    }
  }
  function wrap(c, text, maxW) { const out = []; let cur = ''; for (const ch of text) { if (c.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; } else cur += ch; } if (cur) out.push(cur); return out; }
  // 화면 밖: 운반자 = 주황 화살표 + 거리, 빗장 푸는 성문 = 가장자리 고리
  function drawOffscreen(c) {
    const st = G.chase, r = st.runner, me = C.ctlUnit(st);
    const toScreen = (x, y) => ({ x: x - G.cam.x, y: y - G.cam.y });
    const top = 80, bot = 576;
    const p = toScreen(r.x, r.y);
    if (p.y < top || p.y > bot || p.x < 0 || p.x > 360) {
      const x = Math.max(20, Math.min(340, p.x)), y = Math.max(top + 12, Math.min(bot - 12, p.y));
      const a = Math.atan2(p.y - y, p.x - x);
      c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2); c.fillStyle = COLORS.runner;
      c.beginPath(); c.moveTo(0, -12); c.lineTo(11, 7); c.lineTo(-11, 7); c.closePath(); c.fill(); c.restore();
      if (me) { c.fillStyle = COLORS.runner; c.font = 'bold 12px sans-serif'; c.textAlign = 'center'; c.fillText(Math.round(hyp(r.x - me.x, r.y - me.y)) + 'u', x, y + (p.y < top ? 24 : -16)); }
    }
    for (const k of ['N', 'S']) {
      const f = r.latch[k] / K.LATCH_T;
      if (f <= 0) continue;
      const g = S.GATES[k], q = toScreen(g.latch[0], g.latch[1]);
      if (q.y >= top && q.y <= bot) continue;
      const y = q.y < top ? top + 18 : bot - 18, x = 40;
      c.save(); c.lineWidth = 5; c.strokeStyle = 'rgba(0,0,0,.6)'; c.beginPath(); c.arc(x, y, 14, 0, 7); c.stroke();
      c.strokeStyle = f >= 0.7 ? '#e0583a' : '#e8d3a0'; c.beginPath(); c.arc(x, y, 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); c.stroke();
      c.fillStyle = '#fff'; c.font = '10px sans-serif'; c.textAlign = 'center'; c.fillText(k === 'N' ? '북' : '남', x, y + 4); c.restore();
    }
  }
  function drawStick(c) {
    if (!G.stick) return;
    const s = G.stick, dx = s.x - s.ox, dy = s.y - s.oy, d = hyp(dx, dy), R = 44;
    const kx = d > R ? s.ox + dx / d * R : s.x, ky = d > R ? s.oy + dy / d * R : s.y;
    c.save(); c.globalAlpha = 0.45; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(s.ox, s.oy, R, 0, 7); c.stroke();
    c.globalAlpha = 0.65; c.fillStyle = '#fff'; c.beginPath(); c.arc(kx, ky, 17, 0, 7); c.fill(); c.restore();
  }

  // ── HUD · 버튼 · 초상 ───────────────────────────────────
  function updatePortraits() {
    const inChase = !!G.chase && ['chase', 'ending', 'defeat', 'defeat-cut'].includes(G.scene);
    const us = inChase ? G.chase.units : G.units;
    const ctl = inChase ? G.chase.control : G.ctlId;
    for (const id in POR) {
      const el = POR[id], u = us.find((x) => x.id === id);
      const isSol = id.startsWith('sol');
      el.classList.toggle('hidden', isSol && !inChase);
      el.classList.toggle('locked', G.scene === 'room');
      $('porDiv').style.display = inChase ? '' : 'none';
      if (!u) continue;
      el.classList.toggle('ctl', !isSol && id === ctl);
      el.classList.toggle('down', !!u.down || (isSol && u.downT > 0));
      el.querySelector('.ring2').style.setProperty('--hp', Math.round(u.hp / u.maxHp * 100) + '%');
      if (isSol) el.querySelector('.tag').textContent = u.gate ? (u.gate === 'N' ? '북' : '남') : u.order === 'follow' ? '따름' : DEF[id].short;
    }
  }
  function updateHud() {
    const inChase = G.chase && G.scene === 'chase';
    const sk = $('btnSkill'), dg = $('btnDodge');
    let label = '살피기', sub = '', dim = false, pulse = false;
    if (G.scene === 'room') { dim = !nearestSpot(); }
    else if (G.scene === 'alley' || G.scene === 'runner-appear') { dim = true; }
    else if (inChase) {
      const st = G.chase, me = C.ctlUnit(st), k = C.actionKind(st);
      if (k === 'pick') { label = '수습'; sub = '길게 누르기'; }
      else { label = '공격'; sub = me ? DEF[me.id].atk.kind === 'melee' ? '연타' : '자동 조준' : ''; }
      if (me && !st.runner.subdued && hyp(st.runner.x - me.x, st.runner.y - me.y) <= 50 + 32) pulse = true;
      sk.style.display = 'flex'; dg.style.display = 'flex';
      if (me) {
        sk.querySelector('span').textContent = DEF[me.id].skill.name;
        sk.querySelector('.cd').style.setProperty('--p', Math.round(me.skillCd / K.SKILL_CD * 100) + '%');
        dg.querySelector('.cd').style.setProperty('--p', Math.round(me.dodgeCd / K.DODGE_CD * 100) + '%');
      }
      const r = st.runner, rem = Math.max(0, K.TIME_LIMIT - st.t);
      $('timer').textContent = `${Math.floor(rem / 60)}:${String(Math.floor(rem % 60)).padStart(2, '0')}`;
      $('timer').classList.toggle('low', rem < 30);
      for (const kk of ['N', 'S']) {
        const f = r.latch[kk] / K.LATCH_T, el = $(kk === 'N' ? 'ringN' : 'ringS');
        el.querySelector('i').style.setProperty('--p', Math.round(f * 100) + '%');
        el.querySelector('b').textContent = `${kk === 'N' ? '북' : '남'} ${Math.round(f * 100)}%`;
        el.classList.toggle('hot', f >= 0.7 || (C.runnerWorking(r) && r.target === kk));
      }
      $('gauge').querySelector('.fill').style.width = Math.round(r.gauge / K.GAUGE * 100) + '%';
    }
    if (!inChase) { sk.style.display = 'none'; dg.style.display = 'none'; }
    if (label !== G.lastActionLabel) { btnA.classList.add('flash'); setTimeout(() => btnA.classList.remove('flash'), 500); G.lastActionLabel = label; }
    btnA.querySelector('span').textContent = label; btnA.querySelector('small').textContent = sub;
    btnA.classList.toggle('dim', dim); btnA.classList.toggle('pulse', pulse);
    { const gp = inChase && G.chase ? flankGap(G.chase) : null; btnA.classList.toggle('gap', !!gp && gp.zone === 'side' && gp.d <= 96); } // 옆·뒤 틈 + 팔 길이 근처: 공격 버튼 노란 테
    btnA.style.display = ['ending', 'end', 'defeat', 'defeat-cut'].includes(G.scene) ? 'none' : 'flex';
    updatePortraits();
  }

  // ── 메인 루프 ──────────────────────────────────────────
  let lastT = performance.now(), acc = 0;
  const STEP = 1 / 60;
  function frame(now) {
    const real = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;
    G.time += real;
    if (G.hitstop > 0) { G.hitstop -= real; acc = 0; }
    else if (!G.paused && !G.logOpen) {
      acc += real;
      let n = 0;
      while (acc >= STEP && n++ < 8) { tick(STEP); acc -= STEP; if (G.hitstop > 0) { acc = 0; break; } }
    } else acc = 0;
    for (const b of G.bubbles) b.t -= real;
    G.bubbles = G.bubbles.filter((b) => b.t > 0);
    for (const e of G.effects) e.t -= real;
    G.effects = G.effects.filter((e) => e.t > 0);
    for (const g of G.guides) g.t -= real;
    G.guides = G.guides.filter((g) => g.t > 0);
    if (G.zoomTarget) { G.zoomTarget.t -= real; if (G.zoomTarget.t <= 0) G.zoomTarget = null; }
    if (G.messenger && G.messenger.moving) { const m = G.messenger, d = hyp(m.tx - m.x, m.ty - m.y); if (d > 1) { const s = Math.min(d, 220 * real); m.y += (m.ty - m.y) / d * s; m.x += (m.tx - m.x) / d * s; } else m.moving = false; }
    updateCam(real);
    updateHud();
    draw();
    requestAnimationFrame(frame);
  }
  function tick(dt) {
    switch (G.scene) {
      case 'room': updateRoom(dt); break;
      case 'alley': updateAlley(dt); break;
      case 'chase': updateChase(dt); break;
    }
    G.attackPressed = false;
  }
  function round(v) { return Math.round(v * 100) / 100; }

  function onAssets() {
    buildCityBG(); buildRoomBG();
    G.graph = C.buildGraph(S);
    buildPortraits();
    // 재도전·플레이테스트용 바로가기: ?start=chase 면 추격부터 (기본은 메뉴 없이 객사 방부터)
    if (/[?&]start=chase\b/.test(location.search)) { TIMES.start = G.time; LOG.investigation.skipped = true; startChase(false); }
    else enterRoom();
    requestAnimationFrame(frame);
  }

  // QA 용 (화면 확인 스크립트가 상태를 읽는다. 게임 규칙에는 쓰지 않음)
  window.__pilot = { G, LOG, S, C, showLog };
})();
</script>
