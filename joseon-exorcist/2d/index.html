<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>조선 퇴마전 2D 파일럿 — 사라진 장부</title>
<style>
  :root {
    --ink: rgba(14, 17, 22, 0.86);
    --ink-soft: rgba(14, 17, 22, 0.62);
    --hanji: rgba(231, 220, 196, 0.28);
    --text: #f3efe6;
    --gold: #e8d3a0;
    --warn: #e0583a;
    --ally: #3fc1b0;
    --soldier: #4b63b8;
    --runner: #f08a24;
  }
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "WenQuanYi Zen Hei", sans-serif; color: var(--text); }
  #stage { position: absolute; left: 0; top: 0; width: 360px; height: 640px; transform-origin: 0 0; overflow: hidden; background: #0c1016; }
  canvas#view { position: absolute; left: 0; top: 0; width: 360px; height: 640px; }
  .panel { background: var(--ink); border: 1px solid var(--hanji); border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  #hudTop { position: absolute; left: 0; top: 0; width: 360px; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-sizing: border-box; background: linear-gradient(var(--ink), var(--ink-soft)); border-bottom: 1px solid var(--hanji); font-size: 13px; }
  #objective { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 270px; }
  #timer { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; }
  #timer.low { color: var(--warn); }
  #gateBars { position: absolute; left: 0; top: 40px; width: 360px; height: 24px; display: none; align-items: center; gap: 8px; padding: 0 10px; box-sizing: border-box; background: var(--ink-soft); font-size: 11px; }
  .gbar { flex: 1; display: flex; align-items: center; gap: 5px; }
  .gbar .track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .gbar .fill { height: 100%; width: 0; background: #a9a39a; border-radius: 4px; }
  .gbar.hot .fill { background: var(--warn); animation: pulse .8s infinite; }
  .gbar.hot .lab { color: var(--warn); }
  @keyframes pulse { 50% { opacity: .55; } }
  #notebook { position: absolute; left: 8px; top: 46px; width: 250px; padding: 6px 9px; font-size: 11px; line-height: 1.5; display: none; }
  #notebook .concl { margin-top: 3px; padding-top: 3px; border-top: 1px dashed var(--hanji); color: var(--gold); }
  #notebook .concl.done { color: #fff; font-weight: 700; }
  #banner { position: absolute; left: 20px; right: 20px; top: 250px; text-align: center; font-size: 20px; font-weight: 700; color: var(--gold); padding: 14px 8px; opacity: 0; pointer-events: none; transition: opacity .3s, top .6s; }
  #banner.show { opacity: 1; }
  #banner small { display: block; font-size: 11px; font-weight: 400; color: #cfc6b3; margin-bottom: 4px; letter-spacing: 2px; }
  #toast { position: absolute; left: 50%; top: 72px; transform: translateX(-50%); width: max-content; max-width: 290px; text-align: center; font-size: 12px; line-height: 1.4; padding: 5px 12px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .rbtn { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; color: var(--text); background: rgba(20, 24, 30, .78); border: 2px solid rgba(232, 211, 160, .55); box-shadow: 0 2px 8px rgba(0,0,0,.5); touch-action: none; }
  #btnAction { left: 258px; top: 478px; width: 76px; height: 76px; font-size: 15px; }
  #btnAction.dim { opacity: .38; }
  #btnAction.hot { border-color: var(--runner); background: rgba(70, 38, 12, .85); }
  #btnSkill { left: 268px; top: 408px; width: 56px; height: 56px; font-size: 12px; display: none; overflow: hidden; }
  #btnSkill .cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.66) var(--p, 0%), transparent 0); pointer-events: none; }
  #btnSkill span { position: relative; }
  #stickZone { position: absolute; left: 0; top: 397px; width: 230px; height: 179px; touch-action: none; }
  #portraits { position: absolute; left: 0; top: 576px; width: 360px; height: 64px; display: flex; align-items: center; justify-content: center; gap: 4px; background: linear-gradient(var(--ink-soft), var(--ink)); border-top: 1px solid var(--hanji); }
  .por { position: relative; width: 50px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; touch-action: none; }
  .por .ring { width: 46px; height: 46px; border-radius: 50%; padding: 3px; box-sizing: border-box; background: conic-gradient(var(--ally) var(--hp, 100%), rgba(255,255,255,.12) 0); }
  .por.sol .ring { background: conic-gradient(var(--soldier) var(--hp, 100%), rgba(255,255,255,.12) 0); }
  .por img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: 50% 15%; background: #20262e; display: block; }
  .por .cdbar { width: 36px; height: 3px; margin-top: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .por .cdbar i { display: block; height: 100%; width: 100%; background: var(--gold); }
  .por .tag { position: absolute; top: -3px; right: -2px; font-size: 9px; background: var(--ally); color: #062520; border-radius: 6px; padding: 0 4px; font-weight: 700; display: none; }
  .por.ctl .ring { box-shadow: 0 0 0 2px var(--gold); }
  .por.ctl .tag { display: block; }
  .por.down { filter: grayscale(1) brightness(.5); }
  .por.locked { opacity: .45; }
  .por.hidden { display: none; }
  .por.sel .ring { box-shadow: 0 0 0 3px #fff; }
  .divider { width: 1px; height: 40px; background: var(--hanji); margin: 0 4px; }
  #board { position: absolute; left: 0; top: 312px; width: 360px; height: 264px; display: none; background: rgba(12, 15, 20, .93); border-top: 1px solid var(--gold); }
  #boardHead { position: relative; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 6px; box-sizing: border-box; font-size: 13px; }
  #slowBar { position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: rgba(255,255,255,.08); }
  #slowBar i { display: block; height: 100%; width: 100%; background: var(--gold); }
  #slowBar.auto i { background: #9fd8cf; }
  #boardHead .title { flex: 1; text-align: center; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { min-width: 56px; height: 44px; border-radius: 8px; border: 1px solid rgba(232,211,160,.5); background: rgba(40, 44, 52, .9); color: var(--text); font-size: 13px; font-family: inherit; padding: 0 8px; }
  .hbtn:disabled { opacity: .35; }
  .hbtn.go { border-color: var(--ally); }
  #boardBody { position: relative; height: 220px; }
  #boardBody svg { position: absolute; inset: 0; }
  .node { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .node i { width: 30px; height: 30px; border-radius: 50%; background: #2b3139; border: 2px solid #8f8a80; box-sizing: border-box; display: block; }
  .node b { position: absolute; top: 34px; font-size: 9.5px; font-weight: 400; white-space: nowrap; color: #d6cfbf; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .node.gate i { border-color: var(--gold); }
  .node.occ i { border-color: #fff; }
  .node.off { opacity: .22; pointer-events: none; }
  .node:active i { background: #505a66; }
  #dialog { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 132px; display: none; padding: 10px 12px 10px 92px; box-sizing: border-box; }
  #dialog img { position: absolute; left: 10px; top: 12px; width: 70px; height: 70px; border-radius: 10px; object-fit: cover; object-position: 50% 12%; background: #20262e; }
  #dialog .who { font-size: 13px; color: var(--gold); margin-bottom: 6px; font-weight: 700; }
  #dialog .what { font-size: 16px; line-height: 1.5; min-height: 48px; }
  #dialog .next { position: absolute; right: 12px; bottom: 8px; font-size: 11px; color: #bdb4a2; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .75s; }
  #fade.on { opacity: 1; }
  #fade.hold { pointer-events: auto; }
  #endCard { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; }
  #endCard .ch { font-size: 26px; letter-spacing: 3px; color: #e9e4d8; opacity: 0; transition: opacity 1.4s; }
  #endCard .res { margin-top: 26px; font-size: 13px; color: #bdb4a2; opacity: 0; transition: opacity 1s; }
  #endCard .btns { margin-top: 24px; display: flex; gap: 10px; opacity: 0; transition: opacity 1s; }
  #endCard.show .ch, #endCard.show2 .res, #endCard.show2 .btns { opacity: 1; }
  #result { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; background: rgba(6, 8, 11, .96); padding-top: 12px; box-sizing: border-box; }
  #result h2 { margin: 2px 0 2px; font-size: 18px; color: var(--warn); }
  #result p { margin: 0 0 6px; font-size: 12px; color: #cfc6b3; text-align: center; padding: 0 14px; }
  #resultMap { width: 330px; height: 452px; }
  #result .btns { display: flex; gap: 10px; margin-top: 8px; }
  .bigbtn { height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--gold); background: #2a2419; color: var(--text); font-size: 15px; font-family: inherit; }
  .bigbtn.sub { border-color: #6b6559; background: #1d2024; font-size: 13px; }
  #logPanel { position: absolute; inset: 20px 10px; display: none; flex-direction: column; padding: 10px; }
  #logPanel textarea { flex: 1; width: 100%; box-sizing: border-box; background: #0c0f13; color: #d8e3dc; border: 1px solid #333; border-radius: 6px; font: 10px/1.35 ui-monospace, Menlo, monospace; resize: none; }
  #logPanel .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  #logPanel h3 { margin: 0 0 6px; font-size: 13px; color: var(--gold); }
  #logBtn { position: absolute; right: 60px; top: 0; display: none; height: 44px; font-size: 11px; min-width: 44px; padding: 0 8px; opacity: .8; border: none; background: transparent; }
  #logBtn::before { content: ''; position: absolute; left: 4px; right: 4px; top: 9px; bottom: 9px; border: 1px solid rgba(232,211,160,.5); border-radius: 8px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hudTop"><span id="objective"></span><span id="timer"></span></div>
  <div id="gateBars">
    <div class="gbar" id="gbN"><span class="lab">북▲</span><div class="track"><div class="fill"></div></div></div>
    <div class="gbar" id="gbS"><span class="lab">남▼</span><div class="track"><div class="fill"></div></div></div>
  </div>
  <div id="notebook" class="panel"></div>
  <div id="toast" class="panel"></div>
  <div id="banner" class="panel"></div>
  <div id="stickZone"></div>
  <div id="btnSkill" class="rbtn"><div class="cd"></div><span>기술</span></div>
  <div id="btnAction" class="rbtn dim">—</div>
  <div id="board">
    <div id="boardHead">
      <button class="hbtn go" id="bCtl">조종</button>
      <span class="title" id="bTitle"></span>
      <button class="hbtn" id="bFollow">따라와</button>
      <button class="hbtn" id="bClose">닫기</button>
      <div id="slowBar"><i></i></div>
    </div>
    <div id="boardBody"><svg id="boardSvg" width="360" height="220"></svg></div>
  </div>
  <div id="portraits"></div>
  <div id="dialog" class="panel"><img alt=""><div class="who"></div><div class="what"></div><div class="next">▼ 눌러서 넘기기</div></div>
  <button class="hbtn" id="logBtn">기록</button>
  <div id="result">
    <h2 id="resTitle"></h2>
    <p id="resWhy"></p>
    <canvas id="resultMap" width="660" height="904"></canvas>
    <div class="btns"><button class="bigbtn" id="btnRetry">추격부터 다시</button><button class="bigbtn sub" id="btnLog1">플레이 기록</button></div>
  </div>
  <div id="fade"></div>
  <div id="endCard">
    <div class="ch"></div>
    <div class="res"></div>
    <div class="btns"><button class="bigbtn" id="btnRestart">처음부터</button><button class="bigbtn sub" id="btnLog2">플레이 기록</button></div>
  </div>
  <div id="logPanel" class="panel">
    <h3>플레이 기록 (JSON) — 재미 가설 H1~H4 확인용</h3>
    <textarea id="logText" readonly></textarea>
    <div class="row"><button class="hbtn" id="logCopy">복사</button><button class="hbtn" id="logClose">닫기</button></div>
  </div>
</div>
<script src="stage-ch5.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const S = window.STAGE_CH5, C = window.JC2D, K = C.K;
  const $ = (id) => document.getElementById(id);
  const hyp = Math.hypot;
  const ASSET = '../assets/';

  // ── 화면 크기: 360×640 논리 화면을 창에 맞춰 늘인다 ─────────────
  const stageEl = $('stage'), canvas = $('view'), ctx = canvas.getContext('2d');
  let DPR = 1, UI = 1;
  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    UI = Math.min(w / 360, h / 640);
    stageEl.style.transform = `translate(${(w - 360 * UI) / 2}px, ${(h - 640 * UI) / 2}px) scale(${UI})`;
    DPR = Math.min(2, (window.devicePixelRatio || 1) * UI);
    canvas.width = Math.round(360 * DPR); canvas.height = Math.round(640 * DPR);
  }
  window.addEventListener('resize', fit);
  fit();

  // ── 그림 ───────────────────────────────────────────────
  const IMG = {};
  const imgList = {
    yoon: 'characters/yoon_battle.webp', hangyeol: 'characters/hangyeol_battle.webp', yeoul: 'characters/yeoul_battle.webp', soun: 'characters/soun_battle.webp',
    sol: 'npcs/soldier_battle.webp', official: 'npcs/official_battle.webp', runner: 'enemies/ledger_runner.webp', gwihwa: 'enemies/gwihwa.webp',
    road: 'environment/ch5/env_city_road.webp', alley: 'environment/ch5/env_city_alley.webp', wall: 'environment/ch5/env_city_wall.webp',
    gate: 'environment/ch5/env_city_gate.webp', gaeksa: 'environment/ch5/env_point_gaeksa.webp', office: 'environment/ch5/env_block_office.webp', town: 'environment/ch5/env_block_town.webp',
  };
  let loaded = 0;
  const total = Object.keys(imgList).length;
  for (const [k, src] of Object.entries(imgList)) {
    const im = new Image();
    im.onload = im.onerror = () => { loaded++; if (loaded === total) onAssets(); };
    im.src = ASSET + src;
    IMG[k] = im;
  }
  const ok = (im) => im && im.complete && im.naturalWidth > 0;

  const COLORS = { ally: '#3fc1b0', soldier: '#4b63b8', runner: '#f08a24', gwihwa: '#bfe6ff', official: '#9a9a9a' };
  const HERO_IDS = S.HEROES.map((h) => h.id);
  const NAME = {}; S.HEROES.concat(S.SOLDIERS).forEach((d) => { NAME[d.id] = d.name; });

  // ── 소리 (효과음 몇 개만) ─────────────────────────────────
  let AC = null;
  function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
  function tone(freq, dur, type, vol, when) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (when || 0);
    const o = a.createOscillator(), gn = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.55), t + dur);
    gn.gain.setValueAtTime(vol || 0.2, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, when, lp) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (when || 0);
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    let seed = 7; for (let i = 0; i < len; i++) { seed = (seed * 16807) % 2147483647; d[i] = (seed / 2147483647 * 2 - 1) * (1 - i / len); }
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 900;
    const gn = a.createGain(); gn.gain.value = vol || 0.2;
    src.connect(f).connect(gn).connect(a.destination); src.start(t);
  }
  const SFX = {
    heart() { tone(62, 0.16, 'sine', 0.35); tone(55, 0.18, 'sine', 0.28, 0.2); },
    alert() { tone(880, 0.12, 'triangle', 0.12); },
    grab() { noise(0.12, 0.25, 0, 1400); },
    shake() { noise(0.2, 0.3, 0, 700); tone(160, 0.15, 'sawtooth', 0.08); },
    shot() { noise(0.08, 0.2, 0, 3000); tone(1200, 0.1, 'triangle', 0.06); },
    barrier() { tone(520, 0.4, 'sine', 0.12); tone(780, 0.4, 'sine', 0.06, 0.05); },
    gwihwa() { tone(300, 0.6, 'sine', 0.12); tone(460, 0.6, 'triangle', 0.05, 0.1); },
    hit() { noise(0.07, 0.2, 0, 2000); },
    knock(when) { noise(0.09, 0.9, when, 260); tone(70, 0.12, 'sine', 0.6, when); },
    step() { noise(0.03, 0.05, 0, 500); },
    ui() { tone(660, 0.05, 'triangle', 0.05); },
  };

  // ── 장면 공통 상태 ────────────────────────────────────────
  const G = {
    scene: 'boot', paused: false, cam: { x: 0, y: 0 }, camTarget: null, camLock: null, time: 0,
    world: null, units: [], ctlId: 'yoon', bubbles: [], effects: [], ripples: [], guides: [],
    input: { mx: 0, my: 0, action: false, key: { x: 0, y: 0 } },
    stick: null, skillDrag: null, board: { open: false, who: null, openedAt: 0 },
    chase: null, graph: null, inv: null, room: null, yard: null, ending: null,
    heartT: 0, stepT: 0, idleFrom: null,
  };
  const LOG = {
    version: '2d-pilot-1', brief: 'DESIGN-BRIEF 14장 H1~H4',
    investigation: { yardSec: null, gaeksaSec: null, alleySec: null, totalSec: null, idleSec: 0, roomOrder: [], traceAt: {}, forkSplit: false, deadEndCheckedBy: null, deadEndCheckedByControlled: null, sendCommands: [] },
    chases: [], retries: [], ending: null,
  };
  const TIMES = {};

  // ── 도시 걷기 세계 · 길 그래프 ──────────────────────────────
  const CITY = C.makeWorld(S.WALK, S.BLOCKS, S.MARKET);
  const YARDW = C.makeWorld(S.YARD_SCENE.walk, S.YARD_SCENE.blocks, null);
  const ROOMW = C.makeWorld(S.ROOM_SCENE.walk, S.ROOM_SCENE.blocks, null);

  function mkUnit(id, x, y) {
    const def = S.HEROES.find((h) => h.id === id) || S.SOLDIERS.find((s) => s.id === id);
    return C.makeUnit(def, def.skill !== undefined ? 'hero' : 'soldier', x, y);
  }

  // ── 그리기: 정적 배경을 한 번 그려 둔다 ─────────────────────
  const BG = {};
  // 오른쪽 28px 도시 띠가 동쪽 골목(x 330~360)을 가리지 않게, 맵은 332px 폭에 맞춰 그린다 (1u = 0.92px)
  let WS = 1;
  function setWS() { WS = G.bg && G.bg === BG.city ? 332 / 360 : 1; }
  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function stretch(c, im, x, y, w, h, alpha) {
    if (!ok(im)) return;
    c.save(); c.globalAlpha = alpha; c.drawImage(im, 0, 0, im.naturalWidth, im.naturalHeight, x, y, w, h); c.restore();
  }
  function drawRoof(c, b, seed) {
    const w = b.x1 - b.x0, h = b.y1 - b.y0;
    const pal = { office: ['#222a34', '#161b22'], gaeksa: ['#29302a', '#1a1e18'], town: ['#23272c', '#171a1e'], store: ['#2a2723', '#1a1815'], wall: ['#2e2e2c', '#20201e'] }[b.kind] || ['#23272c', '#171a1e'];
    c.save();
    c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    roundRect(c, b.x0 + 2, b.y0 + 2, w - 4, h - 4, Math.min(10, w / 4));
    const gr = c.createLinearGradient(b.x0, b.y0, b.x1, b.y1); gr.addColorStop(0, pal[0]); gr.addColorStop(1, pal[1]);
    c.fillStyle = gr; c.fill();
    c.restore();
    if (b.kind === 'wall') return;
    c.save();
    roundRect(c, b.x0 + 2, b.y0 + 2, w - 4, h - 4, Math.min(10, w / 4)); c.clip();
    // 지붕이 여러 채로 나뉜 덩어리 (크기 제각각)
    let yy = b.y0 + 4, k = seed;
    while (yy < b.y1 - 20) {
      k = (k * 9301 + 49297) % 233280;
      const hh = 34 + (k % 60);
      const inset = 3 + (k % 7);
      c.fillStyle = 'rgba(255,255,255,0.035)';

  function drawUnit(c, u, color, opt) {
    opt = opt || {};
    const bob = u.moving ? Math.sin(G.time * 14 + (u.x + u.y) * 0.1) * 1.5 : 0;
    const tilt = u.moving ? Math.max(-0.14, Math.min(0.14, Math.cos(u.facing || 0) * 0.14)) : 0;
    const a = opt.alpha == null ? 1 : opt.alpha;
    // 발밑 원 24u + 밝은 외곽선
    c.save(); c.globalAlpha = a;
    if (opt.guardRing) {
      c.strokeStyle = color; c.globalAlpha = a * 0.55; c.lineWidth = 1.5; c.setLineDash([3, 3]);
      c.beginPath(); c.arc(u.x, u.y, K.R_GUARD, 0, 7); c.stroke(); c.setLineDash([]); c.globalAlpha = a;
    }
    c.fillStyle = color; c.globalAlpha = a * 0.55;
    c.beginPath(); c.ellipse(u.x, u.y, 12, 12, 0, 0, 7); c.fill();
    c.globalAlpha = a; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.2; c.stroke();
    const im = opt.img || tokenImg(u.id);
    if (ok(im)) {
      c.translate(u.x, u.y - 12 + bob);
      c.rotate(tilt);
      if (opt.silhouette) { c.filter = 'brightness(0.18) contrast(1.2)'; }
      if (opt.glow) { c.globalCompositeOperation = 'lighter'; }
      c.drawImage(im, -18, -20, 36, 36);
      c.filter = 'none';

    c.restore();

  function say(lines, opts) {
    opts = opts || {};

  function nextLine() {
    if (!dlg) return;

    dlg.i++;

    if (dlg.i >= dlg.lines.length) {
      el.style.display = 'none';
      const r = dlg.resolve; dlg = null; G.paused = false; r();
      return;
    }
    const [who, text] = dlg.lines[dlg.i];
    if (who === 'pause') {
      // "(잠깐)" 1.5초 동안 대사 상자 비움
      el.querySelector('.who').textContent = ''; el.querySelector('.what').textContent = '';
      el.querySelector('img').style.visibility = 'hidden'; el.querySelector('.next').style.visibility = 'hidden';
      dlg.lockUntil = performance.now() + 1500;

      return;

      dlg.lockUntil = performance.now() + 1000;

    }

  function readStick() {
    let mx = 0, my = 0;
    if (G.stick) {
      const dx = G.stick.x - G.stick.ox, dy = G.stick.y - G.stick.oy, d = hyp(dx, dy);
      const R = 44;
      if (d > 4) { const m = Math.min(1, d / R); mx = dx / d * m; my = dy / d * m; }

  function worldToBoard(x, y) {
    const lerp = (v, xs, ys) => { for (let i = 0; i < xs.length - 1; i++) if (v <= xs[i + 1] || i === xs.length - 2) { const t = Math.max(0, Math.min(1, (v - xs[i]) / (xs[i + 1] - xs[i]))); return ys[i] + (ys[i + 1] - ys[i]) * t; } return ys[0]; };
    return { x: lerp(x, [15, 180, 345], BX), y: lerp(y, [0, 480, 1020, 1680, 2160], [BY(0), BY(1), BY(2), BY(3), BY(4)]) };
  }
  function buildBoard() {
    const svg = $('boardSvg');
    const L = (x1, y1, x2, y2, w) => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="rgba(214,207,191,.3)" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
    let s = '';
    // 골목(가는 선) · 큰길(굵은 선). 칸이 아니라 길 선 위의 매듭 (11장)
    s += L(BX[0], BY(0), BX[0], BY(4), 3) + L(BX[2], BY(0), BX[2], BY(2), 3) + L(BX[2], BY(2), BX[2], BY(4), 3);
    s += L(BX[1], BY(0), BX[1], BY(4), 9);
    for (const r of [0, 1, 3, 4]) s += L(BX[0], BY(r), BX[2], BY(r), r === 0 || r === 4 ? 6 : 3);
    s += L(BX[0], BY(2), BX[1], BY(2), 3) + L(BX[1], BY(2), BX[2], BY(2), 5);
    s += L(BX[0] + 30, BY(1), BX[0] + 30, BY(0) + 22, 2);
    s += '<g id="bDots"></g>';
    svg.innerHTML = s;
    const body = $('boardBody');
    body.querySelectorAll('.node').forEach((n) => n.remove());
    const all = S.COMMAND_NODES.concat([S.EXTRA_INVESTIGATION_NODE]);
    for (const def of all) {
      const p = boardXY(def);
      const n = document.createElement('div');
      n.className = 'node' + (def.id === 'NG' || def.id === 'SG' ? ' gate' : '');
      n.dataset.id = def.id;
      n.style.left = p.x + 'px'; n.style.top = p.y + 'px';
      n.innerHTML = `<i></i><b>${def.label}</b>`;
      n.addEventListener('pointerdown', (e) => { e.preventDefault(); onNode(def.id); });
      body.appendChild(n);
    }
  }
  $('bClose').addEventListener('pointerdown', (e) => { e.preventDefault(); closeBoard(); });
  $('bCtl').addEventListener('pointerdown', (e) => { e.preventDefault(); onSwitch(); });
  $('bFollow').addEventListener('pointerdown', (e) => { e.preventDefault(); onFollow(); });

  function unitsNow() { return G.chase ? G.chase.units : G.units; }
  // [2차 수정] 명령판 느린 시간: 초동 판 실제 3초 + 그 뒤 한 추격 합계 실제 6초 (재충전 없음)
  const SLOW = { INITIAL: 3, POOL: 6, SCALE: 0.3 };
  function resetSlow() { G.slow = { initial: SLOW.INITIAL, pool: SLOW.POOL }; }
  function openBoard(who) {
    G.board = { open: true, who, openedAt: performance.now(), auto: false };
    SFX.ui();
    renderBoard();
  }
  function closeBoard() {
    if (!G.board.open) return;
    G.board.open = false;
    renderBoard();
  }
  function renderBoard() {
    const open = G.board.open;
    $('board').style.display = open ? 'block' : 'none';
    for (const id in POR) POR[id].classList.toggle('sel', open && G.board.who === id);
    if (!open) return;
    const who = G.board.who, u = unitsNow().find((x) => x.id === who);
    const isHero = HERO_IDS.includes(who);
    const ctlId = G.chase ? G.chase.control : G.ctlId;
    const inv = G.scene === 'city-inv';
    $('bTitle').textContent = !u ? '' : u.id === ctlId ? `${NAME[who]} — 지금 조종 중` : `${NAME[who]}에게 명령`;
    $('bCtl').disabled = !isHero || who === ctlId || (u && u.down);
    $('bFollow').style.display = inv ? '' : 'none';
    $('bFollow').disabled = who === ctlId;
    const allowed = inv ? new Set(S.INVESTIGATION_NODES.concat([S.EXTRA_INVESTIGATION_NODE.id])) : new Set(S.COMMAND_NODES.map((n) => n.id));
    document.querySelectorAll('#boardBody .node').forEach((n) => {
      const id = n.dataset.id;
      const show = inv || id !== S.EXTRA_INVESTIGATION_NODE.id;
      n.style.display = show ? '' : 'none';
      n.classList.toggle('off', !allowed.has(id) || who === ctlId || (u && u.down));
    });
    updateBoardDots();
  }
  function updateBoardDots() {
    if (!G.board.open) return;
    const g = $('bDots'); if (!g) return;
    let s = '';
    const occ = {};
    for (const u of unitsNow()) {
      if (u.down) continue;
      if (u.target) occ[u.target] = u.kind === 'soldier' ? COLORS.soldier : COLORS.ally;
      const p = worldToBoard(u.x, u.y);
      s += `<circle cx="${p.x}" cy="${p.y}" r="${u.id === G.board.who ? 5 : 3.5}" fill="${u.kind === 'soldier' ? COLORS.soldier : COLORS.ally}" stroke="#fff" stroke-width="${u.id === G.board.who ? 1.5 : .6}"/>`;
    }
    if (G.chase) {
      const r = G.chase.runner, p = worldToBoard(r.x, r.y);
      const lit = runnerLit();
      const dir = lit ? r.lastDir : (G.lastSeenDir || r.lastDir);
      s += `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${COLORS.runner}" stroke="#fff" stroke-width="1"/>`;
      s += `<path d="M${p.x + dir.x * 8} ${p.y + dir.y * 8} L${p.x + dir.x * 20} ${p.y + dir.y * 20}" stroke="${COLORS.runner}" stroke-width="3" opacity="${lit ? 1 : .35}" stroke-linecap="round"/>`;
    }
    g.innerHTML = s;
    document.querySelectorAll('#boardBody .node').forEach((n) => {
      const c = occ[n.dataset.id];
      n.classList.toggle('occ', !!c);
      n.querySelector('i').style.background = c ? c : '';
    });
  }

  function onPortrait(id) {
    if (G.paused) return;
    if (G.scene !== 'chase' && G.scene !== 'city-inv') { toast(G.scene === 'room' ? '방 안에서는 윤무겸만 움직인다' : '', 1.2); return; }
    const u = unitsNow().find((x) => x.id === id);
    if (!u || u.down) return;
    if (G.board.open && G.board.who === id) { closeBoard(); return; }
    openBoard(id);
  }
  function onNode(nodeId) {
    const who = G.board.who;
    if (G.chase) {
      if (C.command(G.chase, who, nodeId)) { SFX.ui(); bubble(who, '…', 0.8); }
      closeBoard();
    } else if (G.inv) {
      if (C.command(G.inv.st, who, nodeId)) {
        SFX.ui();
        LOG.investigation.sendCommands.push({ t: round(G.time - TIMES.city), unit: who, node: nodeId });
      }
      closeBoard();
    }
  }
  function onSwitch() {
    const who = G.board.who;
    if (G.chase) { if (C.switchControl(G.chase, who)) SFX.ui(); }
    else if (G.inv) { if (C.switchControl(G.inv.st, who)) { G.ctlId = who; SFX.ui(); } }
    closeBoard();
  }
  function onFollow() {
    if (G.inv && C.follow(G.inv.st, G.board.who)) SFX.ui();
    closeBoard();
  }

  // ── 행동 버튼 ───────────────────────────────────────────
  function onAction() {
    if (G.paused) return;
    if (G.scene === 'room') {
      const sp = nearestSpot();
      if (sp) inspect(sp);
    }
  }

  // ═══════════════ 장면 1: 객사 마당 (도입) ═══════════════
  function enterYard() {
    G.scene = 'yard'; G.world = YARDW; G.bg = BG.yard; G.worldH = S.YARD_SCENE.h;
    const s = S.YARD_SCENE.start;
    G.units = HERO_IDS.map((id) => { const u = mkUnit(id, s[id][0], s[id][1]); u.state = id === 'yoon' ? 'controlled' : 'follow'; return u; });
    G.ctlId = 'yoon'; G.trail = [];
    G.yard = { line: 0, lineT: 1.2, doorReady: false, done: false };
    setObjective(S.OBJECTIVES.gaeksa);
    TIMES.start = G.time; TIMES.yard = G.time;
    snapCam();
    updatePortraits();
  }
  function updateYard(dt) {
    const y = G.yard, L = S.LINES.intro;
    moveControlled(dt);
    followers(dt);
    y.lineT -= dt;
    if (y.line < 5) {
      if (y.lineT <= 0) { const [who, text] = L[y.line]; bubble(who, text, 2.1); y.line++; y.lineT = 2.2; }
    }
    const me = ctlUnit(), d = S.YARD_SCENE.door;
    if (!y.done && y.line >= 5 && y.lineT < 1.2 && hyp(me.x - d[0], me.y - d[1]) < 34) {
      y.done = true;
      bubble('yoon', L[5][1], 1.6);
      LOG.investigation.yardSec = round(G.time - TIMES.yard);
      setTimeout(async () => { await fade(true); enterRoom(); await fade(false); }, 1300);
    }
  }

  // ═══════════════ 장면 2: 객사 방 안 (조사) ═══════════════
  function enterRoom() {
    G.scene = 'room'; G.world = ROOMW; G.bg = BG.room; G.worldH = S.ROOM_SCENE.h;
    const sd = S.ROOM_SCENE;
    G.units = HERO_IDS.map((id) => { const p = id === 'yoon' ? sd.start.yoon : sd.companions[id]; const u = mkUnit(id, p[0], p[1]); u.state = id === 'yoon' ? 'controlled' : 'guard'; return u; });
    G.ctlId = 'yoon';
    G.room = { seen: [], concluded: false, exitOpen: false };
    TIMES.room = G.time;
    $('notebook').style.display = 'block';
    renderNotebook();
    snapCam();
    updatePortraits();
  }
  function nearestSpot() {
    if (!G.room) return null;
    const me = ctlUnit();
    let best = null, bd = 44;
    for (const sp of S.ROOM_SCENE.spots) { const d = hyp(me.x - sp.pos[0], me.y - sp.pos[1]); if (d < bd) { bd = d; best = sp; } }
    return best;
  }
  function inspect(sp) {
    const R = G.room;
    if (R.seen.includes(sp.id)) { toast('이미 살핀 곳이다', 1); return; }
    R.seen.push(sp.id);
    LOG.investigation.roomOrder.push(sp.id);
    SFX.ui();
    renderNotebook();
    // 가장 가까운 동료가 반응 (대사 원본에 없는 말은 만들지 않는다 — DESIGN-ISSUES 참고)
    let near = null, nd = 1e9;
    for (const u of G.units) { if (u.id === 'yoon') continue; const d = hyp(u.x - sp.pos[0], u.y - sp.pos[1]); if (d < nd) { nd = d; near = u; } }
    if (near) bubble(near.id, sp.id === 'hook' ? '…!' : '…', 1.2);
    if (!R.concluded && R.seen.length >= 3 && R.seen.includes('hook')) {
      R.concluded = true;
      setTimeout(async () => {
        renderNotebook(true);
        await say(S.LINES.gaeksaConclusion);
        LOG.investigation.gaeksaSec = round(G.time - TIMES.room);
        setObjective(S.OBJECTIVES.exit);
        banner(S.OBJECTIVES.exit, '목표 갱신');
        R.exitOpen = true;
      }, 500);
    }
  }
  function renderNotebook(done) {
    const R = G.room, el = $('notebook');
    const notes = R.seen.map((id) => S.ROOM_SCENE.spots.find((s) => s.id === id).note);
    const last = notes.slice(-3);
    el.innerHTML = '<div style="color:#bdb4a2">사건 수첩</div>' + last.map((n) => `<div>· ${n}</div>`).join('') +
      `<div class="concl ${done || R.concluded ? 'done' : ''}">${done || R.concluded ? S.TEXT.notebookAfter : S.TEXT.notebookBefore}</div>`;
  }
  function updateRoom(dt) {
    moveControlled(dt);
    const R = G.room, me = ctlUnit();
    if (R.exitOpen && !R.leaving) {
      const b = S.ROOM_SCENE.backDoor;
      if (hyp(me.x - b[0], me.y - b[1]) < 26) {
        R.leaving = true;
        (async () => { await fade(true); enterCityInvestigation(); await fade(false); })();
      }
    }
  }

  // ═══════════════ 장면 3: 뒷골목 (조사 = 정찰) ═══════════════
  function enterCityInvestigation() {
    G.scene = 'city-inv'; G.world = CITY; G.bg = BG.city; G.worldH = S.H;
    $('notebook').style.display = 'none';
    const A = S.ALLEY_INVESTIGATION;
    const units = [];
    const me = mkUnit('yoon', A.spawn[0], A.spawn[1]); me.state = 'controlled'; units.push(me);
    ['hangyeol', 'yeoul', 'soun'].forEach((id, k) => { const u = mkUnit(id, A.followers[k][0], A.followers[k][1]); u.state = 'follow'; units.push(u); });
    G.units = units; G.ctlId = 'yoon';
    G.trail = [];
    for (let k = 0; k < 40; k++) G.trail.push({ x: A.spawn[0] + k * 2, y: A.spawn[1] });
    G.inv = { st: { stage: S, g: G.graph, w: CITY, units, gwihwa: [], barriers: [], runner: null, log: null, control: 'yoon' }, found: [], forkSeen: false, deadSeen: false, omen: false, triggered: false };
    TIMES.city = G.time;
    snapCam();
    updatePortraits();
  }
  function updateCityInv(dt) {
    const I = G.inv, A = S.ALLEY_INVESTIGATION;
    I.st.control = G.ctlId;
    moveControlled(dt);
    followers(dt);
    for (const u of G.units) {
      if (u.state === 'moving') { if (C.stepAlong(I.st, u, dt)) { u.state = 'guard'; u.path = []; } }
    }
    // 흔적: 아군 누구든 반경 60u 안 (순서 고정)
    const idx = I.found.length;
    if (idx < A.traces.length) {
      const tr = A.traces[idx];
      const who = G.units.find((u) => hyp(u.x - tr.pos[0], u.y - tr.pos[1]) <= A.traceRadius);
      if (who) {
        I.found.push(tr.id);
        LOG.investigation.traceAt[tr.id] = { t: round(G.time - TIMES.city), by: who.id };
        SFX.ui();
        toast(`흔적 — ${tr.name}`, 1.6);
        if (tr.id === 't1') guide(tr.pos, A.fork.pos, 3);
        if (tr.id === 't2') {
          bubble('soun', S.LINES.fragment[0][1], 2.6);
          setObjective(S.OBJECTIVES.official);
          banner(S.OBJECTIVES.official, '목표 갱신');
          guide(tr.pos, A.traces[2].pos, 3);
        }
        if (tr.id === 't3') guide(tr.pos, A.official, 3.5);
      }
    }
    // 갈래길: 흔적이 두 갈래로 보인다
    if (I.found.length >= 1 && !I.forkSeen && G.units.some((u) => hyp(u.x - A.fork.pos[0], u.y - A.fork.pos[1]) < 60)) {
      I.forkSeen = true;
      guide(A.fork.pos, A.fork.dead, 3.5); guide(A.fork.pos, A.fork.trueDir, 3.5);
      toast('흔적이 두 갈래로 보인다 — 동료를 나눠 보낼 수 있다 (초상 탭)', 2.8);
    }
    if (!I.deadSeen) {
      const who = G.units.find((u) => hyp(u.x - A.fork.dead[0], u.y - A.fork.dead[1]) < 40);
      if (who) {
        I.deadSeen = true;
        LOG.investigation.deadEndCheckedBy = who.id;
        LOG.investigation.deadEndCheckedByControlled = who.id === G.ctlId;
        const split = G.units.some((u) => u !== who && u.x < 40 && u.y > 500);
        LOG.investigation.forkSplit = LOG.investigation.forkSplit || split || who.id !== G.ctlId;
        G.effects.push({ kind: 'label', x: A.fork.dead[0], y: A.fork.dead[1] - 16, text: '막다른 갈래 ③ — 아무도 없다', t: 2.8 });
      }
    }
    if (!I.omen && ctlUnit().x < 200 && ctlUnit().y < 520) {
      I.omen = true;
      G.effects.push({ kind: 'omen', x: A.omen[0], y: A.omen[1], t: 1.4 });
    }
    // 관리: 아군 누구든 48u 안
    if (!I.triggered && I.found.length >= 3) {
      const who = G.units.find((u) => hyp(u.x - A.official[0], u.y - A.official[1]) <= A.officialTalkRadius);
      if (who) { I.triggered = true; officialEvent(); }
    }
  }
  function guide(a, b, t) { G.guides.push({ a, b, t, t0: t }); }

  async function officialEvent() {
    closeBoard();
    LOG.investigation.alleySec = round(G.time - TIMES.city);
    LOG.investigation.totalSec = round(G.time - TIMES.start);
    G.stick = null;
    await fade(true);
    const gp = S.ALLEY_INVESTIGATION.gather;
    for (const u of G.units) { u.x = gp[u.id][0]; u.y = gp[u.id][1]; u.state = 'guard'; u.path = []; u.target = null; }
    G.ctlId = 'yoon';
    snapCam();
    await wait(0.7);
    await fade(false);
    await say(S.LINES.official);
    // 전환점 ②: 시장 쪽 소란 → 카메라가 실제로 시장까지 이동
    G.scene = 'runner-appear';
    G.showRunnerAt = { x: S.CHASE_START.runner[0], y: S.CHASE_START.runner[1] };
    toast('시장 쪽에서 소란!', 1.6);
    G.camLock = { x: S.CHASE_START.runner[0], y: S.CHASE_START.runner[1] - 30 };
    // [2차 수정] 카메라가 시장에 가 있는 동안 네 명은 큰길 가운데로 뛰어나오고, 관군 2명은 광장 북쪽에 선다
    G.runOut = { t: 0, dur: 1.5, from: G.units.map((u) => ({ u, x: u.x, y: u.y })) };
    G.extraSoldiers = S.SOLDIERS.map((d) => ({ id: d.id, x: S.CHASE_START[d.id][0], y: S.CHASE_START[d.id][1] - 60, tx: S.CHASE_START[d.id][0], ty: S.CHASE_START[d.id][1], moving: true, facing: Math.PI / 2 }));
    await wait(1.5);
    bubble('runner', '', 0.01);
    await say(S.LINES.runnerAppears);
    await banner(S.TEXT.runnerName + ' — ' + S.OBJECTIVES.chase + '.', '임무 갱신', 1.6);
    G.camLock = null;
    G.runOut = null; G.extraSoldiers = null;
    startChase(false);
  }

  // ═══════════════ 장면 4: 추격 ═══════════════
  function startChase(isRetry) {
    G.scene = 'chase';
    G.chase = C.createChase(S, { graph: G.graph });
    G.units = G.chase.units;
    G.showRunnerAt = null;
    G.lastSeenDir = { x: 0, y: -1 };
    G.bubbles = []; G.effects = []; G.guides = []; G.ripples = [];
    setObjective(S.OBJECTIVES.chase);
    $('gateBars').style.display = 'flex';
    $('logBtn').style.display = 'block';
    TIMES.chase = G.time;
    G.chaseLog = { attempt: LOG.chases.length + 1, retry: !!isRetry, startedAtSec: round(G.time - TIMES.start) };
    snapCam();
    updatePortraits();
    // 초동: 명령판이 저절로 열리고 시간 30% (REVIEW-2 선택 2 → 관군1 의 명령판으로 연다: 관군은 명령으로만 움직이고 가장 느려 첫 수의 값이 크다)
    resetSlow();
    openBoard('sol1');
    G.board.auto = true;
    bubble('runner', '', 0.01);
  }

  function updateChase(dt) {
    const st = G.chase;
    const input = G.board.open ? { mx: 0, my: 0 } : readStick();
    input.action = actionPressed; actionPressed = false;
    C.step(st, dt, input);
    for (const ev of st.events) onChaseEvent(ev);
    st.events.length = 0;
    // 조종 인물 발소리
    const me = C.unit(st, st.control);
    if (me && me.moving) { G.stepT -= dt; if (G.stepT <= 0) { G.stepT = 0.32; } }
    // 운반자 발소리 파문 (어둠 속)
    const r = st.runner;
    if (!r.subdued && r.windup <= 0 && !r.held && !r.crouch) {
      G.rippleT = (G.rippleT || 0) - dt;
      if (G.rippleT <= 0) { G.rippleT = r.walkT > 0 ? 0.7 : 0.4; if (!runnerLit()) G.ripples.push({ x: r.x, y: r.y, t: 0.9 }); }
    }
    if (runnerLit()) G.lastSeenDir = { x: r.lastDir.x, y: r.lastDir.y };
    // 심장 소리: 가까운 성문까지 절반 이하
    const close = gateCloseness();
    if (Math.max(close.N, close.S) >= 0.5) { G.heartT -= dt; if (G.heartT <= 0) { G.heartT = 0.85; SFX.heart(); } }
    if (st.over && !G.ending) finishChase();
  }
  function onChaseEvent(ev) {
    switch (ev.type) {
      case 'routeWarn': SFX.alert(); break;
      case 'soloGrab': SFX.grab(); bubble(ev.by, '붙잡았다!', 0.8); break;
      case 'shake': SFX.shake(); bubble('runner', '…!', 0.7); break;
      case 'restraintStart': SFX.grab(); toast((G.chase.runner.cornered ? '궁지에서 붙잡았다' : '둘이 붙잡았다') + ' — 제압 중 (행동 버튼 연타)', 1.6); break;
      case 'restraintBreak': SFX.shake(); toast('놓쳤다!', 1); break;
      case 'breathOut': toast('운반자가 숨이 차 걷는다 — 3초', 1.6); break;
      case 'cornered': toast('궁지! — 한 명만 붙어도 제압된다', 2); break;
      case 'gwihwaAttack': SFX.hit(); break;
      case 'gwihwaHit': SFX.hit(); break;
      case 'gwihwaDown': toast('귀화를 퇴송했다', 1.2); break;
      case 'allyDown': toast(`${NAME[ev.id]} 퇴장`, 1.6); break;
      case 'seal': sealEvent(ev); break;
      case 'barrier': break;
    }
  }
  async function sealEvent(ev) {
    G.paused = true;
    closeBoard();
    const st = G.chase;
    // 봉인 문서 낙하: 그 자리로 짧게 줌 (연출 카메라 이동 2번 중 하나)
    G.camLock = { x: st.doc.x, y: st.doc.y };
    G.zoom = 1.25;
    G.effects.push({ kind: 'docfall', x: st.doc.x, y: st.doc.y, t: 1.2 });
    await wait(0.9);
    await say(S.LINES.seal);
    G.zoom = 1;
    G.camLock = null;
    SFX.gwihwa();
    toast('귀화 2마리 — 세워 둔 길목을 흔든다', 2);
    G.paused = false;
    void ev;
  }

  function finishChase() {
    const st = G.chase;
    G.ending = true;
    closeBoard();
    const rec = Object.assign({}, G.chaseLog, st.log, {
      soloGrabs: st.log.grabs.filter((g) => g.type === 'solo').length,
      restraints: st.log.grabs.filter((g) => g.type === 'restraint').length,
      aheadCommandRatioAfter60s: aheadRatio(st.log.commands),
      runnerPath: st.runner.path.filter((_, i) => i % 2 === 0),
      guardSpots: st.units.filter((u) => !u.down && u.state === 'guard').map((u) => ({ id: u.id, x: Math.round(u.x), y: Math.round(u.y), node: u.target })),
      gaugeLeft: round(st.runner.gauge),
    });
    LOG.chases.push(rec);
    if (st.over.result === 'win') winSequence();
    else defeatSequence(st.over);
  }
  function aheadRatio(cmds) {
    const late = cmds.filter((c) => c.t >= 60 && c.ahead !== null);
    if (!late.length) return null;
    return round(late.filter((c) => c.ahead).length / late.length);
  }

  // ── 패배: 짧은 컷 → 경로선 + 내가 세운 자리 → [추격부터 다시] ─────
  async function defeatSequence(over) {
    G.scene = 'defeat-cut';
    const st = G.chase;
    G.camLock = { x: st.runner.x, y: Math.max(40, Math.min(2120, st.runner.y)) };
    await wait(0.4);
    await fade(true);
    await wait(0.3);
    showResult(over);
    $('fade').classList.remove('on', 'hold');
  }
  function showResult(over) {
    G.scene = 'defeat';
    const why = over.result === 'escape' ? `운반자가 ${over.gate === 'N' ? '북문' : '남문'} 밖 어둠으로 사라졌다.` : over.result === 'timeout' ? '시간 초과 — 몰기만 하고 둘이 붙잡지 못했다.' : '전원 퇴장.';
    $('resTitle').textContent = over.result === 'escape' ? '탈출' : over.result === 'timeout' ? '시간 초과' : '전원 퇴장';
    $('resWhy').textContent = why + ' 주황 선 = 이번 판 운반자 경로 · 점 = 세운 자리';
    $('result').style.display = 'flex';
    TIMES.defeatShown = G.time;
    drawResultMap();
  }
  function drawResultMap() {
    const cv = $('resultMap'), c = cv.getContext('2d'), st = G.chase;
    // 도시 한 장을 가로 0.9 · 세로 0.2 로 눌러 한 화면에 (비율은 틀리지만 길 모양은 읽힌다)
    const sx = 330 / 360, sy = 452 / 2160, k = 2;
    c.setTransform(k * sx, 0, 0, k * sy, 0, 0);
    c.clearRect(0, 0, 360, 2160);
    c.fillStyle = '#12161b'; c.fillRect(0, 0, 360, 2160);
    for (const r of S.WALK) { c.fillStyle = r.kind === 'road' || r.kind === 'yard' || r.kind === 'gate' ? '#4c5054' : r.kind === 'market' ? '#524c42' : '#3b3f42'; c.fillRect(r.x0, Math.max(0, r.y0), r.x1 - r.x0, Math.min(2160, r.y1) - Math.max(0, r.y0)); }
    c.setTransform(k, 0, 0, k, 0, 0);
    const P = (x, y) => [x * sx, y * sy];
    c.fillStyle = '#e8d3a0'; c.font = '10px sans-serif'; c.textAlign = 'center';
    c.fillText('북문', ...P(180, 60)); c.fillText('남문', ...P(180, 2150));
    // 경로선
    c.strokeStyle = COLORS.runner; c.lineWidth = 2.2; c.beginPath();
    st.runner.path.forEach(([, x, y], i) => { const [px, py] = P(x, Math.max(0, Math.min(2160, y))); if (i) c.lineTo(px, py); else c.moveTo(px, py); });
    c.stroke();
    const last = st.runner.path[st.runner.path.length - 1];
    if (last) { const [px, py] = P(last[1], Math.max(0, Math.min(2160, last[2]))); c.fillStyle = COLORS.runner; c.beginPath(); c.arc(px, py, 4, 0, 7); c.fill(); }
    // 내가 세운 자리 (명령 매듭) + 지금 자리
    for (const cmd of st.log.commands) {
      const def = S.COMMAND_NODES.find((n) => n.id === cmd.node);
      if (!def) continue;
      const [px, py] = P(S.NODES[def.id] ? S.NODES[def.id][0] : def.slots[0][0], S.NODES[def.id] ? S.NODES[def.id][1] : def.slots[0][1]);
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; c.beginPath(); c.arc(px, py, 7, 0, 7); c.stroke();
    }
    for (const u of st.units) {
      const [px, py] = P(u.x, u.y);
      c.fillStyle = u.down ? '#555' : u.kind === 'soldier' ? COLORS.soldier : COLORS.ally;
      c.beginPath(); c.arc(px, py, 5, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.font = '9px sans-serif'; c.fillText(u.short, px, py - 7);
    }
  }
  $('btnRetry').addEventListener('click', () => {
    LOG.retries.push({ attempt: LOG.chases.length, afterSec: round(G.time - TIMES.defeatShown) });
    $('result').style.display = 'none';
    G.ending = null; G.camLock = null;
    startChase(true);
  });

  // ── 승리 → 엔딩 (부록 A) ──────────────────────────────────
  async function winSequence() {
    G.scene = 'ending';
    const st = G.chase;
    $('gateBars').style.display = 'none';
    $('timer').textContent = '';
    G.camLock = { x: st.runner.x, y: st.runner.y };

    G.ledger = null;
    // 급보: 관군이 실제로 화면 안으로 달려온다

    await wait(2.8);
    const ec = $('endCard');

    ec.querySelector('.res').textContent = S.TEXT.result;
    ec.style.display = 'flex';
    await wait(0.1); ec.classList.add('show');
    await wait(1.6); ec.classList.add('show2');
    LOG.ending = { reached: true, atSec: round(G.time - TIMES.start) };
    G.scene = 'end';
  }
  $('btnRestart').addEventListener('click', () => location.reload());

  // ── 플레이 기록 JSON ────────────────────────────────────────
  function showLog() {
    const out = JSON.parse(JSON.stringify(LOG));
    out.summary = {
      H1_aheadRatioAfter60s: out.chases.map((c) => c.aheadCommandRatioAfter60s),
      H1_soloThenRestraint: out.chases.map((c) => ({ solo: c.soloGrabs, restraint: c.restraints })),
      H2_soldierNodes: out.chases.map((c) => c.commands.filter((x) => x.unit.startsWith('sol')).map((x) => x.node)),
      H2_barrierUses: out.chases.map((c) => c.skills.filter((s) => s.kind === 'barrier').length),
      H3_retryWithin10s: out.retries.map((r) => r.afterSec <= 10),
      H3_firstCommand: out.chases.map((c) => c.commands[0] ? c.commands[0].unit + '→' + c.commands[0].node : null),
      H4_investigationSec: out.investigation.totalSec, H4_idleSec: out.investigation.idleSec,
      results: out.chases.map((c) => c.result),
    };
    if (G.chase && !G.chase.over) out.currentChase = { t: round(G.chase.t), commands: G.chase.log.commands, switches: G.chase.log.switches, skills: G.chase.log.skills, grabs: G.chase.log.grabs, routeChanges: G.chase.log.routeChanges };
    $('logText').value = JSON.stringify(out, null, 1);
    $('logPanel').style.display = 'flex';
    G.logOpen = true; G.paused = true;
  }
  $('btnLog1').addEventListener('click', showLog);
  $('btnLog2').addEventListener('click', showLog);
  $('logBtn').addEventListener('click', showLog);
  $('logClose').addEventListener('click', () => { $('logPanel').style.display = 'none'; G.logOpen = false; if (!dlg && G.scene !== 'ending') G.paused = false; });
  $('logCopy').addEventListener('click', () => {
    const t = $('logText'); t.select();
    try { navigator.clipboard.writeText(t.value).then(() => toast('복사했다', 1), () => document.execCommand('copy')); } catch (e) { document.execCommand('copy'); }
  });

  // ── 이동 공통 ─────────────────────────────────────────────
  function ctlUnit() { return (G.chase && G.scene === 'chase') ? C.unit(G.chase, G.chase.control) : G.units.find((u) => u.id === G.ctlId); }
  function moveControlled(dt) {
    const me = ctlUnit(); if (!me) return;
    const { mx, my } = G.board.open ? { mx: 0, my: 0 } : readStick();
    const m = Math.min(1, hyp(mx, my));
    me.moving = false;
    if (m > 0.05) {
      const sp = me.speed * m * (C.inMarket(G.world, me.x, me.y) ? K.MARKET_SLOW : 1) * dt;
      const q = C.moveCircle(G.world, me, mx / m * sp, my / m * sp, K.R_BODY);
      if (hyp(q.x - me.x, q.y - me.y) > 0.01) { me.x = q.x; me.y = q.y; me.moving = true; me.facing = Math.atan2(my, mx); }
      G.idleFrom = null;
      const last = G.trail[0];
      if (!last || hyp(last.x - me.x, last.y - me.y) >= 2) { G.trail.unshift({ x: me.x, y: me.y }); if (G.trail.length > 200) G.trail.pop(); }
    } else if (!G.paused) {
      LOG.investigation.idleSec = round(LOG.investigation.idleSec + dt);
    }
  }
  // 한 줄로 따라온다 (몸 1개 간격)
  function followers(dt) {
    let k = 0;
    for (const u of G.units) {
      if (u.id === G.ctlId) continue;
      u.moving = false;
      if (u.state !== 'follow') continue;
      k++;
      const want = 26 * k;
      let acc = 0, target = G.trail[G.trail.length - 1];
      const me = ctlUnit();
      let prev = { x: me.x, y: me.y };
      for (const p of G.trail) { acc += hyp(p.x - prev.x, p.y - prev.y); prev = p; if (acc >= want) { target = p; break; } }
      if (!target) continue;
      const d = hyp(target.x - u.x, target.y - u.y);
      if (d > 1) {
        const sp = Math.min(d, Math.max(u.speed, 52) * dt * (d > 40 ? 1.4 : 1));
        const q = C.moveCircle(G.world, u, (target.x - u.x) / d * sp, (target.y - u.y) / d * sp, K.R_BODY);
        if (hyp(q.x - u.x, q.y - u.y) < sp * 0.3 && d > 30) { u.x = target.x; u.y = target.y; } else { u.x = q.x; u.y = q.y; }
        u.moving = true; u.facing = Math.atan2(target.y - u.y, target.x - u.x);
      }
    }
  }

  // ── 카메라 ─────────────────────────────────────────────
  // 기본: 조종 인물을 맵 영역(64~576) 높이 45% 에. 명령판이 열리면 운반자를 위 영역(64~320) 가운데로.
  function camWant() {
    if (G.camLock) return { x: G.camLock.x, y: G.camLock.y - (G.scene === 'runner-appear' ? 0 : 0), sy: 300 };
    if (G.chase && G.board.open && G.scene === 'chase') return { x: G.chase.runner.x, y: G.chase.runner.y, sy: 188 };
    const me = ctlUnit();
    return me ? { x: me.x, y: me.y, sy: 64 + 0.45 * 512 } : { x: 180, y: 300, sy: 300 };
  }
  function snapCam() { setWS(); const w = camWant(); G.cam.x = 0; G.cam.y = clampCamY(w.y - w.sy / WS); }
  function clampCamY(y) { const H = G.worldH || 640; return Math.max(-70, Math.min(H - 640 / WS + 70, y)); }
  function updateCam(dt) {
    setWS();
    const w = camWant();
    const ty = clampCamY(w.y - w.sy / WS);
    const k = 1 - Math.pow(0.0025, dt);
    G.cam.y += (ty - G.cam.y) * k;
    G.cam.x = 0;
  }

  // ── 그리기 ───────────────────────────────────────────────
  function runnerLit() {
    if (!G.chase) return true;
    const r = G.chase.runner;
    return S.LANTERNS.some(([x, y, rad]) => hyp(r.x - x, r.y - y) < rad * 0.9);
  }
  function gateCloseness() {
    const st = G.chase; if (!st) return { N: 0, S: 0 };
    return { N: Math.max(0, 1 - st.gateDist.N / Math.max(st.gateDist0.N, 1)), S: Math.max(0, 1 - st.gateDist.S / Math.max(st.gateDist0.S, 1)) };
  }
  function draw() {
    const c = ctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, 360, 640);
    c.fillStyle = '#0a0d11'; c.fillRect(0, 0, 360, 640);
    if (G.ledger) { drawLedger(c); return; }
    if (!G.bg) return;
    const zoom = G.zoom || 1;
    c.save();
    if (zoom !== 1) { c.translate(180, 300); c.scale(zoom, zoom); c.translate(-180, -300); }
    c.scale(WS, WS);
    c.translate(-G.cam.x, -G.cam.y);
    // 배경 (보이는 부분만)
    const bg = G.bg, y0 = Math.max(-bg.top, G.cam.y - 20), h = Math.min(760, (bg.cv.height / bg.sc) - (y0 + bg.top));
    c.drawImage(bg.cv, 0, (y0 + bg.top) * bg.sc, 360 * bg.sc, h * bg.sc, 0, y0, 360, h);
    if (G.scene === 'room') drawRoomSpots(c);
    if (G.inv && G.scene !== 'chase') drawTraces(c);
    drawGuides(c);
    if (G.chase && (G.scene === 'chase' || G.scene === 'defeat-cut' || G.scene === 'ending')) drawChaseWorld(c);
    else drawUnitsPlain(c);
    drawEffects(c);
    drawBubbles(c);
    c.restore();
    if (G.chase && G.scene === 'chase') { drawOffscreenArrow(c); drawMinimap(c); }
    if (G.scene === 'city-inv' || G.scene === 'runner-appear') drawMinimap(c);
    drawStick(c);
    drawAim(c);
  }
  function drawUnitsPlain(c) {
    const list = G.units.slice();
    if (G.scene === 'city-inv' || G.scene === 'runner-appear') {
      const A = S.ALLEY_INVESTIGATION;
      const offVisible = G.inv && G.inv.found.length >= 3;
      drawUnit(c, { id: 'official', x: A.official[0], y: A.official[1], moving: false }, COLORS.official, { img: IMG.official, alpha: offVisible || G.scene === 'runner-appear' ? 1 : 0.25 });
    }
    for (const m of G.extraSoldiers || []) drawUnit(c, m, COLORS.soldier, { img: IMG.sol });
    if (G.showRunnerAt) drawUnit(c, { id: 'runner', x: G.showRunnerAt.x, y: G.showRunnerAt.y, moving: true, facing: -1.2 }, COLORS.runner, { img: IMG.runner });
    list.sort((a, b) => a.y - b.y);
    for (const u of list) drawUnit(c, u, COLORS.ally, { guardRing: G.scene === 'city-inv' && u.state === 'guard' });
  }
  function drawRoomSpots(c) {
    const me = ctlUnit();
    for (const sp of S.ROOM_SCENE.spots) {
      const d = hyp(me.x - sp.pos[0], me.y - sp.pos[1]);
      const seen = G.room.seen.includes(sp.id);
      if (d < 70 || seen) {
        c.save(); c.globalAlpha = seen ? 0.25 : Math.min(1, (70 - d) / 30);
        c.strokeStyle = '#fff'; c.lineWidth = 2; c.shadowColor = '#fff'; c.shadowBlur = 10;
        c.beginPath(); c.arc(sp.pos[0], sp.pos[1], 13, 0, 7); c.stroke();
        c.restore();
        if (d < 70 && !seen) { c.fillStyle = 'rgba(255,255,255,.85)'; c.font = '11px sans-serif'; c.textAlign = 'center'; c.fillText(sp.name, sp.pos[0], sp.pos[1] - 18); }
      }
    }
    if (G.room.exitOpen) {
      const b = S.ROOM_SCENE.backDoor;
      const a = 0.5 + 0.5 * Math.sin(G.time * 4);
      c.fillStyle = `rgba(255,255,255,${0.35 + 0.4 * a})`;
      for (let i = 0; i < 3; i++) { c.beginPath(); c.ellipse(b[0] + (i % 2 ? 5 : -5), b[1] + 34 - i * 12, 3, 5, 0, 0, 7); c.fill(); }
      c.font = '11px sans-serif'; c.textAlign = 'center'; c.fillText('뒷문', b[0], b[1] - 4);
    }
  }
  function drawTraces(c) {
    const A = S.ALLEY_INVESTIGATION, I = G.inv;
    A.traces.forEach((tr, i) => {
      const found = I.found.includes(tr.id);
      if (!found) return;
      c.save(); c.globalAlpha = 0.85;
      if (tr.id === 't1') { c.fillStyle = '#ddd'; for (let k = 0; k < 5; k++) { c.beginPath(); c.ellipse(tr.pos[0] + 10 - k * 9, tr.pos[1] + (k % 2 ? 4 : -4), 2.5, 4, Math.PI / 2, 0, 7); c.fill(); } }
      if (tr.id === 't2') { c.fillStyle = '#e8dcc0'; c.save(); c.translate(tr.pos[0], tr.pos[1]); c.rotate(0.4); c.fillRect(-6, -4, 12, 8); c.restore(); c.strokeStyle = '#fff'; c.shadowColor = '#fff'; c.shadowBlur = 8; c.beginPath(); c.arc(tr.pos[0], tr.pos[1], 11, 0, 7); c.stroke(); }
      if (tr.id === 't3') { c.strokeStyle = 'rgba(200,200,200,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(tr.pos[0] - 3, tr.pos[1] - 30); c.quadraticCurveTo(tr.pos[0] + 4, tr.pos[1], tr.pos[0] - 1, tr.pos[1] + 34); c.stroke(); c.beginPath(); c.moveTo(tr.pos[0] + 4, tr.pos[1] - 30); c.quadraticCurveTo(tr.pos[0] + 9, tr.pos[1], tr.pos[0] + 5, tr.pos[1] + 34); c.stroke(); }
      c.restore();
      void i;
    });
  }
  function drawGuides(c) {
    for (const g of G.guides) {
      c.save(); c.globalAlpha = Math.min(1, g.t / g.t0 * 1.5) * 0.7;
      c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.setLineDash([4, 6]); c.lineDashOffset = -G.time * 20;
      c.beginPath(); c.moveTo(g.a[0], g.a[1]); c.lineTo(g.b[0], g.b[1]); c.stroke(); c.restore();
    }
  }
  function drawChaseWorld(c) {
    const st = G.chase, r = st.runner;
    // 결계 (한지 금줄 느낌의 옅은 금색 선 — 청백 발광은 귀화·봉인 문서에만)
    for (const b of st.barriers) {
      c.save(); c.globalAlpha = Math.min(1, b.t / 2 + 0.3);
      c.strokeStyle = '#e8d3a0'; c.lineWidth = 5; c.lineCap = 'round'; c.shadowColor = '#e8d3a0'; c.shadowBlur = 8;
      c.beginPath(); c.moveTo(b.x1, b.y1); c.lineTo(b.x2, b.y2); c.stroke();
      c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke(); c.restore();
    }
    if (st.doc) {
      c.save(); c.shadowColor = '#bfe6ff'; c.shadowBlur = 14; c.fillStyle = '#e9e4d0';
      c.translate(st.doc.x + 14, st.doc.y + 10); c.rotate(-0.3); c.fillRect(-7, -5, 14, 10);
      c.strokeStyle = '#b33'; c.lineWidth = 1; c.strokeRect(-4, -3, 8, 6); c.restore();
    }
    // 발소리 파문
    for (const p of G.ripples) { c.save(); c.globalAlpha = p.t * 0.6; c.strokeStyle = COLORS.runner; c.lineWidth = 1; c.beginPath(); c.arc(p.x, p.y, 14 + (0.9 - p.t) * 22, 0, 7); c.stroke(); c.restore(); }
    const list = [];
    for (const u of st.units) list.push({ u, kind: 'ally' });
    for (const gw of st.gwihwa) list.push({ u: gw, kind: 'gw' });
    list.push({ u: r, kind: 'runner' });
    if (G.messenger) list.push({ u: G.messenger, kind: 'msg' });
    list.sort((a, b) => a.u.y - b.u.y);
    const lit = runnerLit();
    for (const it of list) {

  // ── 메인 루프 ──────────────────────────────────────────────
  let lastT = performance.now(), acc = 0;

  function frame(now) {

    // 명령판이 열려 있는 동안 시간 30% (최대 3초, 그 뒤엔 정상 속도로 판만 열려 있음)
    let scale = 1;

      const key = G.board.auto ? 'initial' : 'pool';
      if (G.slow[key] > 0) { scale = SLOW.SCALE; G.slow[key] = Math.max(0, G.slow[key] - real); }
    }
    if (!G.paused && !G.logOpen) {
      acc += real * scale;
      let n = 0;
      while (acc >= STEP && n++ < 8) { tick(STEP); acc -= STEP; }
    } else acc = 0;
    for (const b of G.bubbles) b.t -= real;
    G.bubbles = G.bubbles.filter((b) => b.t > 0);
    for (const e of G.effects) e.t -= real;
    G.effects = G.effects.filter((e) => e.t > 0);

        // 갈래 ① 마당 → 중앙 가로골목 어귀 → 큰길 가운데 (벽을 뚫지 않게 두 토막)
        const mid = { x: 130, y: 1080 };
        const p = k < 0.5 ? { a: f, b: mid, s: k / 0.5 } : { a: mid, b: { x: to[0], y: to[1] }, s: (k - 0.5) / 0.5 };
        f.u.x = p.a.x + (p.b.x - p.a.x) * p.s; f.u.y = p.a.y + (p.b.y - p.a.y) * p.s;
        f.u.moving = k < 1; f.u.facing = Math.atan2(p.b.y - p.a.y, p.b.x - p.a.x);

    }

  function round(v) { return Math.round(v * 100) / 100; }

  function onAssets() {
    buildCityBG(); buildYardBG(); buildRoomBG();
    G.graph = C.buildGraph(S);
    buildPortraits(); buildBoard();
    // 재도전·플레이테스트용 바로가기: ?start=chase 면 추격부터 (기본은 메뉴 없이 객사 마당부터)
    if (/[?&]start=chase\b/.test(location.search)) {
      TIMES.start = G.time; G.world = CITY; G.bg = BG.city; G.worldH = S.H;
      LOG.investigation.skipped = true;
      startChase(false);
    } else enterYard();
    requestAnimationFrame(frame);
  }

  // QA 용 (화면 확인 스크립트가 상태를 읽는다. 게임 규칙에는 쓰지 않음)
  window.__pilot = { G, LOG, S, C, showLog };
})();
</script>
